<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crack It - The Combination Game</title>
    <style>
        /* --- General and Reset --- */
        :root {
            --color-background: #1a1a2e;
            --color-surface: #2c2c47;
            --color-primary: #e94560;
            --color-text-light: #f5f5f5;
            --color-text-dark: #1a1a2e;
            --color-green: #38b000;
            --color-orange: #ff9900;
            --color-red: #cc0000;
            --color-shadow: rgba(0, 0, 0, 0.4);
            --font-stack: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --light-size: 20px;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--color-background);
            color: var(--color-text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            user-select: none;
        }

        #game-container {
            background: var(--color-surface);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px var(--color-shadow);
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            transition: all 0.3s ease-in-out;
        }

        /* --- Start Screen Styles --- */
        #start-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            text-align: center;
        }

        #start-screen h1 {
            color: var(--color-primary);
            font-size: 2.5em;
            margin-bottom: 0.5em;
        }

        .setting-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--color-background);
            padding: 15px;
            border-radius: 10px;
        }

        .setting-group label {
            font-size: 1.1em;
            font-weight: bold;
        }

        select {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: var(--color-surface);
            color: var(--color-text-light);
            cursor: pointer;
            min-width: 120px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--color-red);
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--color-green);
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: #d8344e;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .error-message {
            color: var(--color-red);
            font-weight: bold;
            height: 20px;
        }

        /* --- Game Play Screen Styles --- */
        #game-play {
            display: none;
            grid-template-areas:
                "header header"
                "history main"
                "history main";
            grid-template-columns: 1fr 2fr;
            /* Default: History | Main */
            gap: 20px;
            min-height: 500px;
        }

        #game-header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--color-primary);
        }

        #game-info,
        #timer {
            font-size: 1.2em;
            font-weight: bold;
        }

        /* --- History Board (Left Side) --- */
        #history-board {
            grid-area: history;
            background: var(--color-background);
            padding: 10px;
            border-radius: 10px;
            overflow-y: auto;
            max-height: 400px;
            /* Limit height for scrollability */
        }

        #history-board h3 {
            margin-top: 0;
            color: var(--color-primary);
        }

        .guess-row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
            padding: 5px;
            border-bottom: 1px dashed #3a3a5e;
        }

        .guess-digit {
            font-family: monospace;
            font-size: 1.1em;
            font-weight: bold;
            width: 20px;
            text-align: center;
        }

        .color-green {
            color: var(--color-green);
        }

        .color-orange {
            color: var(--color-orange);
        }

        .color-red {
            color: var(--color-red);
        }

        /* --- Main Game Area (Center) --- */
        #main-game-area {
            grid-area: main;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Feedback Lights */
        #feedback-lights {
            display: flex;
            justify-content: center;
            gap: 15px;
            height: var(--light-size);
            margin-bottom: 15px;
        }

        .light {
            width: var(--light-size);
            height: var(--light-size);
            border-radius: 50%;
            background-color: var(--color-red);
            /* Default to red/off */
            box-shadow: 0 0 5px var(--color-shadow);
            transition: background-color 0.3s;
        }

        .light.lit-green {
            background-color: var(--color-green);
            box-shadow: 0 0 10px var(--color-green);
        }

        .light.lit-orange {
            background-color: var(--color-orange);
            box-shadow: 0 0 10px var(--color-orange);
        }

        .light.lit-red {
            background-color: var(--color-red);
            box-shadow: 0 0 10px var(--color-red);
        }

        /* Input Boxes */
        #input-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .input-digit {
            width: 50px;
            height: 70px;
            background: var(--color-background);
            border: 2px solid var(--color-primary);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            font-weight: bold;
            color: var(--color-text-light);
            transition: all 0.2s;
        }

        .input-digit.active {
            border-color: var(--color-green);
            box-shadow: 0 0 15px var(--color-green);
        }

        /* Keypad */
        #keypad {
            display: grid;
            /* Changed to 3 columns, 4 rows for 10 digits + clear + enter */
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }

        .keypad-btn {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5em;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .keypad-btn:hover {
            background-color: #d8344e;
        }

        .keypad-btn:active {
            transform: scale(0.95);
        }

        /* REMOVED: #keypad-enter grid-column: span 2; */
        #keypad-enter {
            /* Now same size as others, only background color change */
            background-color: var(--color-green);
        }

        #keypad-enter:hover {
            background-color: #2e9700;
        }

        #keypad-clear {
            background-color: var(--color-red);
        }

        #keypad-clear:hover {
            background-color: #b00000;
        }

        /* --- Game Over Modal --- */
        #game-over-modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--color-surface);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 5px 15px var(--color-shadow);
        }

        .modal-content h2 {
            color: var(--color-green);
            margin-top: 0;
            font-size: 2em;
        }

        .modal-content p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        /* --- Responsiveness (Mobile First) --- */
        @media (max-width: 600px) {
            #game-container {
                padding: 10px;
                border-radius: 10px;
            }

            #game-play {
                grid-template-areas:
                    "header"
                    "main"
                    "history";
                grid-template-columns: 1fr;
                min-height: auto;
            }

            #history-board {
                max-height: 200px;
            }

            .input-digit {
                width: 40px;
                height: 60px;
                font-size: 1.8em;
            }

            .keypad-btn {
                padding: 10px;
                font-size: 1.3em;
            }

            .setting-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

    </div>

            <button class="btn-primary" onclick="window.location.reload()">Play Again</button>

        const correctAudio = new Audio('sounds/correct.wav');
        const entertAudio = new Audio('sounds/flip.wav');

        // --- Core Game Variables ---
        let levelCodes = JSON.parse(LEVEL_CODES_JSON);
        let currentLevel = 1; // 1, 2, or 3
        let currentCombo = ''; // The target combination for the current level
        let playerInput = []; // Current digits entered by the player
        let timerInterval;
        let startTime;

        // --- DOM Elements ---
        const startScreen = document.getElementById('start-screen');
        const gamePlay = document.getElementById('game-play');
        const levelSelect = document.getElementById('level-select');
        const randomSwitch = document.getElementById('random-switch');
        const startGameBtn = document.getElementById('start-game-btn');
        const startError = document.getElementById('start-error');
        const gameInfo = document.getElementById('game-info');
        const timerDisplay = document.getElementById('timer');
        const historyBoard = document.getElementById('history-board');
        const feedbackLights = document.getElementById('feedback-lights');
        const inputBox = document.getElementById('input-box');
        const keypad = document.getElementById('keypad');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalTimeDisplay = document.getElementById('final-time');

        // --- Utility Functions ---

        /**
         * Formats time in seconds into MM:SS string.
         * @param {number} totalSeconds - The total elapsed seconds.
         * @returns {string} Formatted time string.
         */
        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        /**
         * Initializes the dropdown with level sets from the JSON data.
         */
        function populateLevelSelect() {
            levelCodes.forEach((levelSet, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = levelSet.name || `Level Set ${index + 1}`;
                levelSelect.appendChild(option);
            });
        }

        // --- Game Setup and Start ---

        /**
         * Handles the click on the Start Game button.
         */
        function handleStartGame() {
            startError.textContent = '';

            let selectedLevelSet;
            if (randomSwitch.checked) {
                const randomIndex = Math.floor(Math.random() * levelCodes.length);
                selectedLevelSet = levelCodes[randomIndex];
            } else {
                const selectedIndex = parseInt(levelSelect.value);
                selectedLevelSet = levelCodes[selectedIndex];
            }

            if (!selectedLevelSet) {
                startError.textContent = "Error: Could not select a level set.";
                return;
            }

            // Store the selected level set for use throughout the game
            window.activeLevelSet = selectedLevelSet;

            // Transition to Level 1
            startScreen.style.display = 'none';
            gamePlay.style.display = 'grid';

            // Start the timer
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);

            // Begin the first level
            startLevel(1);
        }

        /**
         * Starts a new level (1, 2, or 3).
         * @param {number} level - The level number to start.
         */
        function startLevel(level) {
            currentLevel = level;
            const levelKey = `level${level}`;
            currentCombo = window.activeLevelSet[levelKey];
            playerInput = [];
            historyBoard.innerHTML = '<h3>Guess History</h3>'; // Clear history for new level

            if (!currentCombo) {
                console.error(`Combination for ${levelKey} not found.`);
                return;
            }

            const digitLength = currentCombo.length;
            gameInfo.textContent = `Level ${level} (${digitLength} Digits)`;

            // Re-render the input boxes and lights
            renderGameElements(digitLength);
        }

        /**
         * Renders the input boxes and feedback lights based on the required digit length.
         * @param {number} length - The required length of the combination.
         */
        function renderGameElements(length) {
            // Render Input Boxes
            inputBox.innerHTML = '';
            feedbackLights.innerHTML = '';
            for (let i = 0; i < length; i++) {
                const digitDiv = document.createElement('div');
                digitDiv.classList.add('input-digit');
                digitDiv.id = `input-digit-${i}`;
                inputBox.appendChild(digitDiv);

                const lightDiv = document.createElement('div');
                lightDiv.classList.add('light');
                lightDiv.id = `light-${i}`;
                feedbackLights.appendChild(lightDiv);
            }
            updateInputDisplay();
            updateLights([]); // Reset lights
        }

        // --- Game Logic ---

        /**
         * Updates the display of the player's current input and the active box.
         */
        function updateInputDisplay() {
            const digitElements = inputBox.querySelectorAll('.input-digit');
            digitElements.forEach((el, index) => {
                el.textContent = playerInput[index] || '';
                el.classList.remove('active');
                if (index === playerInput.length && index < currentCombo.length) {
                    el.classList.add('active'); // Highlight the next expected input
                }
            });
            // If the input is full, remove active highlight
            if (playerInput.length === currentCombo.length) {
                digitElements[currentCombo.length - 1].classList.remove('active');
            }
        }

        /**
         * Updates the feedback lights based on the check result.
         * @param {string[]} feedback - Array of 'green', 'orange', or 'red' strings.
         */
        function updateLights(feedback) {
            const lightElements = feedbackLights.querySelectorAll('.light');
            lightElements.forEach((light, index) => {
                light.className = 'light'; // Reset classes
                if (feedback[index]) {
                    light.classList.add(`lit-${feedback[index]}`);
                }
            });
        }

        /**
         * Checks the player's guess against the current combination.
         * @returns {{isCorrect: boolean, feedback: string[]}}
         */
        function checkGuess() {
            const guess = playerInput.join('');
            const target = currentCombo;
            const targetDigits = target.split('');
            const feedback = new Array(target.length).fill('red'); // Default to red (incorrect/not present)
            let isCorrect = true;

            if (guess.length !== target.length) return { isCorrect: false, feedback: feedback };

            // 1. Check for Green (Correct position)
            for (let i = 0; i < target.length; i++) {
                if (guess[i] === target[i]) {
                    feedback[i] = 'green';
                } else {
                    isCorrect = false;
                }
            }

            // 2. Check for Orange (Correct digit, wrong position)
            // Note: Green positions are handled, now check non-green positions for orange/red
            for (let i = 0; i < target.length; i++) {
                if (feedback[i] === 'red' && target.includes(guess[i])) {
                    // Check if this digit has already been "matched" as green or orange 
                    // (This is a simplified check that works for most combination games, 
                    //  but a full "Mastermind" implementation is more complex. This meets the stated requirement.)
                    feedback[i] = 'orange';
                }
            }

            return { isCorrect, feedback };
        }

        /**
         * Adds the current guess to the history board.
         * @param {string[]} feedback - Array of 'green', 'orange', or 'red' strings.
         */
        function addGuessToHistory(feedback) {
            const guessRow = document.createElement('div');
            guessRow.classList.add('guess-row');

            playerInput.forEach((digit, index) => {
                const digitSpan = document.createElement('span');
                digitSpan.classList.add('guess-digit', `color-${feedback[index]}`);
                digitSpan.textContent = digit;
                guessRow.appendChild(digitSpan);
            });

            // Prepend the new guess to the history board
            const historyTitle = historyBoard.querySelector('h3');
            historyBoard.insertBefore(guessRow, historyTitle.nextSibling);
        }

        /**
         * Called when the player presses the ENTER button.
         */
        function handleEnter() {
            if (playerInput.length !== currentCombo.length) {
                // Not enough digits
                return;
            }

            const { isCorrect, feedback } = checkGuess();

            updateLights(feedback);
            addGuessToHistory(feedback);

            if (isCorrect) {
                // START OF AUDIO MODIFICATION 3
                correctAudio.play();
                // Success!
                setTimeout(() => {
                    if (currentLevel < 3) {
                        startLevel(currentLevel + 1);
                    } else {
                        endGame();
                    }
                }, 500); // Wait half a second for feedback to register
            } else {
                // Reset input for next guess
                playerInput = [];
                setTimeout(updateInputDisplay, 100);
            }
        }

        /**
         * Updates the elapsed time display.
         */
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            timerDisplay.textContent = `Time: ${formatTime(elapsed)}`;
            window.totalElapsedTime = elapsed;
        }

        /**
         * Ends the game and displays the results.
         */
        function endGame() {
            clearInterval(timerInterval);

            finalTimeDisplay.textContent = `Total Time: ${formatTime(window.totalElapsedTime)}`;
            gameOverModal.style.display = 'flex';
        }

        // --- Event Handlers ---

        // Keypad button click handler
        keypad.addEventListener('click', (e) => {
            const btn = e.target.closest('.keypad-btn');
            if (!btn) return;

            const value = btn.getAttribute('data-value');

            if (value >= '0' && value <= '9') {
                // Play a fresh sound on every number press
                beepPopAudio.currentTime = 0;
                beepPopAudio.play();
                // Digit Input
                if (playerInput.length < currentCombo.length) {
                    playerInput.push(value);
                    updateInputDisplay();
                }
            } else if (value === 'clear') {
                // Clear/Delete
                playerInput.pop();
                updateInputDisplay();
                updateLights([]); // Clear lights on delete
            } else if (value === 'enter') {
                // Enter Guess
                entertAudio.currentTime = 0;
                entertAudio.play();
                handleEnter();
            }
        });

        // Start button handler
        startGameBtn.addEventListener('click', handleStartGame);

        // Random switch handler
        randomSwitch.addEventListener('change', () => {
            levelSelect.disabled = randomSwitch.checked;
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            populateLevelSelect();
        });
    </script>
</body>

</html>
