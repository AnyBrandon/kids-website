<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Countdown — 4-Player Tablet Game</title>
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --accent: #ff6b6b;
            --safe: #60a5fa;
            --text: #e6eef8
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
            background: linear-gradient(180deg, #071026 0%, #071020 100%);
            color: var(--text);
            -webkit-tap-highlight-color: transparent
        }

        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 12px
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 14px 18px;
            background: rgba(11, 18, 32, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        /* Title glow */
        header h1 {
            font-size: 26px;
            margin: 0;
            background: linear-gradient(90deg, #60a5fa, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(255, 107, 107, 0.4);
            font-weight: 700;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px
        }

        .player {
            background: var(--card);
            border-radius: 14px;
            padding: 14px;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center
        }

        .player h2 {
            margin: 0 0 6px 0;
            font-size: 20px
        }

        .box {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            background: linear-gradient(180deg, #0b1626, #071225);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 18px;
            touch-action: manipulation
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .big-btn {
            background: var(--accent);
            border: 0;
            padding: 10px 16px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 16px
        }

        .timer {
            font-size: 28px;
            font-weight: 800;
            color: var(--safe);
            font-family: 'Courier New', monospace;
            padding: 6px 14px;
            border-radius: 10px;
            background: rgba(8, 20, 35, 0.65);
            box-shadow: inset 0 0 10px rgba(96, 165, 250, 0.4);
            border: 1px solid rgba(96, 165, 250, 0.4);
            text-shadow: 0 0 8px rgba(96, 165, 250, 0.6);
        }

        /* Make the Start Round button pop */
        .big-btn#startBtn {
            background: linear-gradient(90deg, #ff6b6b, #ff9671);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .big-btn#startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.7);
        }

        .lives {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            margin-bottom: 12px;
            /* 👈 add some space below lives */
            justify-content: center;
        }

        .player .reveal {
            margin-top: 6px;
            /* extra buffer above the button */
        }

        .life {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2b8a4d
        }

        .life.dead {
            background: #6b2232
        }

        footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .modal-back {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200
        }

        .modal {
            background: linear-gradient(180deg, #071b2a, #08202f);
            padding: 20px;
            border-radius: 14px;
            max-width: 560px;
            width: 92%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6)
        }

        .notice {
            font-size: 15px;
            opacity: .95;
            margin-bottom: 12px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        select,
        button {
            font-family: inherit
        }

        @media(max-width:768px) {
            .box {
                width: 40vw;
                height: 40vw
            }

            .player {
                min-height: 220px
            }
        }

        .box img.box-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
            pointer-events: none;
            /* avoid accidental clicks on the image */
        }

        .reveal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .reveal-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1>The Countdown: 4 players, 2 minutes, 1 Bomb.</h1>
            <div class="controls">
                <div class="timer" id="timer">02:00</div>
                <button class="big-btn" id="startBtn">Start Round</button>
            </div>
        </header>

        <section class="board" id="board"></section>

        <footer>
            <div id="notice">Press "Start Round" to begin.</div>
            <div>Round: <span id="roundCount">0</span></div>
        </footer>
    </div>

    <div id="modalRoot" style="display:none"></div>

    <script>
        // --- Game state ---
        const PLAYERS = 4;
        // boxOwners[boxIndex] = player who currently *holds* that box
        let boxOwners = [0, 1, 2, 3];
        // Each player has one box: findBoxOfPlayer(player) -> box index
        function findBoxOfPlayer(player) { return boxOwners.findIndex(b => b === player); }

        let bombBox = null; // box index with bomb
        let lives = [3, 3, 3, 3];
        let round = 0;
        let revealPhase = false;
        // Timer and events
        let timerSeconds = 120;
        let timerInterval = null;
        let eventTimes = []; // times when events trigger
        let eventIndex = 0;

        // UI refs
        const board = document.getElementById('board');
        const timerEl = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const notice = document.getElementById('notice');
        const roundCount = document.getElementById('roundCount');
        const modalRoot = document.getElementById('modalRoot');

        // private reveal tracking
        let revealedPlayers = new Set();

        // helper
        function fmtTime(s) { const m = Math.floor(s / 60).toString().padStart(2, '0'); const ss = (s % 60).toString().padStart(2, '0'); return m + ':' + ss; }

        // render board
        function renderBoard() {
            board.innerHTML = '';
            for (let p = 0; p < PLAYERS; p++) {
                const div = document.createElement('div');
                div.className = 'player';
                const boxIdx = findBoxOfPlayer(p);

                // Choose the corresponding image
                const boxLetter = String.fromCharCode(65 + boxIdx); // A, B, C, D
                const imgSrc = `images/box${boxLetter}.png`;

                div.innerHTML = `
      <h2>Player ${p + 1}</h2>
      <div class="box" data-box="${boxIdx}">
        <img src="${imgSrc}" alt="Box ${boxLetter}" class="box-img" />
      </div>
      <div class="lives" id="lives${p}"></div>
    `;

                // Create and control the reveal button
                const revealBtn = document.createElement('button');
                revealBtn.className = 'big-btn reveal';
                revealBtn.dataset.player = p;
                revealBtn.textContent = 'Private Reveal';

                if (!revealPhase) {
                    revealBtn.style.display = 'none';
                } else {
                    if (revealedPlayers.has(p)) {
                        revealBtn.style.display = 'none';
                    } else {
                        revealBtn.style.display = 'inline-block';
                        revealBtn.disabled = false;
                    }
                }

                div.appendChild(revealBtn);
                board.appendChild(div);
            }

            renderLives();
        }


        function renderLives() {
            for (let p = 0; p < PLAYERS; p++) {
                const el = document.getElementById('lives' + p);
                if (!el) continue;
                el.innerHTML = '';
                for (let i = 0; i < 3; i++) { const dot = document.createElement('div'); dot.className = 'life' + (i >= lives[p] ? ' dead' : ''); el.appendChild(dot); }
            }
        }

        function assignBomb() { bombBox = Math.floor(Math.random() * PLAYERS); console.log('Bomb in box', bombBox); }

        // --- Modal helpers ---
        function showModal(title, contentNode, options = {}) {
            // options: hideContinue(bool), onClose(function)
            // Default: prevent backdrop close (clicking outside does nothing)
            modalRoot.style.display = 'block';
            modalRoot.innerHTML = '';

            const back = document.createElement('div');
            back.className = 'modal-back';

            const modal = document.createElement('div');
            modal.className = 'modal';

            if (title) {
                const h = document.createElement('h3');
                h.textContent = title;
                modal.appendChild(h);
            }

            if (typeof contentNode === 'string') {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = contentNode;
                modal.appendChild(wrapper);
            } else {
                modal.appendChild(contentNode);
            }

            // Footer buttons area
            const footer = document.createElement('div');
            footer.style.marginTop = '12px';
            footer.style.display = 'flex';
            footer.style.justifyContent = 'flex-end';
            footer.style.gap = '10px';

            // Close button (always present) — will call options.onClose if provided,
            // otherwise will attempt to resume countdown
            const closeBtn = document.createElement('button');
            closeBtn.className = 'big-btn';
            closeBtn.textContent = 'Close';
            closeBtn.addEventListener('click', () => {
                closeModal();
                if (typeof options.onClose === 'function') {
                    try { options.onClose(); } catch (err) { console.error('onClose threw', err); }
                } else {
                    // default behavior: resume the countdown if appropriate
                    // only resume if there is time left
                    if (timerSeconds > 0) startCountdownResume();
                }
            });
            footer.appendChild(closeBtn);

            // Optional Continue button (keeps old behavior; still calls onClose)
            if (!options.hideContinue) {
                const contBtn = document.createElement('button');
                contBtn.className = 'big-btn';
                contBtn.textContent = 'Continue';
                contBtn.addEventListener('click', () => {
                    closeModal();
                    if (typeof options.onClose === 'function') {
                        try { options.onClose(); } catch (err) { console.error('onClose threw', err); }
                    } else {
                        if (timerSeconds > 0) startCountdownResume();
                    }
                });
                footer.appendChild(contBtn);
            }

            modal.appendChild(footer);
            back.appendChild(modal);

            // IMPORTANT: Clicking the backdrop should NOT close the modal.
            // (No click handler on back)

            modalRoot.appendChild(back);
        }


        function resumeAfterModal() {
            // If the timer is paused during modal events, resume it
            if (timerSeconds > 0 && !timerInterval) {
                startCountdownResume();
            }
        }


        function closeModal() {
            modalRoot.style.display = 'none';
            modalRoot.innerHTML = '';
        }

        // --- Game flow ---
        startBtn.addEventListener('click', () => { initRound(); });

        function initRound() {
            round++; roundCount.textContent = round;
            // reset mapping so each player starts holding their original box
            boxOwners = [0, 1, 2, 3];
            assignBomb();
            revealedPlayers.clear();

            // enter reveal phase
            revealPhase = true;
            renderBoard();

            notice.textContent = 'Private reveal phase: each player secretly checks any box except their own.';
            // hide Start button
            startBtn.style.display = 'none';
            startBtn.disabled = true;

            timerEl.textContent = fmtTime(120);
            timerSeconds = 120;
            eventIndex = 0;
        }

        // Reveal: Player p chooses one box (not their own) to peek. UI must be private.
        function playerReveal(p) {
            // Create container for the modal content
            const container = document.createElement('div');
            container.className = 'reveal-container';

            // Instruction text (on its own line)
            const note = document.createElement('div');
            note.className = 'notice';
            note.textContent = `Player ${p + 1}, choose a box to reveal (don't reveal to others).`;
            container.appendChild(note);

            // Wrapper for the box selection buttons
            const buttonsWrapper = document.createElement('div');
            buttonsWrapper.className = 'reveal-buttons';
            container.appendChild(buttonsWrapper);

            // Player can reveal any box except their own
            const otherBoxes = [0, 1, 2, 3].filter(b => findBoxOfPlayer(p) !== b);

            otherBoxes.forEach(b => {
                const btn = document.createElement('button');
                btn.className = 'big-btn';
                btn.textContent = 'Box ' + String.fromCharCode(65 + b);

                btn.addEventListener('click', () => {
                    const success = Math.random() < 0.5;

                    let revealMessage;
                    if (success) {
                        const isBomb = (b === bombBox);
                        revealMessage = `Box ${String.fromCharCode(65 + b)} is ${isBomb ? '<strong>THE BOMB 💣</strong>' : 'safe ✅'}.`;
                    } else {
                        revealMessage = `Reveal failed — your attempt to peek at Box ${String.fromCharCode(65 + b)} gave no information. ❌`;
                    }


                    showModal(
                        'Reveal Result',
                        `<div class='notice'>${revealMessage}</div>`,
                        {
                            onClose: () => {
                                // Mark player as having revealed
                                revealedPlayers.add(p);

                                // Hide this player's reveal button
                                const rb = document.querySelector(`.reveal[data-player='${p}']`);
                                if (rb) rb.style.display = 'none';

                                // If all players have revealed, start the countdown
                                if (revealedPlayers.size === 4) {
                                    notice.textContent = 'All reveals complete — countdown starts.';
                                    startCountdown();
                                }
                            },
                        }
                    );
                });

                buttonsWrapper.appendChild(btn);
            });

            // Show modal
            showModal(`Player ${p + 1} — Private Reveal (50% chance)`, container, { hideContinue: true });
        }


        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('reveal')) {
                const p = parseInt(e.target.dataset.player, 10);
                playerReveal(p);
            }
        });

        // --- Timer ---
        function startCountdown() {
            // countdown starts => reveal phase is over
            revealPhase = false;
            renderBoard(); // ensure reveal buttons disappear immediately and stay hidden during swaps

            timerSeconds = 120; timerEl.textContent = fmtTime(timerSeconds);
            // schedule events at 105,90,...15,1
            eventTimes = [105, 90, 75, 60, 45, 30, 15, 1]; eventIndex = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds--; timerEl.textContent = fmtTime(timerSeconds);
                if (eventIndex < eventTimes.length && timerSeconds === eventTimes[eventIndex]) {
                    clearInterval(timerInterval);
                    triggerRandomEvent(() => { if (timerSeconds > 0) { startCountdownResume(); } });
                    eventIndex++;
                }
                if (timerSeconds <= 0) { clearInterval(timerInterval); resolveExplosion(); }
            }, 1000);
        }

        function startCountdownResume() {
            // ensure revealPhase remains false while resuming
            revealPhase = false;
            renderBoard();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds--; timerEl.textContent = fmtTime(timerSeconds);
                if (eventIndex < eventTimes.length && timerSeconds === eventTimes[eventIndex]) {
                    clearInterval(timerInterval);
                    triggerRandomEvent(() => { if (timerSeconds > 0) startCountdownResume(); });
                    eventIndex++;
                }
                if (timerSeconds <= 0) { clearInterval(timerInterval); resolveExplosion(); }
            }, 1000);
        }


        // --- Events ---
        // We'll pick randomly from the set of event functions below
        function triggerRandomEvent(done) {
            notice.textContent = 'Event triggered!';
            const events = [eventMutualChoiceTrade, eventForcedChooserTrade, eventForcedSwapTwo, eventOptionalChooserTrade, eventAgreedMakeOthersSwap, eventChooserMakeTwoSwap, eventRandomBoxSwapWithOne, eventRumor, eventChainSwap, eventSpyReport];
            const ev = events[Math.floor(Math.random() * events.length)];
            ev(done);
        }

        // Utility: swap boxes between two players (swap the boxes they currently hold)
        function swapPlayersBoxes(playerA, playerB) {
            const boxA = findBoxOfPlayer(playerA); const boxB = findBoxOfPlayer(playerB);
            if (boxA < 0 || boxB < 0) return;
            // swap owners of those boxes
            boxOwners[boxA] = playerB; boxOwners[boxB] = playerA;
            renderBoard();
        }

        // 1) Two players chosen randomly — given choice to trade, both must agree
        function eventMutualChoiceTrade(done) {
            const [p1, p2] = chooseRandomUnique(2);
            const content = document.createElement('div');
            content.className = 'row';

            const note = document.createElement('div');
            note.className = 'notice';
            note.innerHTML = `Players ${p1 + 1} and ${p2 + 1} have the choice to trade their boxes. Both must agree to execute the trade.`;
            content.appendChild(note);

            const agree = { p1: false, p2: false };

            function makeSwitch(playerKey, playerLabel) {
                const btn = document.createElement('button');
                btn.className = 'big-btn';
                btn.textContent = `${playerLabel}: Disagree ❌`;
                btn.dataset.state = 'off';
                btn.addEventListener('click', () => {
                    const isOn = btn.dataset.state === 'on';
                    btn.dataset.state = isOn ? 'off' : 'on';
                    agree[playerKey] = !isOn;
                    btn.textContent = `${playerLabel}: ${agree[playerKey] ? 'Agree ✅' : 'Disagree ❌'}`;

                    // when both agree, execute swap, close modal and call done
                    if (agree.p1 && agree.p2) {
                        swapPlayersBoxes(p1, p2);
                        closeModal();
                        // ensure done continues the countdown
                        done();
                    }
                });
                return btn;
            }

            const sw1 = makeSwitch('p1', `P${p1 + 1}`);
            const sw2 = makeSwitch('p2', `P${p2 + 1}`);

            content.appendChild(sw1);
            content.appendChild(sw2);

            // When Close is pressed, we want the game to continue anyway. Use onClose to resume.
            showModal('Mutual Trade Option', content, { hideContinue: true, onClose: () => { /* nothing extra; resume handled globally */ startCountdownResume(); } });
        }



        // 2) One player chosen randomly — must trade his box with whoever he wants
        function eventForcedChooserTrade(done) {
            const [p] = chooseRandomUnique(1);
            const content = document.createElement('div'); content.className = 'row';
            const note = document.createElement('div'); note.className = 'notice'; note.textContent = `Player ${p + 1} must choose another player to trade boxes with.`; content.appendChild(note);
            for (let i = 0; i < PLAYERS; i++) if (i !== p) { const btn = document.createElement('button'); btn.className = 'big-btn'; btn.textContent = 'Trade with P' + (i + 1); btn.addEventListener('click', () => { swapPlayersBoxes(p, i); closeModal(); done(); }); content.appendChild(btn); }
            showModal('Forced Trade — Choose Partner', content, { hideContinue: true });
        }

        // 3) Two players chosen randomly — must trade their boxes
        function eventForcedSwapTwo(done) {
            const [p1, p2] = chooseRandomUnique(2);
            swapPlayersBoxes(p1, p2);
            showModal('Forced Swap', `<div class='notice'>Players ${p1 + 1} and ${p2 + 1} had their boxes swapped.</div>`, { onClose: () => { done(); } });
        }

        // 4) One player chosen randomly — may trade his box with whoever he wants (optional)
        function eventOptionalChooserTrade(done) {
            const [p] = chooseRandomUnique(1);
            const content = document.createElement('div'); content.className = 'row';
            const note = document.createElement('div'); note.className = 'notice'; note.textContent = `Player ${p + 1} may choose to trade their box with another player (optional).`; content.appendChild(note);
            for (let i = 0; i < PLAYERS; i++) if (i !== p) { const btn = document.createElement('button'); btn.className = 'big-btn'; btn.textContent = 'Trade with P' + (i + 1); btn.addEventListener('click', () => { swapPlayersBoxes(p, i); closeModal(); done(); }); content.appendChild(btn); }
            const skip = document.createElement('button'); skip.className = 'big-btn'; skip.textContent = 'Skip'; skip.addEventListener('click', () => { closeModal(); done(); }); content.appendChild(skip);
            showModal('Optional Trade', content, { hideContinue: true });
        }

        // 5) Two players chosen randomly — if they both agree, they can make the other two players trade boxes between each other
        function eventAgreedMakeOthersSwap(done) {
            const pair = chooseRandomUnique(2);
            const p1 = pair[0], p2 = pair[1];
            const others = [...Array(PLAYERS).keys()].filter(x => !pair.includes(x));
            const content = document.createElement('div');
            content.className = 'row';

            const note = document.createElement('div');
            note.className = 'notice';
            note.textContent = `Players ${p1 + 1} and ${p2 + 1} can, if both agree, force Players ${others[0] + 1} and ${others[1] + 1} to swap boxes.`;
            content.appendChild(note);

            const agree = { p1: false, p2: false };

            function makeSwitch(playerKey, playerLabel) {
                const btn = document.createElement('button');
                btn.className = 'big-btn';
                btn.textContent = `${playerLabel}: Disagree ❌`;
                btn.dataset.state = 'off';
                btn.addEventListener('click', () => {
                    const isOn = btn.dataset.state === 'on';
                    btn.dataset.state = isOn ? 'off' : 'on';
                    agree[playerKey] = !isOn;
                    btn.textContent = `${playerLabel}: ${agree[playerKey] ? 'Agree ✅' : 'Disagree ❌'}`;

                    if (agree.p1 && agree.p2) {
                        const a = others[0], b = others[1];
                        swapPlayersBoxes(a, b);
                        closeModal();
                        done();
                    }
                });
                return btn;
            }

            const sw1 = makeSwitch('p1', `P${p1 + 1}`);
            const sw2 = makeSwitch('p2', `P${p2 + 1}`);

            content.appendChild(sw1);
            content.appendChild(sw2);

            showModal('Force Others to Swap (By Agreement)', content, { hideContinue: true, onClose: () => { startCountdownResume(); } });
        }


        // 6) One player chosen randomly — must make two players trade their boxes with each other
        function eventChooserMakeTwoSwap(done) {
            const [p] = chooseRandomUnique(1);
            const others = [...Array(PLAYERS).keys()].filter(x => x !== p);
            const content = document.createElement('div'); content.className = 'row';
            const note = document.createElement('div'); note.className = 'notice'; note.textContent = `Player ${p + 1} must pick two players (not themselves) and make them swap boxes.`; content.appendChild(note);
            // two selects
            const selA = document.createElement('select'); others.forEach(o => { const opt = document.createElement('option'); opt.value = o; opt.textContent = 'P' + (o + 1); selA.appendChild(opt); });
            const selB = document.createElement('select'); others.forEach(o => { const opt = document.createElement('option'); opt.value = o; opt.textContent = 'P' + (o + 1); selB.appendChild(opt); });
            content.appendChild(selA); content.appendChild(selB);
            const go = document.createElement('button'); go.className = 'big-btn'; go.textContent = 'Make them swap'; go.addEventListener('click', () => {
                const a = parseInt(selA.value, 10); const b = parseInt(selB.value, 10);
                if (a === b) { alert('Pick two different players'); return; }
                swapPlayersBoxes(a, b); closeModal(); done();
            });
            content.appendChild(go);
            showModal('Make Two Swap', content, { hideContinue: true });
        }

        // 7) One player chosen randomly — his box is traded with another player randomly
        function eventRandomBoxSwapWithOne(done) {
            const [p] = chooseRandomUnique(1);
            const others = [...Array(PLAYERS).keys()].filter(x => x !== p);
            const partner = others[Math.floor(Math.random() * others.length)];
            swapPlayersBoxes(p, partner);
            showModal('Random Trade', `<div class='notice'>Player ${p + 1} had their box randomly traded with Player ${partner + 1}.</div>`, { onClose: () => { done(); } });
        }

        // Chain Swap: All players pass their boxes to the right (or left) — no one can stop it
        function eventChainSwap(done) {
            const dir = Math.random() < 0.5 ? 'right' : 'left';
            // produce new owners array
            const newOwners = Array(PLAYERS).fill(null);
            for (let box = 0; box < PLAYERS; box++) {
                const owner = boxOwners[box];
                // box is initially at index box; passing boxes to the right means the player holding box i will give it to the player to their right? Simpler: rotate owners array
            }
            if (dir === 'right') {
                // rotate owners to right: player who had box i now has box (i+1)%4?
                // Instead rotate mapping of players: each player receives box from left
                // We'll rotate boxOwners array elements (which indicate who holds each original box). Rotating boxOwners right means original box 0's owner becomes previous box 3's owner etc.
                const rotated = [boxOwners[3], boxOwners[0], boxOwners[1], boxOwners[2]];
                boxOwners = rotated;
            } else {
                const rotated = [boxOwners[1], boxOwners[2], boxOwners[3], boxOwners[0]];
                boxOwners = rotated;
            }
            renderBoard();
            showModal('Chain Swap', `<div class='notice'>All players pass their boxes to the ${dir}.</div>`, { onClose: () => { done(); } });
        }

        // Rumor: Public announcement which may be false (70% false -> 30% true)
        function eventRumor(done) {
            const target = Math.floor(Math.random() * PLAYERS);
            const truth = Math.random() < 0.3; // 30% true
            const text = `Rumor: Player ${target + 1}'s box looks suspicious.`;
            // We display rumor publicly (no private reveal)
            notice.textContent = 'RUMOR: ' + text;
            showModal('Public Rumor', `<div class='notice'>${text}<div style='margin-top:6px'>Rumors are ~70% false.</div></div>`, { onClose: () => { done(); } });
        }

        // Spy Report: show "A spy report arrived to player X" with a Read button (only the recipient should read)
        // Report says: "The bomb is NOT with Player Y." and is 70% accurate.
        function eventSpyReport(done) {
            const recipient = Math.floor(Math.random() * PLAYERS);
            const subject = Math.floor(Math.random() * PLAYERS);
            const accurate = Math.random() < 0.7;
            // But the recipient shouldn't know whether it's accurate. We'll compute the truth when revealing—here we store data in closure
            const container = document.createElement('div'); container.className = 'row';
            const note = document.createElement('div'); note.className = 'notice'; note.textContent = `A spy report arrived to Player ${recipient + 1}. Only they should press Read.`; container.appendChild(note);
            const readBtn = document.createElement('button'); readBtn.className = 'big-btn'; readBtn.textContent = 'Read';
            readBtn.addEventListener('click', () => {
                // When read, show the report content privately
                const actualStatement = (accurate ? `The bomb is NOT with Player ${subject + 1}.` : `The bomb IS with Player ${subject + 1}.`);
                showModal('Spy Report (Private)', `<div class='notice'>${actualStatement}<div style='margin-top:8px'>Reports are ~70% accurate.</div></div>`, { onClose: () => { closeModal(); done(); } });
            });
            container.appendChild(readBtn);
            showModal('Spy Report Arrived', container, { hideContinue: true });
        }

        // Explosion resolution
        function resolveExplosion() {
            const ownerPlayer = boxOwners[bombBox];
            lives[ownerPlayer] = Math.max(0, lives[ownerPlayer] - 1);
            renderLives();
            showModal('Explosion', `<div class='notice'>BOOM! Box ${String.fromCharCode(65 + bombBox)} exploded. Player ${ownerPlayer + 1} loses 1 life.</div>`, {
                onClose: () => {
                    // check for elimination (player with 0 lives)
                    const eliminated = lives.findIndex(l => l === 0);
                    if (eliminated !== -1) {
                        showModal('Game Over', `<div class='notice'>Player ${eliminated + 1} lost all lives. Game over.</div>`, {
                            onClose: () => {
                                resetGame();
                            }
                        });
                    } else {
                        // End of round: re-enable Start button and hide reveal buttons
                        revealPhase = false;
                        renderBoard();
                        startBtn.style.display = 'inline-block';
                        startBtn.disabled = false;
                        notice.textContent = 'Round complete. Press "Start Round" to play again.';
                    }
                }
            });
        }

        // Utilities
        function chooseRandomUnique(n) { const arr = [0, 1, 2, 3]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[arr[i], arr[j]] = [arr[j], arr[i]]; } return arr.slice(0, n); }

        // Reset game
        function resetGame() {
            lives = [3, 3, 3, 3];
            round = 0;
            boxOwners = [0, 1, 2, 3];
            bombBox = null;
            revealedPlayers.clear();
            revealPhase = false;
            renderBoard();
            renderLives();
            notice.textContent = 'Press "Start Round" to begin.';
            startBtn.style.display = 'inline-block';
            startBtn.disabled = false;
            timerEl.textContent = fmtTime(120);
            roundCount.textContent = 0;
        }

        // initial render
        renderBoard(); renderLives(); timerEl.textContent = fmtTime(timerSeconds);

    </script>
</body>

</html>
