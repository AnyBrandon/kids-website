// avatar SVG built from hair characteristics
function avatarSVG(c){
  const h = c.hair;
  const col = h.color.hex;
  const dark = shade(col,-25), light = shade(col,25);
  // length → how far hair falls; volume → width
  const lenMap={'very short':60,'short':78,'medium':96,'long':118,'very long':134};
  const fall = lenMap[h.length] || 96;
  const wide = h.volume==='voluminous'?1.18:h.volume==='flat'?0.9:1;
  // texture → edge shape
  const wavy = h.texture==='wavy'||h.texture==='curly'||h.texture==='coily';
  const skin = pick.__skin || (pick.__skin = ['#ffdcc0','#f6c9a8','#e8b48c','#c98d63','#a9714a']);
  const sk = skin[(c.name.charCodeAt(0)+fall)%skin.length];
  const cx=55;
  // Fix 3: head geometry the hair is anchored to (face ellipse below).
  const faceCX=cx, faceCY=58, faceRX=24, faceRY=26;
  const headTop = faceCY - faceRY;              // ~32 — crown of the head
  // Hair mass proportional to the head, with a rounded crown that overlaps the
  // scalp and soft curved sides (no straight vertical edges → no blocky helmet).
  const hairW = (faceRX + 8) * wide;            // a little wider than the face
  const bottom = 60 + fall*0.36;                // how far the hair falls
  const crownY = headTop - 6;                   // hair sits just above the crown
  const sideBow = wavy ? 7 : 3;                 // outward bulge at the sides
  // Back-hair silhouette: start low-left, sweep UP and OVER the crown as a smooth
  // dome, then down the right side, then a rounded (optionally wavy) bottom edge.
  const backHair =
    `M ${cx-hairW},${bottom-6} ` +
    `C ${cx-hairW-sideBow},${faceCY} ${cx-hairW+2},${crownY+10} ${cx-faceRX*0.7},${crownY+2} ` +
    `Q ${cx},${crownY-8} ${cx+faceRX*0.7},${crownY+2} ` +
    `C ${cx+hairW-2},${crownY+10} ${cx+hairW+sideBow},${faceCY} ${cx+hairW},${bottom-6} ` +
    (wavy

// lighten/darken hex
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+pct, g=((n>>8)&255)+pct, b=(n&255)+pct;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function wireHUD(){
  const btn=$('#btnMenu'), menu=$('#hudMenu');
  if(!btn||!menu) return;
  const outside=(e)=>{ if(!menu.contains(e.target) && e.target!==btn){ closeMenu(); } };
  function closeMenu(){ menu.classList.remove('open'); menu.setAttribute('aria-hidden','true'); document.removeEventListener('click', outside); }

/* ---------- Task 1: negotiation odds (tunable) ----------
   MIDDLE offer: base 70% accept. INSIST: base ~10%, scaled by fame tier
   (-2%/tier below, +3%/tier above a mid anchor) and by personality.
   Personality "hard" (0.10 easygoing … 0.75 price-conscious) shifts both:
   easygoing/patient are more forgiving; price-conscious/perfectionist tougher. */
const NEG_MIDDLE_BASE = 0.70;   // middle-offer base accept chance
const NEG_INSIST_BASE = 0.10;   // insist base accept chance
function negMiddleChance(c){
  // hard 0.10→+0.12, 0.75→-0.19 (personality tilt around base)
  const persoTilt = (0.35 - c.perso.hard) * 0.5;
  return clamp(NEG_MIDDLE_BASE + persoTilt, 0.35, 0.9);
}
function negInsistChance(c){
  const persoTilt = (0.35 - c.perso.hard) * 0.18;   // small personality nudge
  const fameTilt  = (state.fameTier - 2) * 0.025;   // famous salons hold firm more
  return clamp(NEG_INSIST_BASE + persoTilt + fameTilt, 0.02, 0.22);
}

function screenNegotiate(myPrice, counter, isRematch){
  const c = client;
  const middle = Math.round((myPrice+counter)/2);
  const panel = $('#pricePanel');
  panel.innerHTML = `<h3>💬 ${c.name} negotiates</h3>
    <div class="bubble" style="margin:6px 0 12px">"${isRematch?'I still think':'Hmm, could you do'} <b>€${counter}</b>${isRematch?', please?':'?'}"</div>
    <div class="btn-row">
      <button class="btn mint" id="acceptHers">Accept €${counter}</button>
      <button class="btn secondary" id="middle">Offer €${middle}</button>
      <button class="btn ghost" id="insist">Insist €${myPrice}</button>
    </div>
    <div class="muted" id="negMsg" style="margin-top:8px;font-size:12.5px;min-height:16px"></div>`;

  // Accept her price — always succeeds.
  $('#acceptHers').onclick=()=>{ session.agreedPrice=counter; toast('Deal! 🤝'); setTimeout(startServices,450); };

  // Offer a middle price — ~70% (personality-adjusted). On decline: one capped
  // re-negotiation (she counters again) the FIRST time, otherwise she walks.
  $('#middle').onclick=()=>{
    const chance = negMiddleChance(c);
    if(Math.random() < chance){
      session.agreedPrice=middle; toast('She agrees! 💫'); setTimeout(startServices,450);
    } else if(!isRematch){
      // one more round: she nudges back toward her price, then it must resolve
      const newCounter = Math.max(1, Math.round((middle + counter)/2 - 1));
      $('#negMsg').textContent = `"${pick(['Mmm, not quite…','Still a bit high for me…','Could we meet closer to my price?'])}"`;
      setTimeout(()=>screenNegotiate(middle, newCounter, true), 650);
    } else {
      declineAndLeave(pick(["Sorry, we're too far apart. I'll pass.","That doesn't work for me — bye!","I'll look elsewhere, thanks."]));
    }
  };

  // Insist on your original price — small chance, scaled by fame + personality.
  $('#insist').onclick=()=>{
    const chance = negInsistChance(c);
    if(Math.random() < chance){
      session.agreedPrice=myPrice; toast('Fine, she agrees. 💅'); setTimeout(startServices,450);
    } else {
      declineAndLeave(pick(["No, that's over my budget. Goodbye.","Then I'll take my business elsewhere.","Too pricey — I'm off!"]));
    }
  };
}
// Show a short reaction line, then resolve to the client leaving.

  const el=$('#negMsg'); if(el){ el.textContent = `"${msg}"`; el.style.color='#c0392b'; }
  const btns=$('#pricePanel') && $('#pricePanel').querySelectorAll('button'); if(btns) btns.forEach(b=>b.disabled=true);
  setTimeout(screenLeave, 900);
}

// Phase 4: action-UI category metadata for tabbed grouping.

      t.onclick=()=>{ activeCat=t.dataset.cat; renderServiceScreen(); };
    });
  }

  const btns = $('#svcBtns');
  let blocked = false;   // any requested service (in any tab) that can't be performed
  // Buttons: only services in the active category tab
  services.filter(k=>SERVICES[k].cat===activeCat).forEach(k=>{
    const done = session.doneServices.includes(k);

    const b = document.createElement('button');

      b.className = 'btn small ghost';

      if(block.kind==='equip'){
        const names = block.missing.map(s=>`${EQUIP_CATALOG[s].icon} ${EQUIP_CATALOG[s].label}`).join(', ');

    }
    btns.appendChild(b);

  // detect any blocked service across ALL categories (for the skip/turn-away controls)
  const blockedKeys = services.filter(k=>!session.doneServices.includes(k) && !(session.skipped&&session.skipped.includes(k)) && blockReasonFor(k));
  blocked = blockedKeys.length>0;

  if(remaining.length===0){

// Phase 3: skip a blocked service component (counts against style match / result).
function skipService(key){
  if(!session.skipped) session.skipped = [];
  if(!session.skipped.includes(key)) session.skipped.push(key);
  toast(`Skipped ${SERVICES[key].label} (penalty).`);
  renderServiceScreen();

/* ---------- Phase 7: employee auto-service ---------- */
// Record a service result WITHOUT re-rendering (batch use for auto-serve).
// Fix 2: defense-in-depth — refuses to perform a service that's blocked by
// missing/broken equipment or empty stock, exactly like the manual path. If a
// service is blocked it is skipped (penalty) instead of silently completed.
function resolveServiceAuto(key, rawQ, extra){
  if(blockReasonFor(key)){                      // employees use the SAME salon equipment/stock
    if(!session.skipped.includes(key)) session.skipped.push(key);
    return false;
  }
  let q = applyQualityMod(rawQ, equipQualityMod(key));
  if(key==='treatment' && (client.hair.condition==='damaged'||client.hair.condition==='dry')){
    q = QUALITY_TIERS[Math.min(QUALITY_TIERS.length-1, QUALITY_TIERS.indexOf(q)+1)];
    session.conditionImproved = true;
  }
  session.qualities[key]=q;
  if(extra) session.extras[key]=extra;
  if(!session.doneServices.includes(key)) session.doneServices.push(key);
  if(SERVICES[key].stock && state.colorStock>0) state.colorStock--;
  wearEquipment(key);   // still wears gear (breakage handled quietly during auto-serve)
  return true;
}
function assignToEmployee(emp){
  const def=EMPLOYEE_ROLES[emp.role];
  const services=client.request.services;

  // Fix 2: run the SAME equipment/stock availability check the manual path uses.
  // If EVERY requested service is blocked, there's no valid path → turn the client
  // away, identical to the manual "lose the client" outcome (no payment).
  const blockedNow = services.filter(k=>blockReasonFor(k));
  if(blockedNow.length === services.length){
    const names = [...new Set(blockedNow.flatMap(k=>{
      const b=blockReasonFor(k);
      return b.kind==='equip' ? b.missing.map(s=>EQUIP_CATALOG[s].label) : ['colour product'];
    }))].join(', ');
    toast(`⚠️ ${emp.name} can't start — ${names} unavailable. Client turned away.`);
    applyLeave(); screenLeave();
    return;
  }

  // build the hair model so the summary "after" look still renders something sensible
  const model=getHairModel();
  let skippedCount = 0;
  services.forEach(k=>{
    // blocked components are skipped (penalty), NEVER performed by the employee
    if(blockReasonFor(k)){ if(!session.skipped.includes(k)) session.skipped.push(k); skippedCount++; return; }
    const q = employeeAutoQuality(emp, [k]);
    // for colour services, staff pick the requested colour (or a sensible default) → extras for match hook
    let extra=null;
    if(['color','highlights','balayage'].includes(k)){
      const chosen = client.request.wantColor || pick(COLOR_SWATCHES).name;
      extra = {color:chosen, want:client.request.wantColor};
    }
    // only apply the visible model change if the service actually gets performed
    if(resolveServiceAuto(k, q, extra)) autoVisualEffect(k, q, model);
  });
  session.elapsed = Math.round((Date.now()-session.startTime)/1000);
  toast(`${def.icon} ${emp.name} handled ${client.name}.${skippedCount?` (${skippedCount} service${skippedCount>1?'s':''} skipped — missing equipment)`:''}`);
  save();
  finishClient();
}
// Minimal visible model change for auto-served services (keeps after-look consistent).
function autoVisualEffect(key, q, model){
  const act=SERVICES[key].act;
  if(act==='cut'){ const tgt=cutTargetFor(key); model.strands.forEach(s=>{ if(s.len>tgt) s.len=tgt+(Math.random()-0.5)*6; }); }
  else if(act==='wash'){ model.strands.forEach(s=>{ s.washed=Math.max(s.washed,0.85); }); }
  else if(act==='dry'){ model.strands.forEach(s=>{ s.dryness=1; s.wet=false; }); }
  else if(act==='color'){ const hex=hexForColorName(client.request.wantColor||pick(COLOR_SWATCHES).name); model.strands.forEach(s=>{ s.dyeColor=hex; s.dyeCov=1; }); }
  else if(act==='straighten'){ model.strands.forEach(s=>{ s.curlAmp=Math.max(0,s.curlAmp-10); }); }
  else if(act==='curl'){ model.strands.forEach(s=>{ s.curlAmp=Math.min(24,s.curlAmp+8); }); }
  else if(act==='volume'){ model.strands.forEach(s=>{ s.volume=Math.max(s.volume,0.7); }); }
  else if(act==='bangs'){ model.strands.forEach(s=>{ if(Math.abs(s.rootX-HEAD_CX)<30) s.len=Math.min(s.len,LEN_PX['very short']+20); }); }
  else if(act==='style'){ model.styleShape=SERVICES[key].styleKind; }
  else if(act==='accessory'){ const a=pick(ACCESSORY_OPTIONS); const b=accHeadBounds(model); model.accessory={type:a.n, e:a.e, x:b.cx-b.rx*0.45, y:b.cy-b.ry*0.72}; }
  else if(act==='highlights'){ const hex=lift(hexForColorName(client.request.wantColor||'Blonde')); model.strands.forEach((s,i)=>{ if(i%3===0){s.highlight=1;s.balColor=hex;} }); }
  else if(act==='balayage'){ const hex=hexForColorName(client.request.wantColor||'Blonde'); model.strands.forEach(s=>{ s.balColor=hex; s.balayage=0.8; }); }
  else if(act==='treatment'){ model.strands.forEach(s=>{ s.damaged=false; s.washed=Math.max(s.washed,0.8); }); }
}

function recordQuality(key, rawQ, extra){
  // Phase 3: equipment Quality stat biases the outcome upward.
  let q = applyQualityMod(rawQ, equipQualityMod(key));

  // Phase 4: Hair treatment boosts result quality when the client's hair was poor,
  // and marks a condition improvement for this visit's summary/review flavor.
  if(key==='treatment'){
    const poor = client.hair.condition==='damaged' || client.hair.condition==='dry';
    if(poor){
      const idx = Math.min(QUALITY_TIERS.length-1, QUALITY_TIERS.indexOf(q)+1);
      q = QUALITY_TIERS[idx];
      session.conditionImproved = true;   // used by summary/review flavor
    }
  }

  session.qualities[key]=q;
  // Phase 4: store per-service extra data (chosen color, style kind, accessory, etc.)
  if(extra){ session.extras = session.extras||{}; session.extras[key]=extra; }
  if(!session.doneServices.includes(key)) session.doneServices.push(key);
  session.elapsed = Math.round((Date.now()-session.startTime)/1000);

  // Phase 4: color services consume a color product from stock.
  if(SERVICES[key].stock && state.colorStock>0){ state.colorStock--; }

  const bumped = q!==rawQ ? ' (boost!)' : '';
  toast(`${SERVICES[key].label}: ${q}!${bumped}`);
  // Phase 3: wear equipment; if something breaks, show modal after re-render.
  const broke = wearEquipment(key);
  save();
  renderServiceScreen();
  if(broke) showBreakageModal(broke);
}

function launchAction(key){
  const act = SERVICES[key].act;
  if(act==='wash') actWash(key);
  else if(act==='cut') actCut(key);
  else if(act==='dry') actDry(key);
  // --- Phase 4 action handlers (simplified interactions; quality → recordQuality) ---
  else if(act==='bangs') actBangs(key);
  else if(act==='straighten') actStraighten(key);
  else if(act==='curl') actCurl(key);
  else if(act==='volume') actVolume(key);
  else if(act==='treatment') actTreatment(key);
  else if(act==='color') actColor(key);
  else if(act==='highlights') actHighlights(key);
  else if(act==='balayage') actBalayage(key);
  else if(act==='style') actStyle(key);
  else if(act==='accessory') actAccessory(key);
}

/* ============================================================
   PHASE 5: RENDERED HAIR MODEL + REALISTIC INTERACTIONS
   Section L. Strand data model, canvas rendering, and the
   drag-based cut / wash / dry interactions.
   Every interaction ends by calling recordQuality(key, rawQ),
   so satisfaction/equipment/pricing downstream is untouched.
   [EXT] Phase 6 reuses these same strand objects for
   colour/curl/straighten/style — hence points[], color, damaged.
   ============================================================ */

// ---- Geometry constants (canvas coordinate space) ----
const HAIR_W = 320, HAIR_H = 360;      // internal canvas resolution (scaled by CSS)
const HEAD_CX = 160, HEAD_TOP = 70, HEAD_RX = 78, HEAD_RY = 88;
const SCALP_Y = HEAD_TOP + 6;

// Map hair length trait → base strand length in px.
const LEN_PX = {'very short':60,'short':95,'medium':140,'long':195,'very long':240};

// Pacing constants for wash/dry coverage fill (per drag-touch on a strand).
// These are now PER-SECOND fill rates (see washAt/dryAt: fill = rate * dt), NOT
// per-drag-event increments. The earlier per-event constants (0.12/0.10 → 0.03/0.025)
// couldn't control real timing because pointermove fires at device-dependent
// frequency and one cursor pass touches many strands at once — so completion stayed
// ~1–2s regardless. Time-based fill makes a careful full-head drag take ~7–10s.
// Divided by equipment Speed (spd) and, for wash, tangle — same as before.
const WASH_FILL_RATE = 0.30;   // per second (was 0.03 per event)
const DRY_FILL_RATE  = 0.28;   // per second (was 0.025 per event)

/* ---- L1. Build the strand model from client hair traits ---- */
// Returns { strands:[{x0,y0,points:[{x,y}],baseLen,len,curlSeed,color,damaged,wet,dryness,coverage}], traits }
function buildHairModel(c){
  const h = c.hair;
  const baseLen = LEN_PX[h.length] || 140;
  // thickness/volume → count & width (cap for tablet perf: ~48–80 locks)
  const volFactor = h.volume==='voluminous'?1.2:h.volume==='flat'?0.82:1;
  const thickFactor = h.thickness==='thick'?1.15:h.thickness==='fine'?0.85:1;
  let count = Math.round(64 * volFactor * thickFactor);
  count = clamp(count, 48, 80);
  const width = clamp(7*thickFactor*volFactor, 4, 11);   // slightly wider locks = fuller coverage
  const curlType = h.texture; // straight/wavy/curly/coily
  const curlAmp = {straight:0, wavy:8, curly:15, coily:22}[curlType] ?? 6;
  const curlFreq = {straight:0, wavy:1.4, curly:2.4, coily:3.4}[curlType] ?? 1;
  const col = h.color.hex;
  const startDamaged = (h.condition==='damaged');

  // Head silhouette bounds (must match the drawn ellipse below):
  //   ellipse center = (HEAD_CX, HEAD_TOP+HEAD_RY*0.55), radii = (HEAD_RX*0.9, HEAD_RY*0.95)
  const headCX = HEAD_CX;
  const headCY = HEAD_TOP + HEAD_RY*0.55;
  const headRX = HEAD_RX*0.9;              // ~70 — actual visible half-width
  const headRY = HEAD_RY*0.95;             // ~84

  const strands = [];
  for(let i=0;i<count;i++){
    // Distribute roots along the WHOLE hair-bearing scalp perimeter, seen from the
    // front: from the left temple, up over the crown, down to the right temple.
    // u:0 = far left side, u:0.5 = crown, u:1 = far right side.
    const u = count>1 ? i/(count-1) : 0.5;
    // Map u to an angle around the top half of the head ellipse.
    // Reach slightly PAST ear-to-ear (±1.02·radius) so the sides are fully covered,
    // and let the roots ride down the sides (not just a thin top band).
    const ang = Math.PI*(1 - u);           // π (left) → 0 (right), sweeping over the top
    const side = Math.cos(ang);            // -1 left … +1 right (signed distance from crown)
    const rootX = headCX + side*headRX*1.02;
    // Y follows the ellipse: crown near the top, temples lower down the sides.
    const rootY = headCY - Math.sin(ang)*headRY*0.98;

    // Outward lean scales with how far the root sits from center, so side strands
    // DRAPE DOWN THE SIDES of the head instead of converging toward the middle.
    const dir = side * (0.7 + Math.abs(side)*0.6);   // ~0 at crown, up to ~1.3 at temples

    // slight per-strand length variation for a natural edge
    const lenJit = baseLen * (0.9 + Math.random()*0.2);
    strands.push({
      i, rootX, rootY, u, side,
      dir,
      baseLen: lenJit, len: lenJit,        // len shrinks when cut
      curlSeed: Math.random()*Math.PI*2,
      curlAmp, curlFreq,
      color: col, damaged: startDamaged,
      wet:false,                            // wash sets wet; dry clears it
      dryness: 1,                           // 1 = dry look, 0 = wet look
      washed: 0,                            // coverage 0..1 (brush/wash)
      heat: 0,                              // dry dwell heat 0..1 (damage risk)
      points: [],                           // recomputed each render
      // --- Phase 6: colour / styling state (edits the SAME strand model) ---
      dyeColor: null,                       // target colour hex being applied
      dyeCov: 0,                            // 0..1 how fully the dye covers this strand
      highlight: 0,                         // 0..1 lighter streak strength (highlights)
      balayage: 0,                          // 0..1 root→tip lift strength (balayage)
      balColor: null,                       // balayage/highlight tint colour
      volume: 0,                            // 0..1 root lift / outward spread (volume)
    });
  }
  // Draw crown/back strands first, side strands last, so edges layer naturally.
  strands.sort((a,b)=>Math.abs(a.side)-Math.abs(b.side));
  return { strands, traits:{count,width,baseLen,curlType,headRX,headRY,headCX,headCY}, headColor: skinFor(c) };
}
function skinFor(c){
  const skin=['#ffdcc0','#f6c9a8','#e8b48c','#c98d63','#a9714a'];
  return skin[(c.name.charCodeAt(0)+ (LEN_PX[c.hair.length]||140))%skin.length];
}

/* ---- L2. Compute a strand's polyline points from its state ---- */
function computeStrandPoints(s){
  const segs = 8;
  const pts = [];
  // Phase 6: volume lifts the root upward a touch and spreads strands outward.
  const lift = (s.volume||0) * 10;
  const spread = 1 + (s.volume||0)*0.6;
  const sd = (s.side ?? 0);                 // -1 (left) … +1 (right)
  // --- Soft, rounded silhouette (bug fix for the geometric/tent shape) ---
  // The old path pushed strands outward LINEARLY with fall (drape ∝ f), which drew
  // straight diagonal edges, and near-crown strands converged to a point → a sharp
  // peaked tent. We instead build an eased outward profile that:
  //  • curves (ease-out) rather than running straight, so the sides round off, and
  //  • gives even crown strands a gentle constant spread so the top is domed, not pointed.
  // Total outward reach still scales with how far the root sits from center, so the
  // sides/back stay fully covered (no bald-patch regression).
  // Outward tip drift, scaled by distance-from-crown. Kept modest so tips drape
  // down the sides without splaying off the head (temples ≈ 0.30·len, crown small).
  const reach = (Math.abs(sd)*0.30) * s.len * spread;
  const outDir = sd>=0 ? 1 : -1;
  // a small baseline spread even near the crown so the top reads as a rounded dome
  // (not a single converging spike). Signed by which side of centre the root is on.
  const crownEase = 7 * (sd>=0?1:-1) * spread;
  for(let k=0;k<=segs;k++){
    const f = k/segs;
    const y = (s.rootY - lift*(1-f)) + s.len*f;
    // ease-out curve (rounded outward bow rather than a straight diagonal):
    // ease = 1-(1-f)^2  → gentle near the root, tapering as it falls.
    const ease = 1 - (1-f)*(1-f);
    const out = outDir * reach * ease + crownEase * ease;
    // curl wave offset (deterministic via curlSeed)
    const wave = Math.sin(s.curlSeed + f*Math.PI*s.curlFreq*2) * s.curlAmp * f;
    let x = s.rootX + out + wave;
    // frizz for damaged/heat-stressed strands
    if(s.damaged || s.heat>0.6){ x += (Math.random()-0.5)* (s.heat>0.6?3.5:1.6); }
    pts.push({x,y});
  }
  s.points = pts;
  return pts;
}
// Phase 6: effective base colour of a strand = original blended toward applied dye.
function strandBaseColor(s){
  let c = s.color;
  if(s.dyeColor && s.dyeCov>0) c = mix(c, s.dyeColor, clamp(s.dyeCov,0,1));
  return c;
}

/* ---- L3. HairStage: canvas setup, render, pointer mapping, particles ---- */
// mode-specific draw of the tool cursor & overlays handled by caller via hooks.
function HairStage(model, opts){
  const wrap = document.createElement('div');
  wrap.className = 'hair-stage';
  wrap.innerHTML = `<canvas class="hair-canvas" width="${HAIR_W}" height="${HAIR_H}"></canvas>`;
  const canvas = wrap.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const particles = [];   // {x,y,vx,vy,life,color,kind}

  // pointer state in canvas coords
  let pointer = {x:-99,y:-99,down:false,px:-99,py:-99};

  function toCanvas(clientX, clientY){
    const r = canvas.getBoundingClientRect();
    return { x:(clientX-r.left)/r.width*HAIR_W, y:(clientY-r.top)/r.height*HAIR_H };
  }
  function onDown(e){
    e.preventDefault();
    const p = pt(e); pointer.px=p.x; pointer.py=p.y; pointer.x=p.x; pointer.y=p.y; pointer.down=true;
    opts.onDrag && opts.onDrag(pointer, true);
  }
  function onMove(e){
    const p = pt(e); pointer.px=pointer.x; pointer.py=pointer.y; pointer.x=p.x; pointer.y=p.y;
    if(pointer.down){ e.preventDefault(); opts.onDrag && opts.onDrag(pointer, false); }
    else { opts.onHover && opts.onHover(pointer); }
  }
  function onUp(e){ pointer.down=false; opts.onUp && opts.onUp(pointer); }
  function pt(e){ const t=e.touches&&e.touches[0]; return toCanvas(t?t.clientX:e.clientX, t?t.clientY:e.clientY); }

  canvas.addEventListener('mousedown',onDown);
  canvas.addEventListener('touchstart',onDown,{passive:false});
  window.addEventListener('mousemove',onMove);
  canvas.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchend',onUp);

  // particle spawn helper (cut bits / water / heat shimmer)
  function spawn(x,y,kind,color){
    const n = kind==='cut'?4:kind==='water'?3:2;
    for(let j=0;j<n;j++){
      particles.push({
        x,y,
        vx:(Math.random()-0.5)*(kind==='heat'?0.6:2),
        vy:(kind==='cut'?1.2:kind==='water'?1.6:-0.5)+Math.random()*1.2,
        life:1, kind, color: color||'#fff'
      });
    }
  }

  let raf=null, running=true;
  function frame(){
    if(!running) return;
    ctx.clearRect(0,0,HAIR_W,HAIR_H);
    // head silhouette
    ctx.save();
    ctx.fillStyle = model.headColor;
    ctx.beginPath();
    ctx.ellipse(HEAD_CX, HEAD_TOP+HEAD_RY*0.55, HEAD_RX*0.9, HEAD_RY*0.95, 0, 0, Math.PI*2);
    ctx.fill();
    // neck
    ctx.fillRect(HEAD_CX-18, HEAD_TOP+HEAD_RY*1.1, 36, 40);
    ctx.restore();

    // optional overlay drawn under strands (e.g. target guide)
    opts.drawUnder && opts.drawUnder(ctx);

    // strands
    for(const s of model.strands){
      if(s.len<=2) continue;
      computeStrandPoints(s);
      // Phase 6: base colour = original blended toward any applied dye
      let color = strandBaseColor(s);
      if(s.wet && s.dryness<0.5) color = shade(color, -18);         // wet = darker
      if(s.damaged) color = mix(color, '#c86', 0.25);
      if(s.heat>0.6) color = mix(color, '#e05a5a', clamp((s.heat-0.6)*0.8,0,0.4)); // heat tint
      const p=s.points;
      ctx.lineCap='round';

      if(s.balayage>0 && s.balColor){
        // Phase 6: balayage — gradient from base at root to lifted colour at tip
        drawStrandGradient(ctx, p, color, mix(color, s.balColor, clamp(s.balayage,0,1)), model.traits.width);
      } else {
        ctx.strokeStyle = color;
        ctx.lineWidth = model.traits.width * (s.washed>0.5?1.02:1);
        ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
        for(let k=1;k<p.length;k++) ctx.lineTo(p[k].x,p[k].y);
        ctx.stroke();
      }

      // Phase 6: highlight streak — thin lighter line down part of the strand
      if(s.highlight>0 && s.balColor){
        ctx.strokeStyle = mix(color, s.balColor, clamp(s.highlight,0,1));
        ctx.lineWidth = Math.max(2, model.traits.width*0.5);
        ctx.beginPath();
        const start=1; // begin a little below the root
        ctx.moveTo(p[start].x+1, p[start].y);
        for(let k=start+1;k<p.length;k++) ctx.lineTo(p[k].x+1, p[k].y);
        ctx.stroke();
      }

      // sheen highlight when washed/dry & healthy
      if(s.washed>0.6 && !s.damaged && s.dryness>0.5){
        ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(p[0].x-1,p[0].y);
        for(let k=1;k<p.length;k++) ctx.lineTo(p[k].x-1,p[k].y);
        ctx.stroke();
      }
    }

    // Phase 6: styling shape (updo/bun/ponytail/braids) + accessory overlays
    drawStyleOverlays(ctx, model);

    // overlay drawn over strands (tool cursor)
    opts.drawOver && opts.drawOver(ctx, pointer);

    // particles
    for(let j=particles.length-1;j>=0;j--){
      const q=particles[j];
      q.x+=q.vx; q.y+=q.vy; q.life-=0.03;
      if(q.kind==='water') q.vy+=0.12;
      if(q.life<=0){ particles.splice(j,1); continue; }
      ctx.globalAlpha=clamp(q.life,0,1);
      if(q.kind==='heat'){ ctx.fillStyle='rgba(255,180,120,.5)'; ctx.beginPath(); ctx.arc(q.x,q.y,2.5,0,7); ctx.fill(); }
      else if(q.kind==='water'){ ctx.fillStyle='#bfe3ff'; ctx.beginPath(); ctx.arc(q.x,q.y,2,0,7); ctx.fill(); }
      else if(q.kind==='serum'){ ctx.fillStyle=q.color||'#ffe6a8'; ctx.beginPath(); ctx.arc(q.x,q.y,2.4,0,7); ctx.fill(); ctx.globalAlpha=clamp(q.life*0.5,0,1); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(q.x-0.8,q.y-0.8,0.9,0,7); ctx.fill(); }
      else if(q.kind==='sparkle'){ ctx.fillStyle=q.color||'#fff'; ctx.font='10px serif'; ctx.textAlign='center'; ctx.fillText('✨',q.x,q.y); }
      else { ctx.fillStyle=q.color; ctx.fillRect(q.x,q.y,2.5,2.5); }
      ctx.globalAlpha=1;
    }
    raf=requestAnimationFrame(frame);
  }
  frame();

  return {
    wrap, canvas, ctx, spawn,
    toCanvas,
    stop(){ running=false; if(raf) cancelAnimationFrame(raf);
      canvas.removeEventListener('mousedown',onDown); canvas.removeEventListener('touchstart',onDown);
      window.removeEventListener('mousemove',onMove); canvas.removeEventListener('touchmove',onMove);
      window.removeEventListener('mouseup',onUp); canvas.removeEventListener('touchend',onUp);
    },
    strandsNear(x,y,rad){ return model.strands.filter(s=>{
      // test proximity to the strand polyline (sample its points)
      for(const p of (s.points.length?s.points:[{x:s.rootX,y:s.rootY}])){
        if(Math.abs(p.x-x)<rad && Math.abs(p.y-y)<rad) return true;
      } return false; });
    },
  };
}
// small colour mixing helper (returns hex)
function mix(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const ar=(pa>>16)&255,ag=(pa>>8)&255,ab=pa&255, br=(pb>>16)&255,bg=(pb>>8)&255,bb=pb&255;
  const r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bl=Math.round(ab+(bb-ab)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
// Phase 6: draw a strand polyline as a root→tip colour gradient (balayage).
function drawStrandGradient(ctx, p, rootCol, tipCol, width){
  const g = ctx.createLinearGradient(p[0].x, p[0].y, p[p.length-1].x, p[p.length-1].y);
  g.addColorStop(0, rootCol); g.addColorStop(0.45, rootCol); g.addColorStop(1, tipCol);
  ctx.strokeStyle = g; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
  for(let k=1;k<p.length;k++) ctx.lineTo(p[k].x,p[k].y);
  ctx.stroke();
}
// Phase 6: draw styling-shape + accessory overlays on top of the strands.
// model.styleShape ∈ {'updo','bun','ponytail','braids'}; model.accessory = emoji.
function drawStyleOverlays(ctx, model){
  const baseCol = model.strands.length ? strandBaseColor(model.strands[Math.floor(model.strands.length/2)]) : '#7a4a2b';
  const sh = model.styleShape;
  if(sh){
    ctx.save();
    ctx.fillStyle = baseCol; ctx.strokeStyle = shade(baseCol,-20); ctx.lineWidth=2;
    if(sh==='bun' || sh==='updo'){
      // gathered knot near the crown/back
      const bx=HEAD_CX+ (sh==='updo'?0:26), by=HEAD_TOP+ (sh==='updo'?30:46);
      ctx.beginPath(); ctx.ellipse(bx,by, 30,26, 0,0,7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle=shade(baseCol,10);
      for(let a=0;a<6;a++){ ctx.beginPath(); ctx.ellipse(bx,by,30-a*4,26-a*3,a*0.3,0,7); ctx.stroke(); }
    } else if(sh==='ponytail'){
      // gathered tail sweeping down one side
      ctx.beginPath();
      ctx.moveTo(HEAD_CX+30, HEAD_TOP+40);
      ctx.quadraticCurveTo(HEAD_CX+90, HEAD_TOP+120, HEAD_CX+60, HEAD_TOP+220);
      ctx.quadraticCurveTo(HEAD_CX+50, HEAD_TOP+150, HEAD_CX+18, HEAD_TOP+50);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if(sh==='braids'){
      // a braided plait: stacked chevrons down the center-side
      const bx=HEAD_CX+20; let by=HEAD_TOP+80;
      ctx.lineWidth=3;
      for(let k=0;k<8;k++){
        ctx.beginPath(); ctx.ellipse(bx, by+k*22, 16, 12, 0, 0, 7); ctx.fillStyle= k%2?shade(baseCol,-8):shade(baseCol,8); ctx.fill(); ctx.stroke();
      }
    }
    ctx.restore();
  }
  if(model.accessory){ drawAccessory(ctx, model, model.accessory); }
}

// Fix 2: accessory rendering anchored to the ACTUAL head bounds and scaled to head size.
// `acc` may be a legacy string (emoji) or the new object {type, e, x, y}.
// Head bounds come from model.traits (set by buildHairModel) with a safe fallback.
function accHeadBounds(model){
  const t = model.traits || {};
  return {
    cx: t.headCX ?? HEAD_CX,
    cy: t.headCY ?? (HEAD_TOP + HEAD_RY*0.55),
    rx: t.headRX ?? (HEAD_RX*0.9),
    ry: t.headRY ?? (HEAD_RY*0.95),
  };
}
function drawAccessory(ctx, model, acc){
  const b = accHeadBounds(model);
  // normalize legacy string form → object with a sensible default position
  const type = typeof acc==='string' ? accTypeFromEmoji(acc) : (acc.type||'Bow');
  const emoji = typeof acc==='string' ? acc : (acc.e||'🎀');
  // Task 1: headband removed — skip rendering it entirely (incl. old saves).
  if(type==='Headband' || emoji==='👒') return;
  // default anchor near the top-side of the head if no explicit placement stored
  const px = (acc && typeof acc==='object' && acc.x!=null) ? acc.x : b.cx - b.rx*0.45;
  const py = (acc && typeof acc==='object' && acc.y!=null) ? acc.y : b.cy - b.ry*0.75;

  ctx.save();
  // Bow / Clip / Flower → emoji glyph, sized proportionally to head, shadowed for legibility.
  const size = Math.round(b.rx * 0.62);   // ~62% of head half-width
  ctx.font = `${size}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(90,74,94,.4)'; ctx.shadowBlur=4; ctx.shadowOffsetY=2;
  ctx.fillText(emoji, px, py);
  ctx.restore();
}
function accTypeFromEmoji(e){
  const m = ACCESSORY_OPTIONS.find(a=>a.e===e);
  return m ? m.n : 'Bow';
}

// Build the hair model once per client and reuse across wash/cut/dry so the
// same head of hair carries changes between actions. [EXT] Phase 6 edits it too.
function getHairModel(){
  if(!session._hair) session._hair = buildHairModel(client);
  return session._hair;
}
let _activeStage = null;   // current HairStage (so we can stop it on exit)
function mountStage(stage){
  if(_activeStage) _activeStage.stop();
  _activeStage = stage;
  const area=$('#actArea');
  area.appendChild(stage.wrap);
}
function finishAction(key, rawQ){
  if(_activeStage){ _activeStage.stop(); _activeStage=null; }
  recordQuality(key, rawQ);
}

/* ---- L4. REALISTIC CUTTING ---- */
// Target length (canvas px) inferred from the requested cut service + keepLength.
function cutTargetFor(key){
  const base = getHairModel().traits.baseLen;
  if(key==='short')  return LEN_PX['short'];
  if(key==='long')   return LEN_PX['long'];
  if(key==='bangs')  return base;                 // handled as front-shorter; see eval
  if(key==='layers') return base*0.82;            // graduated; eval rewards variance
  // trim / default: keep most length, take a little off
  return client.request.keepLength ? base*0.9 : base*0.75;
}
function actCut(key){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const spd=equipSpeedMod(key);                   // scissors: <1 = more forgiving
  const tol = 14 + (1.25-spd)*16;                 // "good" length band half-width
  const targetLen = cutTargetFor(key);
  const targetY = SCALP_Y + targetLen;            // guide line in canvas space
  const isLayers = key==='layers', isBangs = key==='bangs';

  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML = `✂️ Drag across the hair to cut. ${isLayers?'Aim for <b>graduated</b> lengths (shorter top layers).':isBangs?'Shorten the <b>front</b> section for bangs.':'Cut evenly toward the <b>guide line</b>.'}`;

  const stage = HairStage(model, {
    drawUnder(ctx){
      // target guide line + tolerance band (wider = better scissors)
      ctx.save();
      ctx.strokeStyle='rgba(90,74,94,.35)'; ctx.setLineDash([6,6]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(20,targetY); ctx.lineTo(HAIR_W-20,targetY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(120,200,140,.14)';
      ctx.fillRect(20, targetY-tol, HAIR_W-40, tol*2);
      ctx.restore();
    },
    drawOver(ctx,p){ drawScissors(ctx,p.x,p.y,p.down); },
    onDrag(p){ cutAt(p.x,p.y); },
  });
  mountStage(stage);
  area.appendChild(hint);
  const doneBtn=document.createElement('button'); doneBtn.className='btn mint'; doneBtn.textContent='✅ Done cutting';
  doneBtn.onclick=()=>finishAction(key, evalCut(key,targetLen,tol,isLayers,isBangs));
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(doneBtn); area.appendChild(row);

  // cut logic: shorten strands whose current tip is below the pointer to pointer height.
  // Bug fix: length is measured from each strand's OWN root (s.rootY), not the global
  // crown (SCALP_Y). Side strands root LOWER than the crown, so using SCALP_Y left
  // their tips well below the guide line after a full-width cut (spiky sides). Using
  // the per-strand root makes every cut strand's tip land at the pointer Y.
  function cutAt(x,y){
    if(y<=SCALP_Y+10) return;
    let cutAny=false;
    for(const s of model.strands){
      const tipX = s.points.length ? s.points[s.points.length-1].x : s.rootX;
      const cutLen = y - s.rootY;                  // per-strand length to reach pointer Y
      if(cutLen > 8 && Math.abs(tipX - x) < 28 && s.len > cutLen){
        s.len = Math.max(12, cutLen + (Math.random()-0.5)*4); // slight raggedness
        cutAny=true;
      }
    }
    if(cutAny) stage.spawn(x,y,'cut', model.strands[0].color);
  }
}
function drawScissors(ctx,x,y,open){
  // PNG scissors (open/closed) with emoji fallback
  const key = open ? 'tool-scissors-open' : 'tool-scissors';
  if(drawAsset(ctx, key, x, y, 40)) return;
  ctx.save(); ctx.translate(x,y); ctx.font='24px serif'; ctx.textAlign='center';
  ctx.fillText(open?'✂️':'✂', 0, 8); ctx.restore();
}
// Evaluate cut → raw quality tier
function evalCut(key, targetLen, tol, isLayers, isBangs){
  const model=getHairModel();
  // Measure each strand's length BELOW THE CROWN (tip Y relative to SCALP_Y), which
  // is the same scale targetLen uses. This matches the cut logic (which now sets tips
  // to the pointer Y regardless of root height), so a visually-even cut reads as even.
  // Scoring formulas below are unchanged — only the measured quantity is normalised.
  const effLen = s => (s.rootY + s.len) - SCALP_Y;
  const lens = model.strands.map(effLen);
  const avg = lens.reduce((a,b)=>a+b,0)/lens.length;
  const variance = lens.reduce((a,b)=>a+(b-avg)*(b-avg),0)/lens.length;
  const sd = Math.sqrt(variance);

  if(isLayers){
    // layers want graduated lengths → moderate/high SD is GOOD, and avg near target
    const lenScore = 100 - clamp(Math.abs(avg-targetLen)/tol*40,0,60);
    const gradScore = clamp((sd-8)/22*100, 0, 100);   // reward graduation
    return tierFromScore((lenScore*0.5 + gradScore*0.5));
  }
  if(isBangs){
    // bangs: front strands (near HEAD_CX) should be notably shorter than sides
    const front = model.strands.filter(s=>Math.abs(s.rootX-HEAD_CX)<28);
    const sides = model.strands.filter(s=>Math.abs(s.rootX-HEAD_CX)>=28);
    const fAvg = avgLen(front), sAvg = avgLen(sides);
    const diff = sAvg - fAvg;                          // want positive (front shorter)
    return tierFromScore(clamp(diff/60*100, 0, 100));
  }
  // trim/short/long: closeness to target + evenness
  const lenScore = 100 - clamp(Math.abs(avg-targetLen)/tol*60, 0, 100);
  const evenScore = 100 - clamp(sd/tol*70, 0, 100);
  return tierFromScore(lenScore*0.55 + evenScore*0.45);
}
function avgLen(arr){ return arr.length?arr.reduce((a,s)=>a+((s.rootY+s.len)-SCALP_Y),0)/arr.length:0; }
function tierFromScore(sc){ return sc>=85?'Perfect':sc>=65?'Good':sc>=40?'OK':'Poor'; }

/* ---- L5. REALISTIC WASHING / BRUSHING ---- */
function actWash(key){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const spd=equipSpeedMod(key);
  // tangled/curly hair needs more strokes
  const tangle = {straight:1,wavy:1.15,curly:1.35,coily:1.6}[model.traits.curlType]||1;
  model.strands.forEach(s=>{ s.wet=true; s.dryness=0.15; s.washed=s.washed||0; }); // wet look
  let coverage=0;

  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML='🧴 Drag the sponge across <b>all</b> the hair to wash & lather. Cover every section!';
  const meterWrap=document.createElement('div'); meterWrap.className='cover-meter';
  meterWrap.innerHTML=`<div class="cover-track"><i id="covFill"></i></div><span id="covLbl">0%</span>`;

  const stage=HairStage(model,{
    drawOver(ctx,p){ drawSponge(ctx,p.x,p.y); },
    onDrag(p){ washAt(p.x,p.y); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meterWrap);
  const doneBtn=document.createElement('button'); doneBtn.className='btn mint'; doneBtn.textContent='🚿 Rinse & finish';
  doneBtn.onclick=()=>finishAction(key, evalCoverage());
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(doneBtn); area.appendChild(row);

  let lastWashT=0;
  function washAt(x,y){
    // TIME-BASED pacing (same fix as drying): fill is proportional to real elapsed
    // time, not per drag-event, so completion speed is independent of pointermove
    // frequency / device polling rate. WASH_FILL_RATE is now a per-SECOND rate.
    const now = performance.now();
    let dt = lastWashT ? (now - lastWashT)/1000 : 0.016;
    lastWashT = now;
    dt = Math.min(dt, 0.05);
    const inc = ((WASH_FILL_RATE / tangle) / spd) * dt;
    let touched=false;
    for(const s of model.strands){
      const pts=s.points.length?s.points:[{x:s.rootX,y:s.rootY}];
      for(const p of pts){
        if(Math.abs(p.x-x)<30 && Math.abs(p.y-y)<34){
          s.washed = Math.min(1, s.washed + inc);
          touched=true; break;
        }
      }
    }
    if(touched) stage.spawn(x,y,'water','#bfe3ff');
    updateMeter();
  }
  function updateMeter(){
    coverage = model.strands.reduce((a,s)=>a+Math.min(1,s.washed),0)/model.strands.length;
    const f=$('#covFill'), l=$('#covLbl'); if(f){f.style.width=Math.round(coverage*100)+'%';} if(l){l.textContent=Math.round(coverage*100)+'%';}
  }
  function evalCoverage(){
    const secs=Math.max(1,(Date.now()-session.startTime)/1000);
    // reasonable coverage in reasonable time. speed gear eases the time factor.
    const cov=coverage*100;
    const timePenalty = secs<2 ? 25 : 0;   // too fast/incomplete
    return tierFromScore(clamp(cov - timePenalty,0,100));
  }
}
function drawSponge(ctx,x,y){
  if(drawAsset(ctx, 'tool-sponge', x, y, 42)) return;
  ctx.save(); ctx.translate(x,y); ctx.font='26px serif'; ctx.textAlign='center'; ctx.fillText('🧽',0,9); ctx.restore();
}

/* ---- L6. REALISTIC DRYING ---- */
function actDry(key){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const spd=equipSpeedMod(key);
  // if hair wasn't washed, it's already dry-ish; drying still styles/settles it
  let coverage=0, anyDamaged=false;

  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML='💨 Drag the dryer over the hair to dry & style. Keep moving — lingering too long <b>scorches</b> it! 🔥';
  const meterWrap=document.createElement('div'); meterWrap.className='cover-meter';
  meterWrap.innerHTML=`<div class="cover-track"><i id="dcovFill"></i></div><span id="dcovLbl">0%</span>`;

  const stage=HairStage(model,{
    drawOver(ctx,p){ drawDryer(ctx,p.x,p.y,p.down); if(p.down && stage) stage.spawn(p.x,p.y,'heat'); },
    onDrag(p){ dryAt(p.x,p.y); },
    onUp(){ /* stop heating */ },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meterWrap);
  const doneBtn=document.createElement('button'); doneBtn.className='btn mint'; doneBtn.textContent='✨ Finish styling';
  doneBtn.onclick=()=>finishAction(key, evalDry());
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(doneBtn); area.appendChild(row);

  let lastX=-99,lastY=-99,lastT=0;
  function dryAt(x,y){
    const moving = Math.abs(x-lastX)+Math.abs(y-lastY) > 6;
    lastX=x; lastY=y;
    // TIME-BASED pacing: the real cause of instant completion was that fill was
    // applied PER drag EVENT. pointermove fires many times per second (more on
    // high-refresh/high-polling devices), and one big cursor hit-box touches many
    // strands at once — so hundreds of +increment applications landed per second
    // regardless of the per-touch constant. We now apply fill proportional to real
    // ELAPSED TIME since the last drag frame (dt, capped), so speed is independent
    // of event frequency. DRY_FILL_RATE is now a per-SECOND rate.
    const now = performance.now();
    let dt = lastT ? (now - lastT)/1000 : 0.016;
    lastT = now;
    dt = Math.min(dt, 0.05);                     // cap (backgrounded tab / stalls)
    const inc = (DRY_FILL_RATE/spd) * dt;        // fill added this frame while over hair
    for(const s of model.strands){
      const pts=s.points.length?s.points:[{x:s.rootX,y:s.rootY}];
      for(const p of pts){
        if(Math.abs(p.x-x)<32 && Math.abs(p.y-y)<36){
          s.dryness=Math.min(1, s.dryness + inc);   // dries toward dry-look
          if(s.dryness>0.4) s.wet=false;
          // dwell heat builds if not moving; movement cools it (time-scaled too)
          s.heat = clamp(s.heat + (moving? -3 : 3.6/spd)*dt, 0, 1);
          if(s.heat>0.85 && !s.damaged){ s.damaged=true; anyDamaged=true; }
          break;
        }
      }
    }
    updateMeter();
  }
  function updateMeter(){
    coverage = model.strands.reduce((a,s)=>a+Math.min(1,s.dryness),0)/model.strands.length;
    const f=$('#dcovFill'), l=$('#dcovLbl'); if(f){f.style.width=Math.round(coverage*100)+'%';} if(l){l.textContent=Math.round(coverage*100)+'%';}
  }
  function evalDry(){
    const cov=coverage*100;
    // only penalize HEAT-caused scorching, not pre-existing damaged condition
    const scorched=model.strands.filter(s=>s.heat>0.6).length;
    const damagePenalty = scorched/model.strands.length*100*0.8;
    return tierFromScore(clamp(cov - damagePenalty, 0, 100));
  }
}
function drawDryer(ctx,x,y,on){
  // Task 2: enlarged so the dryer reads clearly against the hair (size-only change).
  if(drawAsset(ctx, 'tool-hairdryer', x, y, 92)) return;
  ctx.save(); ctx.translate(x,y); ctx.font='26px serif'; ctx.textAlign='center'; ctx.fillText('💨',0,9); ctx.restore();
}

/* --- Bangs: pick a style (blunt / side-swept / curtain) --- */
/* ============================================================
   PHASE 6: strand-based realistic interactions for colour, curl,
   straighten, highlights, balayage, volume. All reuse HairStage
   and edit the SAME session._hair strand model, then finish via
   recordQuality() so the pipeline is untouched. Simple services
   (bangs/style/accessory/treatment) still apply a visible change.
   ============================================================ */

// Shared colour-match scoring for colour/highlights/balayage (unchanged rules).
function colorMatchQuality(chosen){
  const want = client.request.wantColor;
  if(!want) return 'Good';
  if(chosen===want) return 'Perfect';
  if((COLOR_NEIGHBORS[want]||[]).includes(chosen)) return 'OK';
  return 'Poor';
}
function hexForColorName(name){ const s=COLOR_SWATCHES.find(c=>c.name===name); return s?s.hex:'#f2d18b'; }
// A lighter tint for highlights/balayage lift.
function lift(hex){ return shade(mix(hex,'#fff3c4',0.45), 18); }

// Small swatch-picker step reused by colour/highlights/balayage. onPick(name).
function swatchStep(prompt, onPick){
  const area=$('#actArea');
  area.innerHTML=`<div class="pick-prompt">${prompt}</div>
    <div class="swatch-grid">${COLOR_SWATCHES.map((s,i)=>`
      <button class="swatch" data-i="${i}" title="${s.name}" style="background:${s.hex}"><span>${s.name}</span></button>`).join('')}</div>`;
  area.querySelectorAll('.swatch').forEach(el=>{ el.onclick=()=>onPick(COLOR_SWATCHES[+el.dataset.i]); });
}

/* ---- REALISTIC COLORING: pick swatch, then brush over strands ---- */
function actColor(key){
  const want=client.request.wantColor;
  swatchStep(want?`She asked for <b>${want}</b> — pick the colour 🎨`:'Pick a colour to apply 🎨', (sw)=>{
    colorBrush(key, sw);
  });
}
function colorBrush(key, sw){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML=`🖌️ Drag the brush across <b>all</b> the hair to apply <b>${sw.name}</b>. Cover it evenly!`;
  const meter=document.createElement('div'); meter.className='cover-meter';
  meter.innerHTML=`<div class="cover-track"><i id="colFill" style="background:${sw.hex}"></i></div><span id="colLbl">0%</span>`;
  const stage=HairStage(model,{
    drawOver(ctx,p){ drawBrush(ctx,p.x,p.y,sw.hex); },
    onDrag(p){ paintAt(p.x,p.y); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meter);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✅ Done colouring';
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);
  done.onclick=()=>finishAction(key, evalColor(key, sw.name));

  function paintAt(x,y){
    let touched=false;
    for(const s of model.strands){
      for(const p of (s.points.length?s.points:[{x:s.rootX,y:s.rootY}])){
        if(Math.abs(p.x-x)<28 && Math.abs(p.y-y)<32){
          s.dyeColor=sw.hex; s.dyeCov=Math.min(1, s.dyeCov+0.16); touched=true; break;
        }
      }
    }
    if(touched) stage.spawn(x,y,'cut',sw.hex);  // reuse particle bits as paint flecks
    const cov=model.strands.reduce((a,s)=>a+(s.dyeColor===sw.hex?Math.min(1,s.dyeCov):0),0)/model.strands.length;
    const f=$('#colFill'),l=$('#colLbl'); if(f)f.style.width=Math.round(cov*100)+'%'; if(l)l.textContent=Math.round(cov*100)+'%';
  }
}
function evalColor(key, chosenName){
  const model=getHairModel();
  // coverage + evenness of dye across strands
  const covs=model.strands.map(s=>s.dyeColor?Math.min(1,s.dyeCov):0);
  const avg=covs.reduce((a,b)=>a+b,0)/covs.length;
  const sd=Math.sqrt(covs.reduce((a,b)=>a+(b-avg)*(b-avg),0)/covs.length);
  const coverageScore = clamp(avg*100,0,100) - clamp(sd*120,0,50); // uneven = penalty
  // colour accuracy vs requested
  const matchTier = colorMatchQuality(chosenName);
  const matchScore = {Perfect:100,Good:80,OK:55,Poor:25}[matchTier];
  const score = coverageScore*0.5 + matchScore*0.5;
  // store extras for satisfaction colour-match hook (Phase 4 reads s.extras[key].color)
  session.extras[key]={color:chosenName, want:client.request.wantColor, coverage:Math.round(avg*100)};
  return tierFromScore(score);
}
function drawBrush(ctx,x,y,hex){
  // PNG colour brush with the selected-colour tip cue preserved on top
  if(drawAsset(ctx, 'tool-color-brush', x, y, 40)){
    ctx.save(); ctx.fillStyle=hex; ctx.beginPath(); ctx.arc(x, y-14, 5, 0, 7); ctx.fill(); ctx.restore();
    return;
  }
  ctx.save(); ctx.translate(x,y); ctx.font='24px serif'; ctx.textAlign='center';
  ctx.fillStyle=hex; ctx.beginPath(); ctx.arc(0,-2,6,0,7); ctx.fill(); ctx.fillText('🖌️',0,10); ctx.restore(); }

/* ---- REALISTIC HIGHLIGHTS: select individual strands to streak lighter ---- */
function actHighlights(key){
  const want=client.request.wantColor;
  const doIt=(tintHex, tintName)=>highlightSelect(key, tintHex, tintName);
  // highlights usually lift toward a lighter tone; let player pick a tint colour
  swatchStep(want?`Highlights toward <b>${want}</b> — pick the tint 🖌️`:'Pick a highlight tint 🖌️', (sw)=>doIt(lift(sw.hex), sw.name));
}
function highlightSelect(key, tintHex, tintName){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const target=Math.max(6, Math.round(model.strands.length*0.28)); // ~a quarter of strands
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML=`🖌️ Drag over individual strands to add lighter streaks. Aim for an even scatter (~${target}).`;
  const meter=document.createElement('div'); meter.className='cover-meter';
  meter.innerHTML=`<div class="cover-track"><i id="hlFill"></i></div><span id="hlLbl">0</span>`;
  const stage=HairStage(model,{
    drawOver(ctx,p){ drawBrush(ctx,p.x,p.y,tintHex); },
    onDrag(p){ streakAt(p.x,p.y); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meter);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✅ Done highlights';
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);
  done.onclick=()=>finishAction(key, evalHighlights(key, tintName, target));

  function streakAt(x,y){
    for(const s of model.strands){
      if(s.highlight>0) continue;
      for(const p of (s.points.length?s.points:[{x:s.rootX,y:s.rootY}])){
        if(Math.abs(p.x-x)<16 && Math.abs(p.y-y)<20){ s.highlight=1; s.balColor=tintHex; stage.spawn(p.x,p.y,'cut',tintHex); break; }
      }
    }
    const n=model.strands.filter(s=>s.highlight>0).length;
    const f=$('#hlFill'),l=$('#hlLbl'); if(f)f.style.width=clamp(n/target*100,0,100)+'%'; if(l)l.textContent=n;
  }
}
function evalHighlights(key, tintName, target){
  const model=getHairModel();
  const chosen=model.strands.filter(s=>s.highlight>0);
  const n=chosen.length;
  // amount closeness + even scatter (spread of root X positions)
  const amountScore = 100 - clamp(Math.abs(n-target)/target*100, 0, 70);
  let evenScore=60;
  if(n>1){
    const xs=chosen.map(s=>s.rootX).sort((a,b)=>a-b);
    const gaps=[]; for(let i=1;i<xs.length;i++) gaps.push(xs[i]-xs[i-1]);
    const gAvg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    const gSd=Math.sqrt(gaps.reduce((a,b)=>a+(b-gAvg)*(b-gAvg),0)/gaps.length);
    evenScore=100-clamp(gSd/ (gAvg||1) *60,0,70);
  }
  session.extras[key]={color:tintName, want:client.request.wantColor, count:n};
  const matchAdj = client.request.wantColor ? {Perfect:1,Good:0.9,OK:0.7,Poor:0.5}[colorMatchQuality(tintName)] : 1;
  return tierFromScore((amountScore*0.5+evenScore*0.5)*matchAdj);
}

/* ---- REALISTIC BALAYAGE: drag downward along locks for root→tip lift ---- */
function actBalayage(key){
  const want=client.request.wantColor;
  swatchStep(want?`She wants a <b>${want}</b> balayage — pick the colour 🌈`:'Pick a balayage colour 🌈', (sw)=>{
    balayageDrag(key, sw);
  });
}
function balayageDrag(key, sw){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  // Bug 1 fix: balayage blends the tips toward the SELECTED colour (sw.hex),
  // exactly like flat colouring — not toward lift(sw.hex), which cream-lightened
  // the colour and made dark picks (e.g. Black) look like the untouched gradient.
  const tint=sw.hex;
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML=`🌈 Drag <b>downward</b> along the locks (root → tip) to sweep on a soft ${sw.name} balayage.`;
  const meter=document.createElement('div'); meter.className='cover-meter';
  meter.innerHTML=`<div class="cover-track"><i id="balFill" style="background:${tint}"></i></div><span id="balLbl">0%</span>`;
  const stage=HairStage(model,{
    drawOver(ctx,p){ drawBrush(ctx,p.x,p.y,tint); },
    onDrag(p){ sweepAt(p.x,p.y); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meter);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✅ Done balayage';
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);
  done.onclick=()=>finishAction(key, evalBalayage(key, sw.name));

  function sweepAt(x,y){
    let touched=false;
    for(const s of model.strands){
      const pts=s.points.length?s.points:[{x:s.rootX,y:s.rootY}];
      for(let idx=0; idx<pts.length; idx++){
        const p=pts[idx];
        if(Math.abs(p.x-x)<24 && Math.abs(p.y-y)<26){
          // more lift toward the tip (higher idx), none at the root
          const tipFrac=idx/(pts.length-1);
          s.balColor=tint; s.balayage=Math.max(s.balayage, clamp(tipFrac*1.1,0,1)*0.9);
          touched=true; break;
        }
      }
    }
    if(touched) stage.spawn(x,y,'cut',tint);
    const cov=model.strands.reduce((a,s)=>a+(s.balayage>0.2?1:0),0)/model.strands.length;
    const f=$('#balFill'),l=$('#balLbl'); if(f)f.style.width=Math.round(cov*100)+'%'; if(l)l.textContent=Math.round(cov*100)+'%';
  }
}
function evalBalayage(key, chosenName){
  const model=getHairModel();
  const lifted=model.strands.filter(s=>s.balayage>0.2);
  const cov=lifted.length/model.strands.length*100;
  session.extras[key]={color:chosenName, want:client.request.wantColor, coverage:Math.round(cov)};
  const matchAdj = client.request.wantColor ? {Perfect:1,Good:0.9,OK:0.7,Poor:0.5}[colorMatchQuality(chosenName)] : 1;
  return tierFromScore(clamp(cov,0,100)*matchAdj);
}

/* ---- REALISTIC CURLING / STRAIGHTENING: drag iron along locks ---- */
function actCurl(key){ ironAlong(key, 'curl'); }
function actStraighten(key){ ironAlong(key, 'straight'); }
function ironAlong(key, mode){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const spd=equipSpeedMod(key);
  const icon = mode==='curl' ? '🌀' : '🔥';
  const toolKey = mode==='curl' ? 'tool-curling-iron' : 'tool-straightener';
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML=`${icon} Drag the ${mode==='curl'?'curling iron':'straightener'} <b>along each lock</b> (root → tip). Don't linger — heat scorches! 🔥`;
  const meter=document.createElement('div'); meter.className='cover-meter';
  meter.innerHTML=`<div class="cover-track"><i id="ironFill"></i></div><span id="ironLbl">0%</span>`;
  const stage=HairStage(model,{
    drawOver(ctx,p){
      if(!drawAsset(ctx, toolKey, p.x, p.y, 42)){ ctx.save(); ctx.translate(p.x,p.y); ctx.font='24px serif'; ctx.textAlign='center'; ctx.fillText(icon,0,9); ctx.restore(); }
      if(p.down && stage) stage.spawn(p.x,p.y,'heat');
    },
    onDrag(p){ ironAt(p.x,p.y); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meter);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✅ Done';
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);
  done.onclick=()=>finishAction(key, evalIron(key, mode));

  let lastX=-99,lastY=-99;
  function ironAt(x,y){
    const moving=Math.abs(x-lastX)+Math.abs(y-lastY)>6; lastX=x; lastY=y;
    for(const s of model.strands){
      for(const p of (s.points.length?s.points:[{x:s.rootX,y:s.rootY}])){
        if(Math.abs(p.x-x)<22 && Math.abs(p.y-y)<26){
          if(mode==='curl'){ s.curlAmp=Math.min(24, s.curlAmp + 0.9/spd); s.curlFreq=Math.min(3.6, s.curlFreq+0.05); }
          else { s.curlAmp=Math.max(0, s.curlAmp - 1.1/spd); s.curlFreq=Math.max(0, s.curlFreq-0.06); }
          s.styled=true;
          s.heat=clamp(s.heat + (moving? -0.05 : 0.07/spd), 0, 1);
          if(s.heat>0.85 && !s.damaged) s.damaged=true;
          break;
        }
      }
    }
    const done=model.strands.filter(s=>s.styled).length/model.strands.length;
    const f=$('#ironFill'),l=$('#ironLbl'); if(f)f.style.width=Math.round(done*100)+'%'; if(l)l.textContent=Math.round(done*100)+'%';
  }
}
function evalIron(key, mode){
  const model=getHairModel();
  const styled=model.strands.filter(s=>s.styled).length;
  const cov=styled/model.strands.length*100;
  const scorched=model.strands.filter(s=>s.heat>0.6).length/model.strands.length*100;
  // curl tightness descriptor from average amplitude (for extras flavour)
  const avgAmp=model.strands.reduce((a,s)=>a+s.curlAmp,0)/model.strands.length;
  if(mode==='curl'){ session.extras[key]={curl: avgAmp<10?CURL_KINDS[0]:avgAmp<18?CURL_KINDS[1]:CURL_KINDS[2]}; }
  return tierFromScore(clamp(cov - scorched*0.8, 0, 100));
}

/* ---- VOLUME / STYLING BOOST: fluff upward near the roots ---- */
function actVolume(key){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML='🎈 Drag <b>upward</b> near the roots across the whole head to fluff & lift for volume.';
  const meter=document.createElement('div'); meter.className='cover-meter';
  meter.innerHTML=`<div class="cover-track"><i id="volFill"></i></div><span id="volLbl">0%</span>`;
  const stage=HairStage(model,{
    drawOver(ctx,p){ if(!drawAsset(ctx, 'tool-hand', p.x, p.y, 42)){ ctx.save(); ctx.translate(p.x,p.y); ctx.font='24px serif'; ctx.textAlign='center'; ctx.fillText('🖐️',0,9); ctx.restore(); } },
    onDrag(p){ fluffAt(p); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meter);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✅ Done styling';
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);
  done.onclick=()=>finishAction(key, evalVolume());

  function fluffAt(p){
    const movingUp = p.py - p.y > 1;  // dragging upward
    for(const s of model.strands){
      // fluff affects strands whose root is near the pointer's x, when moving upward near roots
      if(Math.abs(s.rootX-p.x)<30 && p.y < s.rootY+60){
        if(movingUp) s.volume=Math.min(1, s.volume+0.14);
      }
    }
    const avg=model.strands.reduce((a,s)=>a+s.volume,0)/model.strands.length;
    const f=$('#volFill'),l=$('#volLbl'); if(f)f.style.width=Math.round(avg*100)+'%'; if(l)l.textContent=Math.round(avg*100)+'%';
  }
  function evalVolume(){
    const vols=model.strands.map(s=>s.volume);
    const avg=vols.reduce((a,b)=>a+b,0)/vols.length;
    const sd=Math.sqrt(vols.reduce((a,b)=>a+(b-avg)*(b-avg),0)/vols.length);
    return tierFromScore(clamp(avg*100,0,100) - clamp(sd*120,0,45)); // uneven fluff penalised
  }
}

   FIX 1 (Phase 7b): real, simple interactions for the remaining

/* ---- BANGS: pick style, then a short drag-trim across FRONT strands ---- */
function actBangs(key){
  const area=$('#actArea');
  pickGrid(area, 'Pick a bangs style ✂️', BANG_STYLES.map(s=>({n:s,e:'✨'})), (ch)=>bangsTrim(key, ch.n));
}
function bangsTrim(key, styleName){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const spd=equipSpeedMod(key);
  const b=accHeadBounds(model);
  const frontLen = LEN_PX['very short'] + 20;
  const targetY = SCALP_Y + frontLen;
  // front strands only (near centre)
  const isFront = s => Math.abs(s.rootX-b.cx) < b.rx*0.42;
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML=`✂️ Drag across the <b>front</b> section to trim ${styleName} bangs to the guide line.`;
  const meter=document.createElement('div'); meter.className='cover-meter';
  meter.innerHTML=`<div class="cover-track"><i id="bngFill"></i></div><span id="bngLbl">0%</span>`;
  const stage=HairStage(model,{
    drawUnder(ctx){ ctx.save(); ctx.strokeStyle='rgba(90,74,94,.35)'; ctx.setLineDash([6,6]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(b.cx-b.rx*0.5,targetY); ctx.lineTo(b.cx+b.rx*0.5,targetY); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); },
    drawOver(ctx,p){ drawScissors(ctx,p.x,p.y,p.down); },
    onDrag(p){ trimAt(p.x,p.y); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meter);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✅ Done bangs';
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);
  done.onclick=()=>finishAction(key, evalBangs());

  function trimAt(x,y){
    if(y<=SCALP_Y+8) return;
    const cutLen=y-SCALP_Y; let any=false;
    for(const s of model.strands){
      if(!isFront(s)) continue;
      const tipX=s.points.length?s.points[s.points.length-1].x:s.rootX;
      if(Math.abs(tipX-x)<26 && s.len>cutLen){
        const jitter = styleName==='blunt'?2: styleName==='curtain'?8:5;
        s.len=Math.max(20, cutLen+(Math.random()-0.5)*jitter); s.styled=true; any=true;
      }
    }
    if(any) stage.spawn(x,y,'cut',model.strands[0].color);
    const front=model.strands.filter(isFront);
    const trimmed=front.filter(s=>s.len<=frontLen+18).length/Math.max(1,front.length);
    const f=$('#bngFill'),l=$('#bngLbl'); if(f)f.style.width=Math.round(trimmed*100)+'%'; if(l)l.textContent=Math.round(trimmed*100)+'%';
  }
  function evalBangs(){
    const front=model.strands.filter(isFront);
    if(!front.length) return 'OK';
    const lens=front.map(s=>s.len);
    const avg=lens.reduce((a,c)=>a+c,0)/lens.length;
    const sd=Math.sqrt(lens.reduce((a,c)=>a+(c-avg)*(c-avg),0)/lens.length);
    const trimmed=front.filter(s=>s.len<=frontLen+18).length/front.length;   // coverage
    const evenTol = 8 + (1.25-spd)*8;                                         // pro scissors more forgiving
    const evenScore = 100 - clamp(sd/evenTol*70,0,100);
    session.extras[key]={style:styleName};
    return tierFromScore(trimmed*100*0.55 + evenScore*0.45);
  }
}

/* ---- UPDO: pick style, then gather-and-lift drag from sides/back to crown ---- */
function actStyle(key){
  const area=$('#actArea');
  const kind=SERVICES[key].styleKind;
  const variants={
    updo:[{n:'Classic',e:'👑'},{n:'Messy chic',e:'🌸'},{n:'Sleek',e:'✨'}],
    braids:[{n:'French',e:'🪢'},{n:'Fishtail',e:'🐟'},{n:'Dutch',e:'🌾'}],
    ponytail:[{n:'High',e:'🐎'},{n:'Low',e:'🎀'},{n:'Sleek',e:'✨'}],
    bun:[{n:'Top knot',e:'🧅'},{n:'Low bun',e:'🌙'},{n:'Ballerina',e:'🩰'}],
  }[kind]||[{n:'Style',e:'✨'}];
  pickGrid(area, `Choose a ${SERVICES[key].label.toLowerCase()} style 💇‍♀️`, variants, (ch)=>{
    if(kind==='updo') gatherStyle(key, ch.n, {shape:'updo', multi:true});
    else if(kind==='ponytail') gatherStyle(key, ch.n, {shape:'ponytail', multi:false});
    else if(kind==='bun') gatherStyle(key, ch.n, {shape:'bun', multi:false, wrap:true});
    else if(kind==='braids') braidStyle(key, ch.n);
  });
}

// Shared gather-drag used by updo / ponytail / bun. Drag strands toward a gather
// point; a "gathered" meter fills. Bun adds a circular wrap motion afterwards.
function gatherStyle(key, styleName, opt){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const b=accHeadBounds(model);
  // gather point: crown-ish for updo/bun, back for ponytail
  const gx = b.cx, gy = opt.shape==='ponytail' ? b.cy - b.ry*0.15 : b.cy - b.ry*0.62;
  model._gather = 0;                       // 0..1 how gathered (drives render tuck)
  let phase = opt.wrap ? 'gather' : 'gather';
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML = opt.multi
    ? '💪 Drag strands from the <b>sides & back</b> up toward the crown to gather the updo.'
    : (opt.shape==='ponytail' ? '💪 Drag all the hair toward the <b>back gather point</b>, then tap Tie.'
                              : '💪 Drag the hair to the gather point, then <b>coil</b> around it for the bun.');
  const meter=document.createElement('div'); meter.className='cover-meter';
  meter.innerHTML=`<div class="cover-track"><i id="gthFill"></i></div><span id="gthLbl">0%</span>`;
  const stage=HairStage(model,{
    drawUnder(ctx){ // gather target marker
      ctx.save(); ctx.strokeStyle='rgba(255,111,165,.6)'; ctx.setLineDash([4,4]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(gx,gy,14,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='rgba(255,111,165,.15)'; ctx.beginPath(); ctx.arc(gx,gy,14,0,7); ctx.fill(); ctx.restore();
    },
    drawOver(ctx,p){ if(!drawAsset(ctx,'tool-hand',p.x,p.y,40)){ ctx.save();ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('🖐️',p.x,p.y+9);ctx.restore(); } },
    onDrag(p){ (phase==='wrap'?wrapAt:gatherAt)(p); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meter);
  const btn=document.createElement('button'); btn.className='btn mint';
  btn.textContent = opt.shape==='ponytail' ? '🎀 Tie it!' : opt.wrap ? '🌀 Start coil' : '✅ Done updo';
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(btn); area.appendChild(row);
  btn.onclick=()=>{
    if(opt.wrap && phase==='gather'){ phase='wrap'; hint.innerHTML='🌀 Now drag in a <b>circle</b> at the gather point to coil the bun.'; btn.textContent='✅ Done bun'; return; }
    finishStyle();
  };

  function gatherAt(p){
    // strands whose tip is being dragged toward the gather point get "tucked"
    for(const s of model.strands){
      const tip=s.points.length?s.points[s.points.length-1]:{x:s.rootX,y:s.rootY};
      if(Math.abs(tip.x-p.x)<34 && Math.abs(tip.y-p.y)<40){
        const towardGx = Math.sign(gx - s.rootX);
        // shorten + lean toward crown so it reads as gathered up
        s.len = Math.max(LEN_PX['very short'], s.len*0.9);
        s.dir = s.dir*0.6 + towardGx*0.4;
        s.gathered = Math.min(1, (s.gathered||0)+0.34);
        stage.spawn(tip.x,tip.y,'sparkle','#ffd6ea');
      }
    }
    updateMeter();
  }
  let wrapAngPrev=null, wrapProg=0;
  function wrapAt(p){
    const a=Math.atan2(p.y-gy, p.x-gx);
    if(wrapAngPrev!=null){ let d=a-wrapAngPrev; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; wrapProg+=Math.abs(d); }
    wrapAngPrev=a;
    model._coil = Math.min(1, wrapProg/(Math.PI*3));   // ~1.5 turns = full coil
    stage.spawn(p.x,p.y,'sparkle','#ffd6ea');
    updateMeter();
  }
  function gatheredFrac(){ return model.strands.reduce((a,s)=>a+Math.min(1,s.gathered||0),0)/model.strands.length; }
  function updateMeter(){
    let v=gatheredFrac(); if(opt.wrap && phase==='wrap') v=0.6+0.4*(model._coil||0);
    model._gather=Math.max(model._gather, gatheredFrac());
    const f=$('#gthFill'),l=$('#gthLbl'); if(f)f.style.width=Math.round(v*100)+'%'; if(l)l.textContent=Math.round(v*100)+'%';
  }
  function finishStyle(){
    model.styleShape = opt.shape;
    // loose (un-gathered) strands stay long & hanging → visibly lowers result
    const gathered = gatheredFrac();
    const loose = model.strands.filter(s=>(s.gathered||0)<0.4).length/model.strands.length;
    let score = gathered*100;
    if(opt.wrap) score = score*0.6 + (model._coil||0)*100*0.4;   // bun also needs the coil
    score -= loose*40;                                            // hanging strands penalty
    session.extras[key]={style:styleName};
    finishAction(key, tierFromScore(clamp(score,0,100)));
  }
}

// BRAIDS: tap L/R/L/R over-under sequence within a time window.
function braidStyle(key, styleName){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const b=accHeadBounds(model);
  const need=8;                             // 8 alternating taps
  let expect='L', taps=0, mistakes=0, lastTapT=0, slow=0;
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML='🪢 Braid! Tap <b>Left / Right</b> in alternating order, keeping a steady rhythm.';
  const bar=document.createElement('div'); bar.className='cover-meter';
  bar.innerHTML=`<div class="cover-track"><i id="brFill"></i></div><span id="brLbl">0/${need}</span>`;
  const pads=document.createElement('div'); pads.className='btn-row'; pads.style.marginTop='8px';
  const lBtn=document.createElement('button'); lBtn.className='btn secondary'; lBtn.style.flex='1'; lBtn.textContent='⬅️ Left';
  const rBtn=document.createElement('button'); rBtn.className='btn secondary'; rBtn.style.flex='1'; rBtn.textContent='Right ➡️';
  pads.appendChild(lBtn); pads.appendChild(rBtn);
  area.appendChild(hint); area.appendChild(bar); area.appendChild(pads);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✅ Finish braid'; done.disabled=true;
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);
  // visual: mark strands as gathered into a plait as taps land
  model.styleShape='braids';
  lastTapT=Date.now();
  function tap(side){
    const now=Date.now(), dt=now-lastTapT; lastTapT=now;
    if(taps>0 && dt>1600) slow++;                 // mistimed (too slow)
    if(side===expect){ taps++; expect=expect==='L'?'R':'L';
      // tuck a couple of side strands each correct tap
      const pool=model.strands.filter(s=>!s.gathered && (side==='L'? s.rootX<b.cx : s.rootX>=b.cx));
      pool.slice(0,3).forEach(s=>{ s.gathered=1; s.len=Math.max(LEN_PX['very short'],s.len*0.85); s.dir=s.dir*0.5; });
    } else { mistakes++; }
    const f=$('#brFill'),l=$('#brLbl'); if(f)f.style.width=Math.round(taps/need*100)+'%'; if(l)l.textContent=`${taps}/${need}`;
    if(taps>=need){ done.disabled=false; lBtn.disabled=rBtn.disabled=true; hint.innerHTML='✨ Braid complete — finish up!'; }
  }
  lBtn.onclick=()=>tap('L'); rBtn.onclick=()=>tap('R');
  done.onclick=()=>{
    session.extras[key]={style:styleName};
    const acc=100 - mistakes*14 - slow*10;
    finishAction(key, tierFromScore(clamp(acc,0,100)));
  };
}

/* ---- ACCESSORIES: drag from a tray and drop onto the hair model ---- */
function actAccessory(key){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  const b=accHeadBounds(model);
  let placed=null;                          // {type,e,x,y}
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML='🎀 Drag an accessory from the tray and drop it onto the hair where you like.';
  const stage=HairStage(model,{
    drawOver(ctx,p){ if(placed){ /* preview handled by model.accessory */ } },
  });
  mountStage(stage);
  area.appendChild(hint);
  // tray of draggable accessory chips
  const tray=document.createElement('div'); tray.className='acc-tray';
  ACCESSORY_OPTIONS.forEach(a=>{
    const chip=document.createElement('button'); chip.className='acc-chip'; chip.textContent=a.e; chip.title=a.n;
    chip.dataset.type=a.n; chip.dataset.e=a.e;
    tray.appendChild(chip);
  });
  area.appendChild(tray);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✅ Done'; done.disabled=true;
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);

  const canvas=stage.wrap.querySelector('canvas');
  let dragging=null;    // {type,e}
  function canvasPos(clientX,clientY){ const r=canvas.getBoundingClientRect(); return {x:(clientX-r.left)/r.width*HAIR_W, y:(clientY-r.top)/r.height*HAIR_H}; }
  function startDrag(type,e){ dragging={type,e}; }
  function dropAt(clientX,clientY){
    if(!dragging) return;
    const r=canvas.getBoundingClientRect();
    if(clientX<r.left||clientX>r.right||clientY<r.top||clientY>r.bottom){ dragging=null; return; }
    const pos=canvasPos(clientX,clientY);
    placed={type:dragging.type, e:dragging.e, x:pos.x, y:pos.y};
    model.accessory=placed;              // renders via drawAccessory (scaled to head)
    done.disabled=false;
    dragging=null;
  }
  tray.querySelectorAll('.acc-chip').forEach(chip=>{
    chip.addEventListener('mousedown',e=>{ e.preventDefault(); startDrag(chip.dataset.type,chip.dataset.e); });
    chip.addEventListener('touchstart',e=>{ e.preventDefault(); startDrag(chip.dataset.type,chip.dataset.e); },{passive:false});
  });
  window.addEventListener('mouseup', accMouseUp);
  canvas.addEventListener('touchend', accTouchEnd);
  function accMouseUp(e){ if(!document.body.contains(canvas)){ window.removeEventListener('mouseup',accMouseUp); return; } dropAt(e.clientX,e.clientY); }
  function accTouchEnd(e){ const t=e.changedTouches&&e.changedTouches[0]; if(t) dropAt(t.clientX,t.clientY); }
  // also allow tapping directly on the canvas to place the last-selected chip
  canvas.addEventListener('mousedown',e=>{ if(dragging) dropAt(e.clientX,e.clientY); });

  done.onclick=()=>{
    window.removeEventListener('mouseup', accMouseUp);
    session.extras[key]={accessory: placed?placed.type:'Bow'};
    // quality: placed on/near the head = good; the closer to the hair mass, the better
    let q='Good';
    if(placed){ const d=Math.hypot(placed.x-b.cx, placed.y-b.cy); q = d < b.rx*1.1 ? 'Perfect' : d < b.rx*1.6 ? 'Good' : 'OK'; }
    finishAction(key, q);
  };
}

/* ---- HAIR TREATMENT: drag serum across strands (coverage-based, wash pattern) ---- */
function actTreatment(key){
  const area=$('#actArea'); area.innerHTML='';
  const model=getHairModel();
  model.strands.forEach(s=>{ s.treated=s.treated||0; });
  const poor=(client.hair.condition==='damaged'||client.hair.condition==='dry');
  const hint=document.createElement('div'); hint.className='dry-hint';
  hint.innerHTML=`💆 Drag the serum across <b>all</b> the hair to nourish it. ${poor?'Her hair is '+client.hair.condition+' — cover it well! 🌿':'A lovely shine boost. ✨'}`;
  const meter=document.createElement('div'); meter.className='cover-meter';
  meter.innerHTML=`<div class="cover-track"><i id="trFill" style="background:linear-gradient(90deg,#ffe6a8,#ffd166)"></i></div><span id="trLbl">0%</span>`;
  const stage=HairStage(model,{
    drawOver(ctx,p){ ctx.save(); ctx.font='24px serif'; ctx.textAlign='center'; ctx.fillText('💧',p.x,p.y+8); ctx.restore(); },
    onDrag(p){ serumAt(p.x,p.y); },
  });
  mountStage(stage);
  area.appendChild(hint); area.appendChild(meter);
  const done=document.createElement('button'); done.className='btn mint'; done.textContent='✨ Finish treatment';
  const row=document.createElement('div'); row.className='btn-row'; row.appendChild(done); area.appendChild(row);
  done.onclick=()=>finishAction(key, evalTreat());

  function serumAt(x,y){
    let touched=false;
    for(const s of model.strands){
      for(const p of (s.points.length?s.points:[{x:s.rootX,y:s.rootY}])){
        if(Math.abs(p.x-x)<30 && Math.abs(p.y-y)<34){
          s.treated=Math.min(1,(s.treated||0)+0.14);
          if(s.treated>0.5){ s.damaged=false; s.heat=0; s.washed=Math.max(s.washed,0.85); }
          touched=true; break;
        }
      }
    }
    if(touched) stage.spawn(x,y,'serum','#ffe6a8');
    const cov=model.strands.reduce((a,s)=>a+Math.min(1,s.treated||0),0)/model.strands.length;
    const f=$('#trFill'),l=$('#trLbl'); if(f)f.style.width=Math.round(cov*100)+'%'; if(l)l.textContent=Math.round(cov*100)+'%';
  }
  function evalTreat(){
    const cov=model.strands.reduce((a,s)=>a+Math.min(1,s.treated||0),0)/model.strands.length*100;
    return tierFromScore(clamp(cov,0,100));
  }
}

// Phase 6: draw one static frame of the hair model (head + strands + overlays)
// into any canvas — used for the summary "after" look. Mirrors HairStage's draw.
function renderHairStatic(canvas, model){
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,HAIR_W,HAIR_H);
  ctx.save(); ctx.fillStyle=model.headColor;
  ctx.beginPath(); ctx.ellipse(HEAD_CX, HEAD_TOP+HEAD_RY*0.55, HEAD_RX*0.9, HEAD_RY*0.95, 0,0,Math.PI*2); ctx.fill();
  ctx.fillRect(HEAD_CX-18, HEAD_TOP+HEAD_RY*1.1, 36, 40); ctx.restore();
  for(const s of model.strands){
    if(s.len<=2) continue;
    computeStrandPoints(s);
    let color=strandBaseColor(s);
    if(s.damaged) color=mix(color,'#c86',0.25);
    const p=s.points; ctx.lineCap='round';
    if(s.balayage>0 && s.balColor){ drawStrandGradient(ctx,p,color,mix(color,s.balColor,clamp(s.balayage,0,1)),model.traits.width); }
    else { ctx.strokeStyle=color; ctx.lineWidth=model.traits.width; ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y); for(let k=1;k<p.length;k++)ctx.lineTo(p[k].x,p[k].y); ctx.stroke(); }
    if(s.highlight>0 && s.balColor){ ctx.strokeStyle=mix(color,s.balColor,clamp(s.highlight,0,1)); ctx.lineWidth=Math.max(2,model.traits.width*0.5);
      ctx.beginPath(); ctx.moveTo(p[1].x+1,p[1].y); for(let k=2;k<p.length;k++)ctx.lineTo(p[k].x+1,p[k].y); ctx.stroke(); }
    if(s.washed>0.6 && !s.damaged){ ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(p[0].x-1,p[0].y); for(let k=1;k<p.length;k++)ctx.lineTo(p[k].x-1,p[k].y); ctx.stroke(); }
  }
  drawStyleOverlays(ctx, model);
}

function animateCount(el, to, suffix){
  let v=0; const step=Math.max(1,Math.round(to/28));
  const t=setInterval(()=>{ v+=step; if(v>=to){v=to;clearInterval(t);} el.textContent=v+suffix; },22);
}

// Phase 8: celebratory confetti burst — full-screen overlay, reuses the .heart
// float-up animation pattern. Used for level-up, fame tier, achievements, rewards.
function confettiBurst(){
