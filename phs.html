<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ploufi's Hair Salon 💇‍♀️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PLOUFI'S HAIR SALON — Phase 1
   Sections:
     1. CSS Variables & Base
     2. Layout: HUD, Stage, Panels
     3. Avatar (SVG-based client)
     4. Buttons & Controls
     5. Service action widgets (wash/cut/dry)
     6. Satisfaction breakdown & summary
     7. Animations & responsive
   ============================================================ */

/* ---------- 1. Variables & Base ---------- */
:root{
  --pink:#ff9ec4;
  --pink-deep:#ff6fa5;
  --lilac:#c8a8ff;
  --mint:#9fe6d0;
  --cream:#fff6ee;
  --peach:#ffd9c0;
  --sun:#ffd166;
  --sky:#bfe3ff;
  --ink:#5a4a5e;
  --ink-soft:#8a7a90;
  --white:#ffffff;
  --shadow:0 8px 24px rgba(160,120,160,.22);
  --shadow-sm:0 4px 12px rgba(160,120,160,.18);
  --radius:22px;
  --radius-sm:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#ffe6f1 0%,#f3e6ff 45%,#e3f6ff 100%);
  min-height:100%;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 0 24px;
}
h1,h2,h3{font-family:'Baloo 2',cursive;font-weight:800;line-height:1.1;}
.app{width:100%;max-width:760px;padding:0 14px;}

/* ---------- 2. Layout: HUD ---------- */
.hud{
  position:sticky;top:0;z-index:30;
  margin:10px 0 14px;
  display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(10px);
  border:2px solid #fff;
  border-radius:var(--radius);
  padding:10px 14px;
  box-shadow:var(--shadow-sm);
}
.hud .brand{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:800;font-size:18px;color:var(--pink-deep);}
.hud .brand .logo{font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08));}
/* Brand mark: larger than stat-chip icons (~44px), doesn't affect chip wrapping */
.hud .brand .brand-logo{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;font-size:36px;flex:0 0 auto;}
.hud .brand .brand-logo .asset-ico,.hud .brand .brand-logo .asset-slot{width:44px;height:44px;}
.hud .brand .brand-logo .asset-pending{width:44px;height:44px;}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:1;}
.chip{
  display:flex;align-items:center;gap:6px;
  background:var(--white);
  border-radius:999px;
  padding:6px 12px;
  font-weight:800;font-size:14px;
  box-shadow:var(--shadow-sm);
  border:2px solid #fff2;
}
.chip .ico{font-size:16px;}
.chip.balance{color:#3aa76d;}
.chip.fame{color:#c58bff;}
.chip.count{color:var(--pink-deep);}

/* fame mini bar */
.fame-bar{width:46px;height:8px;background:#eee;border-radius:6px;overflow:hidden;}
.fame-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--pink));border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1);}

/* ---------- 2b. Stage ---------- */
.stage{
  background:rgba(255,255,255,.66);
  border:2px solid #fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  position:relative;
  overflow:hidden;
  animation:pop .4s cubic-bezier(.2,.9,.3,1.2);
}
.stage::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,209,102,.18), transparent 22%),
    radial-gradient(circle at 88% 0%, rgba(200,168,255,.18), transparent 24%);
  pointer-events:none;
}
.client-row{display:flex;gap:16px;align-items:flex-start;position:relative;z-index:2;}
.client-name{font-family:'Baloo 2';font-weight:700;font-size:20px;}
.trait-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:800;
  padding:3px 10px;border-radius:999px;
  background:var(--peach);color:#b5652f;margin-top:4px;
}
.hair-facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.fact{
  font-size:11px;font-weight:700;color:var(--ink-soft);
  background:#fff;border-radius:999px;padding:3px 9px;box-shadow:var(--shadow-sm);
}

/* speech bubble */
.bubble{
  position:relative;flex:1;
  background:var(--white);
  border-radius:18px;
  padding:14px 16px;
  box-shadow:var(--shadow-sm);
  font-size:15.5px;font-weight:600;line-height:1.4;
  animation:pop .35s ease;
}
.bubble::after{
  content:"";position:absolute;left:-10px;top:26px;
  border:9px solid transparent;border-right-color:var(--white);
}
.req-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.req-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12.5px;font-weight:800;
  padding:5px 11px;border-radius:999px;
  background:linear-gradient(135deg,var(--mint),var(--sky));
  color:#2a6b6b;box-shadow:var(--shadow-sm);
}
.req-tag.keep{background:linear-gradient(135deg,#ffe0ef,#ffd0e2);color:#c04b7e;}

/* action area */
.panel{
  margin-top:16px;position:relative;z-index:2;
  background:rgba(255,255,255,.85);
  border-radius:var(--radius-sm);
  padding:14px;
  box-shadow:var(--shadow-sm);
}
.panel h3{font-size:16px;margin-bottom:4px;color:var(--pink-deep);}
.panel .sub{font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:10px;}

/* ---------- 4. Buttons ---------- */
.btn{
  font-family:'Baloo 2';font-weight:700;font-size:15px;
  border:none;cursor:pointer;
  padding:11px 18px;border-radius:14px;
  background:linear-gradient(135deg,var(--pink),var(--pink-deep));
  color:#fff;box-shadow:0 4px 0 #e0578f, var(--shadow-sm);
  transition:transform .08s ease, box-shadow .08s ease, filter .15s;
  position:relative;
}
.btn:hover{filter:brightness(1.04);}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e0578f, var(--shadow-sm);}
.btn.secondary{background:linear-gradient(135deg,#e9dcff,var(--lilac));color:#5a3f8a;box-shadow:0 4px 0 #a982e6, var(--shadow-sm);}
.btn.secondary:active{box-shadow:0 1px 0 #a982e6, var(--shadow-sm);}
.btn.mint{background:linear-gradient(135deg,var(--mint),#5fd0b0);color:#1f6a56;box-shadow:0 4px 0 #3aa98c, var(--shadow-sm);}
.btn.mint:active{box-shadow:0 1px 0 #3aa98c, var(--shadow-sm);}
.btn.ghost{background:#fff;color:var(--ink-soft);box-shadow:0 4px 0 #e4dae8, var(--shadow-sm);}
.btn.ghost:active{box-shadow:0 1px 0 #e4dae8, var(--shadow-sm);}
.btn.small{font-size:13px;padding:8px 13px;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:grayscale(.3);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

/* price display */
.price-box{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap;}
.price-tag{
  font-family:'Baloo 2';font-weight:800;font-size:30px;color:#3aa76d;
  background:#fff;border-radius:14px;padding:6px 18px;box-shadow:var(--shadow-sm);
  min-width:90px;text-align:center;
}
.stepper{display:flex;align-items:center;gap:8px;}
.stepper button{
  width:38px;height:38px;border-radius:12px;border:none;cursor:pointer;
  font-size:22px;font-weight:800;font-family:'Baloo 2';
  background:#fff;color:var(--pink-deep);box-shadow:var(--shadow-sm);
  transition:transform .08s;
}
.stepper button:active{transform:scale(.9);}

/* ---------- 3. Avatar (SVG) ---------- */
.avatar-wrap{
  width:118px;flex:0 0 118px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.avatar{
  width:110px;height:120px;
  background:linear-gradient(160deg,#fff,#fff0f6);
  border-radius:20px;box-shadow:var(--shadow-sm);
  display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;position:relative;
  animation:bob 3.5s ease-in-out infinite;
}
.avatar svg{width:100%;height:100%;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- 5. Service widgets ---------- */
/* wash steps */
.wash-steps{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.wstep{
  flex:1 1 30%;min-width:92px;
  text-align:center;padding:12px 6px;border-radius:14px;
  background:#fff;box-shadow:var(--shadow-sm);
  font-weight:800;font-size:13px;color:var(--ink-soft);
  border:3px solid transparent;transition:.2s;
}
.wstep .e{font-size:26px;display:block;margin-bottom:4px;}
.wstep.next{border-color:var(--pink);color:var(--pink-deep);animation:pulse 1.2s infinite;}
.wstep.done{background:linear-gradient(135deg,var(--mint),var(--sky));color:#256b6b;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* cut slider */
.cut-area{position:relative;height:64px;margin:14px 0;border-radius:14px;
  background:linear-gradient(90deg,#ffd0d0,#fff3c4 45%,#c9f5d6 55%,#fff3c4);overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.08);}
.cut-target{position:absolute;top:0;bottom:0;width:4px;background:#5a4a5e;left:50%;box-shadow:0 0 0 2px #fff;}
.cut-target::after{content:"🎯";position:absolute;top:-22px;left:-9px;font-size:18px;}
.cut-marker{position:absolute;top:0;bottom:0;width:6px;background:var(--pink-deep);left:0;border-radius:4px;box-shadow:0 0 8px var(--pink-deep);}
.cut-marker::before{content:"✂️";position:absolute;bottom:-24px;left:-10px;font-size:20px;}
.gauge-label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--ink-soft);}

/* dry hold */
.dry-area{margin:14px 0;}
.dry-track{height:26px;border-radius:14px;background:#eee;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.08);position:relative;}
.dry-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--sun),var(--pink),#ff5b5b);transition:width .05s linear;}
.dry-zone{position:absolute;top:0;bottom:0;background:rgba(80,200,140,.35);border-left:2px dashed #2a8a5a;border-right:2px dashed #2a8a5a;}
.dry-hint{font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center;margin-top:8px;min-height:18px;}

/* quality pill */
.quality{display:inline-block;font-family:'Baloo 2';font-weight:800;font-size:14px;padding:4px 14px;border-radius:999px;margin-top:8px;}
.q-Poor{background:#ffd9d9;color:#c0392b;}
.q-OK{background:#fff0c4;color:#b8860b;}
.q-Good{background:#d6f0e0;color:#1f8a5a;}
.q-Perfect{background:linear-gradient(135deg,var(--sun),var(--pink));color:#fff;box-shadow:var(--shadow-sm);}

/* ---------- 6. Satisfaction & summary ---------- */
.sat-main{text-align:center;margin:6px 0 14px;}
.sat-num{font-family:'Baloo 2';font-weight:800;font-size:54px;line-height:1;}
.sat-track{height:20px;border-radius:12px;background:#eee;overflow:hidden;margin-top:8px;box-shadow:inset 0 2px 5px rgba(0,0,0,.08);}
.sat-track > i{display:block;height:100%;border-radius:12px;transition:width 1s cubic-bezier(.2,.8,.2,1);}
.breakdown{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
.bd-row{display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:8px;font-size:13px;font-weight:700;}
.bd-bar{height:12px;border-radius:8px;background:#eee;overflow:hidden;}
.bd-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--pink));border-radius:8px;transition:width .9s cubic-bezier(.2,.8,.2,1);}
.pay-line{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;padding:8px 0;border-top:2px dashed #eadcec;margin-top:4px;}
.pay-line.total{font-size:20px;color:#3aa76d;font-family:'Baloo 2';}
.tip{color:var(--sun);}

/* toast — Phase 8: stacking host holds multiple toast-items without collision */
.toast-host{
  position:fixed;left:50%;top:70px;transform:translateX(-50%);
  z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;
  max-width:92%;pointer-events:none;
}
.toast-item{
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;
  font-weight:700;font-size:14px;box-shadow:var(--shadow);text-align:center;
  opacity:0;transform:translateY(-14px) scale(.96);
  transition:opacity .3s ease, transform .3s cubic-bezier(.2,.9,.3,1.2);
}
.toast-item.show{opacity:1;transform:translateY(0) scale(1);}
.toast-item.event{background:linear-gradient(135deg,#6a4a9a,#a06cd5);}
.toast-item.reward{background:linear-gradient(135deg,#3aa76d,#5fd0b0);}
.toast-item.celebrate{background:linear-gradient(135deg,var(--pink-deep),var(--sun));}

/* counter flash */
.flash{animation:flash .5s ease;}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.25);color:var(--pink-deep)}100%{transform:scale(1)}}

/* ---------- 7. Animations & responsive ---------- */
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideIn{0%{transform:translateX(40px);opacity:0}100%{transform:translateX(0);opacity:1}}
.slide{animation:slideIn .4s ease;}
.fade{animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
.heart{position:absolute;font-size:22px;animation:floatUp 1.6s ease forwards;}
@keyframes floatUp{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-140px) scale(1.2);opacity:0}}

.center{text-align:center;}
.muted{color:var(--ink-soft);font-weight:600;}

/* ---------- 8. Phase 2: tier chip, badges, panels ---------- */
.chip.rating{color:var(--sun);}
.chip .tier-name{font-size:13px;}
.chip.iconbtn{
  cursor:pointer;border:none;font-size:16px;line-height:1;
  min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;
  transition:transform .08s, filter .15s;
}
.chip.iconbtn:hover{filter:brightness(1.05);}
.chip.iconbtn:active{transform:scale(.9);}
.stats{align-items:center;}

.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.trait-tag.cls-vip{background:linear-gradient(135deg,#ffe08a,var(--sun));color:#8a5a00;}
.trait-tag.cls-celeb{background:linear-gradient(135deg,var(--lilac),var(--pink));color:#fff;box-shadow:var(--shadow-sm);}

/* overlay / drawer */
.overlay{
  position:fixed;inset:0;z-index:80;
  background:rgba(90,74,94,.42);backdrop-filter:blur(3px);
  display:none;opacity:0;transition:opacity .25s;
  justify-content:flex-end;
}
.overlay.show{display:flex;opacity:1;}
.drawer{
  width:min(420px,92vw);height:100%;
  background:linear-gradient(160deg,var(--cream),#fff);
  box-shadow:-8px 0 30px rgba(120,90,120,.3);
  padding:18px;overflow-y:auto;
  transform:translateX(30px);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
.overlay.show .drawer{transform:translateX(0);}
.drawer h2{color:var(--pink-deep);font-size:22px;display:flex;align-items:center;gap:8px;}
.drawer .close{
  float:right;border:none;cursor:pointer;background:#fff;border-radius:12px;
  width:40px;height:40px;font-size:18px;box-shadow:var(--shadow-sm);color:var(--ink-soft);
}
.drawer .close:active{transform:scale(.9);}
.fin-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.fin-card{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow-sm);text-align:center;}
.fin-card .lbl{font-size:12px;font-weight:700;color:var(--ink-soft);}
.fin-card .val{font-family:'Baloo 2';font-weight:800;font-size:22px;margin-top:2px;}
.fin-card.rev .val{color:#3aa76d;} .fin-card.exp .val{color:#c0392b;}
.fin-card.bal .val{color:var(--pink-deep);} .fin-card.net .val{color:var(--lilac);}
.txn-list, .rev-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.txn{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:#fff;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm);font-size:13px;font-weight:700;
}
.txn .txn-lbl{color:var(--ink);flex:1;font-weight:600;}
.txn .amt.pos{color:#3aa76d;} .txn .amt.neg{color:#c0392b;}
.txn .txn-ico{font-size:18px;}
.section-title{font-family:'Baloo 2';font-weight:800;color:var(--ink-soft);margin:14px 0 4px;font-size:14px;}

/* reviews */
.rev{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow-sm);display:flex;gap:10px;}
.rev .thumb{width:44px;height:44px;border-radius:12px;flex:0 0 44px;overflow:hidden;background:#fff0f6;}
.rev .thumb svg{width:100%;height:100%;transform:scale(1.15) translateY(4px);}
.rev .rev-body{flex:1;}
.rev .rev-name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;}
.rev .rev-stars{color:var(--sun);font-size:14px;letter-spacing:1px;}
.rev .rev-comment{font-size:13px;font-weight:600;color:var(--ink);margin-top:2px;}
.rev-header{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--sun),var(--pink));color:#fff;border-radius:14px;padding:12px 14px;margin:12px 0;box-shadow:var(--shadow-sm);}
.rev-header .big{font-family:'Baloo 2';font-weight:800;font-size:26px;}
.empty{text-align:center;color:var(--ink-soft);font-weight:600;padding:22px 0;}

/* ---------- 9. Phase 3: equipment ---------- */
.chip.iconbtn.has-broken{position:relative;}
.chip.iconbtn.has-broken::after{
  content:"";position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;
  background:#ff3b3b;box-shadow:0 0 0 2px #fff;animation:pulse 1.1s infinite;
}
.eq-list{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.eq-card{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-sm);border:2px solid transparent;}
.eq-card.unowned{opacity:.9;background:#faf6ff;border-color:#eee;}
.eq-card.broken{border-color:#ff8a8a;background:#fff2f2;}
.eq-head{display:flex;align-items:center;gap:8px;font-weight:800;}
.eq-ico{font-size:22px;display:inline-flex;align-items:center;justify-content:center;}
/* PNG asset icons sized to match the emoji footprint they replace */
.asset-ico{width:1.15em;height:1.15em;object-fit:contain;vertical-align:middle;display:inline-block;}
/* Fix 1: progressive logo loading — emoji shown until the PNG decodes, then swapped */
.asset-slot{display:inline-flex;align-items:center;justify-content:center;}
.asset-pending{display:none;} /* hidden until onload reveals it (emoji shows meanwhile) */
.eq-ico .asset-ico{width:28px;height:28px;}
/* Fix 1: zoomable equipment icon button */
.eq-ico-zoom{border:none;background:none;padding:2px;margin:0;cursor:zoom-in;border-radius:8px;line-height:0;transition:transform .08s;}
.eq-ico-zoom:hover{transform:scale(1.08);}
.eq-ico-zoom:active{transform:scale(.94);}
.eq-ico-zoom::after{content:"🔍";position:absolute;font-size:10px;margin-left:-8px;margin-top:-6px;opacity:.55;}
/* Fix 1: image lightbox (reuses .as-modal centered overlay) */
.lightbox{position:relative;padding:6px;}
.lightbox .close{position:absolute;top:2px;right:2px;}
.lightbox-img{width:100%;max-width:460px;max-height:70vh;object-fit:contain;border-radius:16px;display:block;margin:6px auto 0;background:#fff6ee;}
.lightbox-label{margin-top:10px;font-family:'Baloo 2';font-weight:800;font-size:17px;color:var(--pink-deep);}
.eq-name{flex:1;font-size:15px;}
.eq-tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
.eq-tag.owned{background:linear-gradient(135deg,var(--mint),var(--sky));color:#256b6b;}
.eq-tag.unowned{background:#eee;color:#8a7a90;}
.eq-tag.broken{background:#ffd9d9;color:#c0392b;}
.eq-tag.soon{background:#efe4ff;color:#7a5aab;}
.eq-stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:12px;font-weight:700;color:var(--ink-soft);}
.eq-stats span{background:#f7f2fb;border-radius:8px;padding:3px 8px;}
.eq-cond{display:flex;align-items:center;gap:8px;margin:6px 0 10px;}
.eq-cond-track{flex:1;height:12px;border-radius:8px;background:#eee;overflow:hidden;}
.eq-cond-track > i{display:block;height:100%;border-radius:8px;transition:width .5s;}
.eq-cond-lbl{font-size:12px;font-weight:800;color:var(--ink-soft);min-width:38px;text-align:right;}
.eq-actions{display:flex;flex-wrap:wrap;gap:8px;}

/* blocked service button + warning during service */
.btn.equip-blocked{background:#ffe0e0;color:#c0392b;box-shadow:0 4px 0 #e8b0b0, var(--shadow-sm);}
.btn.equip-blocked:active{box-shadow:0 1px 0 #e8b0b0, var(--shadow-sm);}
.equip-warn{background:#fff2f2;border:2px solid #ffc9c9;color:#c0392b;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin:10px 0;}

/* breakage modal (reuses overlay; drawer becomes centered card) */
.overlay.modal-center{justify-content:center;align-items:center;}
.overlay .drawer.as-modal{
  width:min(440px,94vw);height:auto;max-height:90vh;margin:auto;border-radius:24px;
  transform:none;align-self:center;box-shadow:var(--shadow);
}
.break-modal{text-align:center;padding:6px 4px;}
.break-ico{font-size:52px;animation:shake .5s ease;}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.break-modal h2{margin:6px 0;font-size:24px;}
.break-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.break-actions .btn{width:100%;}

/* ---------- 10. Phase 4: new-service UI ---------- */
/* category tabs */
.cat-tabs{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap;}
.cat-tab{
  border:none;cursor:pointer;font-family:'Baloo 2';font-weight:700;font-size:14px;
  padding:9px 16px;border-radius:999px;background:#fff;color:var(--ink-soft);
  box-shadow:var(--shadow-sm);transition:transform .08s,background .15s,color .15s;min-height:42px;
}
.cat-tab.active{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;}
.cat-tab:active{transform:scale(.95);}

.stock-badge{white-space:nowrap;}

/* pick grids (bangs, style, accessory, treatment) */
.pick-prompt{font-weight:700;font-size:14.5px;margin:6px 0 10px;color:var(--ink);}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:10px;}
.pick-card{
  border:none;cursor:pointer;background:#fff;border-radius:16px;padding:16px 8px;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:6px;
  font-weight:800;font-size:13px;color:var(--ink);transition:transform .08s,box-shadow .12s;min-height:76px;
}
.pick-card:hover{box-shadow:0 6px 16px rgba(160,120,160,.28);}
.pick-card:active{transform:scale(.94);}
.pick-e{font-size:26px;}

/* colour swatches */
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;margin-bottom:10px;}
.swatch{
  border:3px solid #fff;cursor:pointer;border-radius:16px;height:64px;
  box-shadow:var(--shadow-sm);position:relative;transition:transform .08s;display:flex;align-items:flex-end;justify-content:center;
}
.swatch:active{transform:scale(.93);}
.swatch span{background:rgba(255,255,255,.85);border-radius:8px;font-size:11px;font-weight:800;color:var(--ink);padding:2px 6px;margin-bottom:6px;}

/* Fix 1: accessory drag-and-drop tray */
.acc-tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0;padding:8px;background:#faf3ff;border-radius:14px;}
.acc-chip{
  width:56px;height:56px;border:none;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);
  font-size:28px;cursor:grab;transition:transform .08s;touch-action:none;
}
.acc-chip:hover{transform:scale(1.08);}
.acc-chip:active{transform:scale(.92);cursor:grabbing;}

/* highlights strands */
.strand-row{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap;}
.strand{
  width:34px;height:80px;border:none;cursor:pointer;border-radius:12px;
  background:linear-gradient(#8a6a4a,#6a4a2a);box-shadow:var(--shadow-sm);transition:transform .08s;
}
.strand:active{transform:scale(.92);}
.strand.hl{background:linear-gradient(#ffe08a,#f2d18b);box-shadow:0 0 0 3px var(--sun),var(--shadow-sm);}

/* balayage drag */
.baly-track{
  position:relative;height:80px;border-radius:16px;overflow:hidden;margin:10px 0;
  background:linear-gradient(#6a4a2a,#4a3320);box-shadow:inset 0 2px 6px rgba(0,0,0,.2);touch-action:none;cursor:ew-resize;
}
.baly-fill{position:absolute;top:0;bottom:0;left:0;width:0%;background:linear-gradient(90deg,#6a4a2a,#f2d18b,#fff3c4);transition:width .05s;}
.baly-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);font-size:13px;pointer-events:none;}

/* color stock card */
.stock-card{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow-sm);}
.stock-line{font-size:13.5px;font-weight:700;margin-bottom:8px;}

/* treatment note on summary */
.treat-note{background:linear-gradient(135deg,#e6f7ec,#d6f0e0);color:#1f6a4a;font-weight:700;font-size:14px;}

/* ---------- 11. Phase 5: rendered hair model canvas ---------- */
.hair-stage{display:flex;justify-content:center;margin:10px 0;}
.hair-canvas{
  width:100%;max-width:340px;height:auto;aspect-ratio:320/360;
  background:radial-gradient(circle at 50% 30%, #fff, #ffeef6 70%, #f3e6ff);
  border-radius:20px;box-shadow:var(--shadow-sm);
  touch-action:none;                 /* prevent scroll/zoom interference while dragging */
  cursor:crosshair;display:block;
}
.cover-meter{display:flex;align-items:center;gap:10px;margin:8px 0;}
.cover-track{flex:1;height:16px;border-radius:10px;background:#eee;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.cover-track > i{display:block;height:100%;width:0%;border-radius:10px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .12s linear;}
.cover-meter span{font-weight:800;font-size:13px;color:var(--ink-soft);min-width:40px;text-align:right;}
.hair-canvas.after-look{cursor:default;max-width:240px;margin:6px auto 0;}

/* ---------- 12. Phase 7: salon levels & employees ---------- */
/* salon scene banner behind the client */
.salon-scene{position:relative;border-radius:16px;overflow:hidden;margin-bottom:10px;box-shadow:inset 0 -2px 8px rgba(0,0,0,.06);}
.salon-scene svg{display:block;}
/* Task 5: PNG scene background — cover-scaled, aspect-constrained, scrim baked in */
.salon-scene.has-photo{
  background-size:cover;
  background-position:center 30%;
  background-repeat:no-repeat;
  aspect-ratio:16/6;                 /* wide banner; scales cleanly across breakpoints */
  min-height:110px;
}
.scene-tag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;color:#5a4a5e;padding:3px 10px;border-radius:999px;box-shadow:var(--shadow-sm);z-index:2;background:rgba(255,255,255,.9);}

/* salon drawer */
.salon-preview{border-radius:16px;padding:8px;position:relative;box-shadow:var(--shadow-sm);}
.salon-preview.has-photo{background-size:cover;background-position:center 35%;background-repeat:no-repeat;aspect-ratio:3/2;min-height:130px;padding:0;}
.salon-badge{position:absolute;bottom:8px;left:10px;font-weight:800;font-size:13px;color:#5a4a5e;background:rgba(255,255,255,.85);padding:3px 10px;border-radius:999px;z-index:2;}
.salon-next{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow-sm);}
.salon-next-head{display:flex;justify-content:space-between;align-items:center;font-size:15px;}
.salon-next-head .cost{color:#3aa76d;font-family:'Baloo 2';font-weight:800;}
.lvl-list{display:flex;flex-direction:column;gap:6px;}
.lvl-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 12px;box-shadow:var(--shadow-sm);font-weight:700;font-size:13px;}
.lvl-row.cur{outline:2px solid var(--pink);}
.lvl-row.done{opacity:.65;}
.lvl-dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;}
.lvl-name{flex:1;}
.lvl-state{font-weight:800;color:var(--ink-soft);}

/* employees */
.emp-list{display:flex;flex-direction:column;gap:10px;}
.emp-card{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow-sm);}
.emp-card.hire{background:#faf6ff;}
.emp-head{display:flex;align-items:center;gap:8px;font-size:15px;}
.emp-ico{font-size:22px;}
.emp-head b{flex:1;}
.emp-wage{color:#c0392b;font-weight:800;font-size:13px;}
.emp-skills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:11px;font-weight:700;color:var(--ink-soft);}
.emp-skills span{background:#f7f2fb;border-radius:8px;padding:2px 7px;}

/* assign-to-employee row on service screen */
.assign-row{background:#f3e9ff;border-radius:12px;padding:10px 12px;margin:8px 0;}
.assign-hint{font-size:12.5px;font-weight:700;color:#6a4a9a;display:block;margin-bottom:8px;}

/* ---------- 13. Phase 8: HUD menu, challenges, events, confetti ---------- */
.menu-btn{font-size:18px;}
.hud-menu{
  position:absolute;top:56px;right:14px;z-index:40;
  background:#fff;border-radius:16px;box-shadow:var(--shadow);
  padding:6px;display:none;flex-direction:column;gap:2px;min-width:200px;
  border:2px solid #fff;
}
.hud-menu.open{display:flex;animation:pop .18s ease;}
.hud-menu-item{
  border:none;background:none;cursor:pointer;text-align:left;
  font-family:'Baloo 2';font-weight:700;font-size:15px;color:var(--ink);
  padding:11px 14px;border-radius:11px;min-height:44px;transition:background .12s;
}
.hud-menu-item:hover{background:#faf3ff;}
.hud-menu-item:active{background:#f0e4fb;}
.hud-menu-item.has-broken{color:#c0392b;}
/* Phase 8b: PNG logo icons inside menu items, sized to match the emoji footprint */
.menu-ico{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;vertical-align:middle;position:relative;}
.menu-ico .asset-ico{width:20px;height:20px;}
/* broken-equipment red dot overlay on the Equipment menu icon (works with PNG too) */
.hud-menu-item.has-broken .menu-ico::after{
  content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;
  background:#ff3b3b;box-shadow:0 0 0 2px #fff;animation:pulse 1.1s infinite;
}
.hud{position:relative;}

/* event badge (e.g. active supply discount) */
.event-badge{
  display:inline-block;background:linear-gradient(135deg,#efe4ff,#d8bcff);color:#5a3f8a;
  font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow-sm);
}

/* challenges drawer */
.chal-tabs{display:flex;gap:8px;margin:10px 0;}
.chal-tab{flex:1;border:none;cursor:pointer;font-family:'Baloo 2';font-weight:700;font-size:13.5px;
  padding:10px;border-radius:12px;background:#fff;color:var(--ink-soft);box-shadow:var(--shadow-sm);min-height:44px;}
.chal-tab.active{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;}
.chal-row{background:#fff;border-radius:14px;padding:11px 13px;box-shadow:var(--shadow-sm);margin-bottom:9px;}
.chal-row.done{background:linear-gradient(135deg,#e6f7ec,#d6f0e0);}
.chal-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px;gap:8px;}
.chal-rew{color:#3aa76d;font-weight:800;font-size:12px;white-space:nowrap;}
.chal-bar{height:10px;border-radius:7px;background:#eee;overflow:hidden;margin:7px 0 3px;}
.chal-bar>i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--lilac),var(--pink));transition:width .5s;}
.chal-prog{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-align:right;}

/* achievements */
.ach-list{display:flex;flex-direction:column;gap:9px;}
.ach-row{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:11px 13px;box-shadow:var(--shadow-sm);opacity:.7;}
.ach-row.got{opacity:1;background:linear-gradient(135deg,#fff6e0,#ffeec4);}
.ach-ico{font-size:24px;flex:0 0 auto;}
.ach-body{flex:1;display:flex;flex-direction:column;}
.ach-body b{font-size:14px;}
.ach-desc{font-size:12px;color:var(--ink-soft);font-weight:600;}
.ach-check{color:#3aa76d;font-weight:800;font-size:18px;}

/* confetti burst */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:120;}
.confetti-bit{position:absolute;top:-6%;animation:confettiFall 2.3s cubic-bezier(.3,.6,.5,1) forwards;}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0);opacity:0;}
  12%{opacity:1;}
  100%{transform:translateY(112vh) rotate(540deg);opacity:.2;}
}

/* ---------- 14. How to Play guide (paged, kid-friendly) ---------- */
.guide-card{text-align:center;padding:8px 6px 6px;position:relative;user-select:none;touch-action:pan-y;}
.guide-card .close{position:absolute;top:2px;right:2px;}
.guide-ico{font-size:64px;line-height:1;margin:14px 0 6px;display:flex;align-items:center;justify-content:center;min-height:76px;animation:pop .3s ease;}
.guide-ico .asset-ico,.guide-ico .asset-slot{width:72px;height:72px;}
.guide-ico .asset-pending{width:72px;height:72px;}
.guide-title{font-size:24px;color:var(--pink-deep);margin:2px 0 8px;}
.guide-text{font-family:'Nunito',sans-serif;font-weight:700;font-size:16px;line-height:1.45;color:var(--ink);
  min-height:66px;max-width:340px;margin:0 auto 6px;}
.guide-dots{display:flex;gap:6px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap;}
.guide-dot{width:8px;height:8px;border-radius:50%;background:#e4dae8;transition:background .2s,transform .2s;}
.guide-dot.on{background:var(--pink-deep);transform:scale(1.3);}
.guide-nav{display:flex;gap:10px;justify-content:space-between;align-items:center;}
.guide-nav .btn{flex:1;min-height:48px;}
.guide-skip-link{display:block;margin:10px auto 2px;border:none;background:none;cursor:pointer;
  font-weight:700;font-size:13px;color:var(--ink-soft);text-decoration:underline;min-height:36px;}

@media(min-width:561px) and (max-width:1024px){
  .emp-skills{font-size:12px;}
  .lvl-row{font-size:14px;padding:11px 14px;}
  /* roomier guide on tablets */
  .guide-ico{font-size:76px;min-height:88px;}
  .guide-title{font-size:27px;}
  .guide-text{font-size:18px;min-height:72px;max-width:400px;}
  .guide-nav .btn{min-height:52px;font-size:17px;}
}

@media(min-width:561px) and (max-width:1024px){
  .hair-canvas{max-width:400px;}   /* larger canvas & tap area on tablets */
  .cover-track{height:20px;}
}
@media(min-width:768px) and (max-width:1024px) and (orientation:landscape){
  .hair-canvas{max-width:360px;}
}

/* ---------- 7b. Responsive: phones ---------- */
@media(max-width:560px){
  .avatar-wrap{width:92px;flex-basis:92px;}
  .avatar{width:88px;height:98px;}
  .bubble{font-size:14.5px;}
  .sat-num{font-size:44px;}
  .bd-row{grid-template-columns:96px 1fr 38px;font-size:12px;}
  .hud .brand span.txt{display:none;}
  .chip .tier-name{display:none;}
  .price-tag{font-size:26px;}
  .stats{gap:6px;}
}

/* ---------- 7c. Responsive: tablets (portrait & landscape) ---------- */
/* Ensure comfortable touch targets and no squeezed layouts on 768–1024px. */
@media(min-width:561px) and (max-width:1024px){
  .app{max-width:860px;}
  .btn{padding:13px 20px;font-size:16px;}      /* bigger touch targets */
  .btn.small{padding:11px 16px;font-size:14px;}
  .stepper button{width:46px;height:46px;font-size:24px;}
  .chip{padding:8px 14px;font-size:15px;}
  .chip.iconbtn{min-width:46px;min-height:46px;font-size:18px;}
  .cut-area{height:74px;}
  .dry-track{height:32px;}
  .wstep{flex-basis:30%;padding:16px 8px;font-size:14px;}
  .drawer{width:min(460px,80vw);}
  /* Phase 4: larger tap targets for new interactions on tablets */
  .cat-tab{padding:11px 20px;font-size:15px;min-height:48px;}
  .pick-card{min-height:92px;font-size:14px;padding:18px 10px;}
  .pick-e{font-size:30px;}
  .swatch{height:74px;}
  .acc-chip{width:64px;height:64px;font-size:32px;}
  .strand{width:40px;height:96px;}
  .baly-track{height:96px;}
  /* Phase 8: roomier menu on tablets */
  .menu-btn{font-size:20px;}
  .hud-menu-item{font-size:16px;padding:13px 16px;min-height:48px;}
  .hud-menu{min-width:230px;}
}
/* Tablet portrait: drawer can be a bit wider, stage roomier */
@media(min-width:600px) and (max-width:900px) and (orientation:portrait){
  .drawer{width:min(70vw,520px);}
  .client-row{gap:20px;}
  .salon-scene.has-photo{aspect-ratio:16/7;}   /* a touch taller on wider portrait */
}
/* Tablet landscape: keep panels as side drawer, avoid squeezing main stage */
@media(min-width:768px) and (max-width:1024px) and (orientation:landscape){
  .drawer{width:min(46vw,460px);}
  .salon-scene.has-photo{aspect-ratio:16/5;}   /* shorter banner so it doesn't dominate */
}
/* Phones: keep the scene banner compact so the client/UI stays prominent */
@media(max-width:560px){
  .salon-scene.has-photo{aspect-ratio:16/7;min-height:96px;}
}

<body>
<div class="app" id="app"></div>
<div class="toast-host" id="toast" aria-live="polite"></div>
<!-- Phase 2: toggleable panels open here as an overlay/drawer -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>
</div>
<script>
/* ============================================================
   GAME LOGIC — Phase 1
   Sections:
     A. State & Persistence
     B. Data pools (names, hair, personalities, services, phrases)
     C. Client generation
     D. Request generation & parsing
     E. Pricing & negotiation
     F. Service actions (wash / cut / dry)
     G. Satisfaction calculation
     H. Payment & fame
     I. UI rendering
     J. Helpers
   EXTENSION POINTS for later phases are marked with // [EXT].
   ============================================================ */

/* ============================================================
   ASSETS — PNG image registry with emoji fallback (visual only)
   Preloads once on init. If an image fails to load, callers fall
   back to the original emoji so nothing breaks or shows a broken
   image. [EXT] add more asset batches (services, scenes…) here.
   ============================================================ */
const ASSETS = {
  'tool-scissors':        'images/phsAssets/tool-scissors.png',
  'tool-scissors-open':   'images/phsAssets/tool-scissors-open.png',
  'tool-hairdryer':       'images/phsAssets/tool-hairdryer.png',
  'tool-brush':           'images/phsAssets/tool-brush.png',
  'equip-shampoo-station':'images/phsAssets/equip-shampoo-station.png',
  'tool-straightener':    'images/phsAssets/tool-straightener.png',
  'tool-curling-iron':    'images/phsAssets/tool-curling-iron.png',
  'equip-salon-chair':    'images/phsAssets/equip-salon-chair.png',
  'equip-washing-station':'images/phsAssets/equip-washing-station.png',
  'tool-sponge':          'images/phsAssets/tool-sponge.png',
  'tool-color-brush':     'images/phsAssets/tool-color-brush.png',
  'tool-hand':            'images/phsAssets/tool-hand.png',
  // Phase 7: salon scene backgrounds, one per salon level (1–8)
  'scene-salon-lvl1':     'images/phsAssets/scene-salon-lvl1.png',
  'scene-salon-lvl2':     'images/phsAssets/scene-salon-lvl2.png',
  'scene-salon-lvl3':     'images/phsAssets/scene-salon-lvl3.png',
  'scene-salon-lvl4':     'images/phsAssets/scene-salon-lvl4.png',
  'scene-salon-lvl5':     'images/phsAssets/scene-salon-lvl5.png',
  'scene-salon-lvl6':     'images/phsAssets/scene-salon-lvl6.png',
  'scene-salon-lvl7':     'images/phsAssets/scene-salon-lvl7.png',
  'scene-salon-lvl8':     'images/phsAssets/scene-salon-lvl8.png',
  // Phase 8b: HUD stat chips, menu items, and Newcomer fame tier logos
  'money-logo':           'images/phsAssets/money-logo.png',
  'clients-logo':         'images/phsAssets/clients-logo.png',
  'finance-logo':         'images/phsAssets/finance-logo.png',
  'reviews-logo':         'images/phsAssets/reviews-logo.png',
  'equipment-logo':       'images/phsAssets/equipment-logo.png',
  'employees-logo':       'images/phsAssets/employees-logo.png',
  'newcomer-logo':        'images/phsAssets/newcomer-logo.png',
  'ploufi-avatar':        'images/phsAssets/ploufi-avatar.png',
  'help-logo':            'images/phsAssets/help-logo.png',   // optional; ❓ emoji fallback if absent
};
// registry: key -> {img:Image, ready:bool, failed:bool}
const _assetReg = {};
// Task 3: known-bad assets are treated as unavailable so callers use the emoji
// fallback. 'tool-color-brush' currently exports as a solid black square.
// Remove a key from here once a proper replacement image is dropped in.
const ASSET_DENYLIST = new Set(['tool-color-brush']);
function preloadAssets(){
  for(const key in ASSETS){
    if(ASSET_DENYLIST.has(key)){ console.warn(`[assets] "${key}" is denylisted (bad art) → using emoji fallback`); continue; }
    const rec = {img:new Image(), ready:false, failed:false};
    rec.img.onload  = ()=>{ rec.ready = true; };
    rec.img.onerror = ()=>{ rec.failed = true; console.warn(`[assets] failed to load "${key}" → ${ASSETS[key]} (falling back to emoji)`); };
    rec.img.src = ASSETS[key];
    _assetReg[key] = rec;
  }
}
// True only when the image is loaded and usable (and not denylisted).
function assetReady(key){ if(ASSET_DENYLIST.has(key)) return false; const r=_assetReg[key]; return !!(r && r.ready && !r.failed); }
function assetImg(key){ const r=_assetReg[key]; return r ? r.img : null; }
// HTML helper: renders the PNG logo with an emoji fallback.
// Fix 1 (load-order): instead of gating on assetReady() at render time — which
// showed emoji on the first paint before images finished loading — we always emit
// a progressive <img> for known, non-denylisted keys. The browser paints it as
// soon as it decodes (near-instant for local/cached files), and an emoji fallback
// span is shown until then / if the image fails (onerror/onload toggle).
function icon(key, fallbackEmoji, cls){
  const fb = fallbackEmoji || '';
  // Denylisted or unknown assets → plain emoji, never an <img>.
  if(!ASSETS[key] || ASSET_DENYLIST.has(key)) return fb;
  const cl = 'asset-ico' + (cls?(' '+cls):'');
  // If already loaded, emit a plain <img> (fast path, no fallback markup needed).
  if(assetReady(key)) return `<img class="${cl}" src="${ASSETS[key]}" alt="" draggable="false">`;
  // Not loaded yet: show the emoji, and swap to the image the instant it loads.
  // The <img> starts hidden; onload reveals it and hides the emoji sibling.
  // onerror leaves the emoji in place (image stays hidden).
  return `<span class="asset-slot">`
    + `<span class="asset-fb">${fb}</span>`
    + `<img class="${cl} asset-pending" src="${ASSETS[key]}" alt="" draggable="false"`
    + ` onload="this.classList.remove('asset-pending');this.previousElementSibling.style.display='none';">`
    + `</span>`;
}
// Canvas helper: draw an asset centered at (x,y) at pixel size `size`, with a
// subtle drop shadow for legibility over hair. Returns true if drawn, false if
// the caller should fall back to emoji text.
function drawAsset(ctx, key, x, y, size){
  if(!assetReady(key)) return false;
  const img=assetImg(key);
  ctx.save();
  ctx.shadowColor='rgba(90,74,94,.45)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
  ctx.drawImage(img, x-size/2, y-size/2, size, size);
  ctx.restore();
  return true;
}

function save(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      balance: state.balance, fame: Math.round(state.fame*10)/10,
      clientsServed: state.clientsServed, satSum: state.satSum, avgSat: state.avgSat,
      revenue: state.revenue, expenses: state.expenses, transactions: state.transactions,
      fameTier: state.fameTier, reviews: state.reviews,
      starSum: state.starSum, reviewCount: state.reviewCount,

      challenges: state.challenges, achievements: state.achievements,
      chalCycleClients: state.chalCycleClients, lifetimeProfit: state.lifetimeProfit,
    }));

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ state.fameTier = tierIndexForFame(state.fame); initEquipment(); initChallenges(); return; }
    const d = JSON.parse(raw);
    Object.assign(state, {
      balance: num(d.balance, START_BALANCE),
      fame: clamp(num(d.fame, START_FAME),0,100),
      clientsServed: num(d.clientsServed,0),
      satSum: num(d.satSum,0),
      avgSat: num(d.avgSat,0),
      // Phase 2 fields — default sensibly if missing (old Phase 1 saves)
      revenue: num(d.revenue, 0),
      expenses: num(d.expenses, 0),
      transactions: Array.isArray(d.transactions) ? d.transactions.slice(0,HISTORY_CAP) : [],
      reviews: Array.isArray(d.reviews) ? d.reviews.slice(0,HISTORY_CAP) : [],
      starSum: num(d.starSum, 0),
      reviewCount: num(d.reviewCount, 0),
      colorStock: num(d.colorStock, 20),   // Phase 4 — default for old saves
      // Phase 7 — default Level 1 / no employees for old saves
      salonLevel: clamp(num(d.salonLevel, 1), 1, 8),
      employees: Array.isArray(d.employees) ? d.employees : [],
    });
    // fameTier is derived so it stays consistent even for old saves
    state.fameTier = num(d.fameTier, tierIndexForFame(state.fame));
    // Phase 3: equipment — default to Basic of used slots if missing (old saves)
    initEquipment(d.equip);
    // Phase 8 — default to nothing completed for old saves
    state.achievements = (d.achievements && typeof d.achievements==='object') ? d.achievements : {};
    state.chalCycleClients = num(d.chalCycleClients, 0);
    state.lifetimeProfit = num(d.lifetimeProfit, state.revenue - state.expenses);
    initChallenges(d.challenges);
  }catch(e){/* ignore corrupt save */ state.fameTier = tierIndexForFame(state.fame); initEquipment(); initChallenges(); }
}
function num(v,f){return typeof v==='number' && !isNaN(v) ? v : f;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// Build/repair the equipment state. Preserves valid saved data, defaults the rest.
function initEquipment(saved){
  const eq = {};
  for(const slot of EQUIP_ORDER){
    const s = saved && saved[slot];
    if(s && s.owned && EQUIP_CATALOG[slot].tiers[s.tier]){
      eq[slot] = {owned:true, tier:s.tier, condition:clamp(num(s.condition,100),0,100), broken:!!s.broken};
    } else if(s && s.owned===false){
      eq[slot] = {owned:false, tier:'basic', condition:100, broken:false};
    } else {
      // no valid saved entry: default owned Basic for starter slots, else unowned
      const owned = STARTER_SLOTS.includes(slot);
      eq[slot] = {owned, tier:'basic', condition:100, broken:false};
    }
  }
  state.equip = eq;
}

function equipDef(slot){ return EQUIP_CATALOG[slot]; }
function equipTierDef(slot){ const e=state.equip[slot]; return EQUIP_CATALOG[slot].tiers[e.tier]; }
function isUsable(slot){ const e=state.equip[slot]; return e && e.owned && !e.broken && e.condition>0; }

// Which slots does a service need, and are they all usable?
function missingEquipFor(serviceKey){
  const req = SERVICES[serviceKey].req || [];
  return req.filter(slot => !isUsable(slot));
}
// Phase 4: a service is blocked if equipment is missing OR (color service) stock is 0.
function blockReasonFor(serviceKey){
  const missing = missingEquipFor(serviceKey);
  if(missing.length) return {kind:'equip', missing};
  if(SERVICES[serviceKey].stock && state.colorStock<=0) return {kind:'stock'};
  return null;
}
function canPerform(serviceKey){ return !blockReasonFor(serviceKey); }

// Primary slot = the first required slot; drives the action's quality/speed feel.
function primarySlot(serviceKey){ return (SERVICES[serviceKey].req||[])[0]; }

/* --- Abstract gameplay modifiers (future-proof for realistic mini-games) --- */
// Speed 1–5 across a service's required, usable slots → time/forgiveness multiplier.
// Returns ~0.7 (fast/pro) to ~1.2 (slow/basic). Lower = faster & more forgiving.
function equipSpeedMod(serviceKey){
  const req = SERVICES[serviceKey].req || [];
  const usable = req.filter(isUsable);
  if(!usable.length) return 1;
  const avg = usable.reduce((s,slot)=>s+EQUIP_CATALOG[slot].tiers[state.equip[slot].tier].speed,0)/usable.length;
  return clamp(1.25 - (avg-2)*0.14, 0.7, 1.25);
}
// Quality 1–5 → additive quality bias in "tier steps" (0..~1.2). Higher = better outcomes.
function equipQualityMod(serviceKey){
  const req = SERVICES[serviceKey].req || [];
  const usable = req.filter(isUsable);
  if(!usable.length) return 0;
  const avg = usable.reduce((s,slot)=>s+EQUIP_CATALOG[slot].tiers[state.equip[slot].tier].quality,0)/usable.length;
  return clamp((avg-2)*0.32, 0, 1.3); // basic(2)=0, pro(5)≈0.96+
}
// Apply the quality bias to a raw quality tier. mod≥~0.5 can bump up a tier.
const QUALITY_TIERS = ['Poor','OK','Good','Perfect'];
function applyQualityMod(rawQuality, mod){
  let idx = QUALITY_TIERS.indexOf(rawQuality);
  if(idx<0) idx=0;
  // fractional bump: accumulate mod, bump when it crosses 0.5 thresholds (max +1 tier here)
  if(mod >= 0.5) idx = Math.min(QUALITY_TIERS.length-1, idx+1);
  return QUALITY_TIERS[idx];
}

/* --- Condition wear & breakage --- */
// Called once per service performed. Wears the primary + required slots.
function wearEquipment(serviceKey){
  const req = SERVICES[serviceKey].req || [];
  let brokeSlot = null;
  for(const slot of req){
    const e = state.equip[slot]; if(!e || !e.owned || e.broken) continue;
    const dur = EQUIP_CATALOG[slot].tiers[e.tier].durability; // 1–5
    // basic wears faster; pro slower. base wear 4–9 scaled by durability.
    const wear = (rint(4,9)) * (6-dur)/3.5;
    e.condition = clamp(e.condition - wear, 0, 100);
    // spontaneous rare failure OR hit zero
    if(e.condition<=0 || Math.random() < SPONTANEOUS_FAIL_CHANCE*(6-dur)/4){
      e.broken = true; e.condition = 0; brokeSlot = brokeSlot || slot;
    }
  }
  return brokeSlot; // slot key that just broke (for modal), or null
}

/* ---------- J. Helpers ---------- */
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function rint(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
const $ = sel => document.querySelector(sel);
// Phase 8: stacking toast queue — multiple notifications stack cleanly instead of
// overwriting each other. Older ones age out; the stack is capped for legibility.
const TOAST_MAX = 4, TOAST_LIFE = 2600;
function toast(msg, cls){
  const host = $('#toast'); if(!host) return;
  const el = document.createElement('div');
  el.className = 'toast-item' + (cls?(' '+cls):'');
  el.textContent = msg;
  host.appendChild(el);
  // cap the number of simultaneous toasts
  while(host.children.length > TOAST_MAX){ host.removeChild(host.firstChild); }
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 320); }, TOAST_LIFE);
}

// Personality pool widens with fame tier (Phase 2).
function personalityPoolForTier(tier){
  if(tier.pool==='normal') return ['Patient','Impatient','Easygoing']; // simpler early clients
  // wide/rich pools include the full personality variety
  return Object.keys(PERSONALITIES);

// Decide client class from current tier probabilities.
function rollClientClass(tier){
  if(tier.celebChance && Math.random() < tier.celebChance) return 'celeb';
  if(tier.vipChance && Math.random() < tier.vipChance) return 'vip';
  return 'normal';
}

function makeClient(){
  const tier = currentTier();
  // Phase 8: an event-triggered influencer overrides normal class rolling for one client.
  const forcedInfluencer = state.pendingInfluencer;
  const cls = forcedInfluencer ? 'influencer' : rollClientClass(tier);
  if(forcedInfluencer) state.pendingInfluencer = false;
  const clsDef = CLIENT_CLASSES[cls];

  const color = pick(HAIR.color);
  const persoPool = personalityPoolForTier(tier);
  // Higher pools lean toward better-paying personalities.
  let persoName;
  if(tier.pool==='rich' && Math.random()<0.5) persoName = pick(['Luxury','Perfectionist','Patient','Easygoing']);
  else persoName = pick(persoPool);
  // VIP/celeb/influencer skew toward Luxury/Perfectionist (stricter, higher pay)
  if(cls!=='normal') persoName = pick(['Luxury','Perfectionist']);

  const name = cls==='influencer' ? pick(INFLUENCER_NAMES) : cls==='celeb' ? pick(CELEB_NAMES) : cls==='vip' ? pick(VIP_NAMES) : pick(NAMES);

  const c = {
    name,
    hair: {
      length: pick(HAIR.length),
      thickness: pick(HAIR.thickness),
      texture: pick(HAIR.texture),
      color,
      condition: pick(HAIR.condition),
      origin: pick(HAIR.origin),
      volume: pick(HAIR.volume),
    },
    personality: persoName,
    perso: PERSONALITIES[persoName],
    cls,                    // 'normal' | 'vip' | 'celeb'
    clsDef,                 // class modifiers
  };
  c.complexity = hairComplexity(c);   // Phase 2 pricing input
  c.request = makeRequest(persoName);  // pass personality for flavoured openers/closers
  c.budget = computeBudget(c);
  return c;
}

// Hair complexity multiplier from length/texture/condition/thickness (Phase 2 pricing).
function hairComplexity(c){
  let m = 1;
  const h = c.hair;
  if(h.length==='long') m += 0.12; else if(h.length==='very long') m += 0.22;
  if(h.texture==='curly') m += 0.12; else if(h.texture==='coily') m += 0.2; else if(h.texture==='wavy') m += 0.06;
  if(h.condition==='damaged') m += 0.15; else if(h.condition==='dry') m += 0.08;
  if(h.thickness==='thick') m += 0.1; else if(h.thickness==='fine') m += 0.03;
  if(h.volume==='voluminous') m += 0.05;
  return m;
}

/* ---------- D. Request generation & parsing ---------- */
// A natural performing order (also the order fragments are joined in the sentence).
const SERVICE_ORDER = ['wash','treatment','color','highlights','balayage','trim','short','long','layers','bangs','straighten','curling','waves','volume','updo','braids','ponytail','bun','blowdry','accessories'];

// Select a compatible set of services, weighted by fame tier for complexity.
function selectServices(){
  const tier = state.fameTier || 0;
  // How many services to request — weighted toward 1–2 early, 2–4 at high fame.
  // Preserves the old fame-scaling concept (was elaborateChance = 0.05 + tier*0.14).
  const r = Math.random();
  const elaborateChance = clamp(0.05 + tier*0.14, 0, 0.6);
  let count;
  if(r < elaborateChance){ count = rint(3,4); }          // elaborate multi-service
  else if(Math.random() < 0.5 + tier*0.05){ count = 2; } // common: pair
  else { count = 1; }                                    // simple single service
  count = clamp(count, 1, 5);

  const picked = new Set();
  // Decide a "primary" backbone: usually a cut, colour, or style anchor.
  const anchors = [];
  if(Math.random()<0.55) anchors.push('cut');
  if(Math.random()<0.45) anchors.push('style');
  if(Math.random()<0.30) anchors.push('colour');
  if(!anchors.length) anchors.push(pick(['cut','style','colour']));
  for(const g of anchors){
    if(picked.size>=count) break;
    picked.add(pick(SERVICE_GROUPS[g]));   // at most 1 from each of these groups
  }
  // Fill the rest from the add-on pool (0–2 sensible extras), avoiding dupes.
  const addons = SERVICE_GROUPS.addon.slice();
  while(picked.size < count && addons.length){
    const a = addons.splice(rint(0,addons.length-1),1)[0];
    picked.add(a);
  }
  // Guarantee at least one service.
  if(!picked.size) picked.add(pick(SERVICE_GROUPS.cut));
  // Return in natural performing order.
  return SERVICE_ORDER.filter(k=>picked.has(k));
}

// Join service fragments into one flowing sentence with varied connectors.
function joinFragments(frags){
  if(frags.length===1) return frags[0];
  if(frags.length===2) return `${frags[0]} ${pick(['and','then','and also'])} ${frags[1]}`;
  // 3+: comma-separate, with a connector before the last item.
  const head = frags.slice(0,-1).join(', ');
  const tail = frags[frags.length-1];
  return `${head}, ${pick(['and','then','and finally'])} ${tail}`;
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// [EXT] fragment/grammar composer — replaces the old fixed-template makeRequest.
// persoName is passed in (the client isn't the global `client` yet at this point).
function makeRequest(persoName){
  const services = selectServices();

  // Resolve a target colour if a colour-group service was picked ({COLOR} subst).
  const hasColour = services.some(k=>['color','highlights','balayage'].includes(k));
  const wantColor = hasColour ? pick(COLOR_SWATCHES).name : null;

  // Build each service's fragment (substituting {COLOR}), in performing order.
  const frags = services.map(k=>{
    let f = pick(REQUEST_FRAGMENTS[k] || [SERVICES[k].label.toLowerCase()]);
    if(wantColor) f = f.replace(/\{COLOR\}/g, wantColor);
    return f;
  });
  let body = joinFragments(frags);

  // Optional personality opener / closer (+ neutral pools) — not always both.
  const perso = persoName;
  const pOpen = perso && REQUEST_OPENERS[perso], pClose = perso && REQUEST_CLOSERS[perso];
  let opener='', closer='';
  const roll = Math.random();
  // ~40% personality opener, ~25% neutral opener, ~35% none
  if(pOpen && roll < 0.40) opener = pick(pOpen);
  else if(roll < 0.65) opener = pick(NEUTRAL_OPENERS);
  const roll2 = Math.random();
  // ~40% personality closer, ~30% neutral closer, ~30% none
  if(pClose && roll2 < 0.40) closer = pick(pClose);
  else if(roll2 < 0.70) closer = pick(NEUTRAL_CLOSERS);

  // Compose: opener + body + closer, tidying capitalisation & spacing so it reads
  // as one natural sentence rather than mashed fragments.
  let text;
  if(opener){
    // If the opener is its own sentence (ends with ! ? .), start the body capitalised;
    // if it's a lead-in clause (e.g. "Today", "Right then,"), keep the body lowercase.
    const openerEndsSentence = /[.!?…]$/.test(opener);
    text = `${opener} ${openerEndsSentence ? capitalize(body) : body}`;
  } else {
    text = capitalize(body);
  }
  if(closer){
    // Personality closers start with a capital (full sentences) → new sentence.
    // Neutral closers are lowercase short tags ("please!") → flow on with a comma.
    if(/^[A-Z]/.test(closer)){
      if(!/[.!?…]$/.test(text)) text += '.';
      text = `${text} ${closer}`;
    } else {
      text = `${text.replace(/[.!?…]+$/,'')}, ${closer}`;
    }
  } else if(!/[.!?…]$/.test(text)){
    text += '.';
  }
  // Occasional emoji flourish if none present (kept light, ~30%).
  if(!/[\u{1F300}-\u{1FAFF}\u2600-\u27BF✨💕💫👑🎈🌸]/u.test(text) && Math.random()<0.3){
    text += ' ' + pick(['✨','💕','💇','🌸']);
  }

  // keepLength: true when nothing drastically shortens the hair (no short/long full
  // cut). Light services (trim/layers/style/colour/etc.) keep the length. Mirrors
  // how the old templates flagged it; drives the "📏 Keep length" tag + eval.
  const keepLength = !services.includes('short') && !services.includes('long');

  // Structured requirements (identical shape to before).
  const reqs = services.map(k => ({key:k, ...SERVICES[k]}));
  const tags = reqs.map(r => `${r.icon} ${r.label}`);
  if(wantColor) tags.push(`🎯 ${wantColor}`);
  if(keepLength) tags.push('📏 Keep length');

  return {
    text, services, keepLength, reqs, tags,
    wantColor,                           // target colour name (or null) — unchanged contract
    wantsTreatment: services.includes('treatment'),
  };
}

/* ---------- E. Pricing & negotiation ---------- */
// Task 2: Professional-tier equipment relevant to the requested services adds a
// modest price uplift. Each distinct Pro item that a service needs contributes
// EQUIP_UPLIFT_PER (+10%), stacked with diminishing returns and capped.
const EQUIP_UPLIFT_PER = 0.10;   // +10% per relevant Professional item
const EQUIP_UPLIFT_CAP = 0.24;   // never more than +24% total from gear
function equipPriceUplift(c){
  // collect the distinct equipment slots the requested services rely on
  const slots = new Set();
  for(const k of c.request.services){ (SERVICES[k].req||[]).forEach(s=>slots.add(s)); }
  // count how many of those are owned at Professional (non-basic) tier
  let proCount = 0;
  slots.forEach(slot=>{
    const e = state.equip && state.equip[slot];
    if(e && e.owned && e.tier && e.tier!=='basic') proCount++;
  });
  if(proCount<=0) return 1;
  // diminishing returns: 1 - (1-per)^n  →  ~+10% for 1, +19% for 2, +27%… then capped
  let uplift = 1 - Math.pow(1 - EQUIP_UPLIFT_PER, proCount);
  uplift = Math.min(uplift, EQUIP_UPLIFT_CAP);
  return 1 + uplift;
}
function suggestPrice(c){
  let sum = c.request.services.reduce((s,k)=>s+SERVICES[k].base, 0);
  // Phase 4: flat add-ons (e.g. accessories) added before multipliers
  sum += c.request.services.reduce((s,k)=>s+(SERVICES[k].priceAdd||0), 0);
  // Phase 2: hair complexity scales the base (long+curly+damaged costs more)
  sum *= (c.complexity || 1);
  // Phase 2: fame tier price multiplier (reputation justifies higher prices)
  sum *= currentTier().priceMult;
  // Task 2: Professional equipment relevant to the service adds a modest uplift
  sum *= equipPriceUplift(c);
  // Phase 2: VIP/celebrity command higher prices
  sum *= (c.clsDef ? c.clsDef.payMult : 1);
  return Math.round(sum);
}
function computeBudget(c){
  // client's max acceptable price
  const fair = suggestPrice(c);
  return Math.round(fair * c.perso.budgetMult * (0.95 + Math.random()*0.35));
}
// Negotiation reaction to a proposed price. Returns {kind:'accept'|'negotiate'|'leave', counter?}
function reactToPrice(c, price){
  const budget = c.budget;
  // Phase 2: higher fame tier gives price-conscious clients less room to haggle.
  const tierEase = 1 - (state.fameTier * 0.12);  // reputation reduces haggling
  const hard = clamp(c.perso.hard * tierEase, 0.05, 1);
  if(price <= budget){
    // may still haggle if hard-negotiator and price notably below budget tolerance
    if(Math.random() < hard*0.4 && price > budget*0.75){
      const counter = Math.max(1, Math.round(price * (0.82 - hard*0.1)));
      return {kind:'negotiate', counter};
    }
    return {kind:'accept'};
  }
  // above budget
  const over = (price - budget)/budget;
  const walkThreshold = 0.35 + (1-hard)*0.25; // tougher clients walk sooner
  if(over > walkThreshold) return {kind:'leave'};
  const counter = Math.round(budget * (0.9 + Math.random()*0.08));
  return {kind:'negotiate', counter};
}
/* ---------- Game session (per-client working data) ---------- */
let client = null;   // current client
let session = null;  // per-client progress

function newSession(c){
  session = {
    agreedPrice: 0,
    startTime: 0,
    elapsed: 0,
    doneServices: [],           // order the player performed things
    qualities: {},              // key -> 'Poor'|'OK'|'Good'|'Perfect'
    negotiations: 0,
    skipped: [],                // Phase 3: services skipped due to missing equipment
    extras: {},                 // Phase 4: per-service extra data (color, style kind…)
    conditionImproved: false,   // Phase 4: treatment improved poor hair this visit
    _hair: null,                // Phase 5: rendered strand hair model (built lazily)
  };
  client = c;
}

const QUALITY_SCORE = {Poor:25, OK:55, Good:80, Perfect:100};

/* ---------- G. Satisfaction calculation ---------- */
function calcSatisfaction(){
  const c = client, s = session, w = c.perso.w;
  // 1. Hair result quality (avg of performed service qualities)
  const qs = c.request.services.map(k => QUALITY_SCORE[s.qualities[k]] ?? 0);
  const resultQ = qs.length ? qs.reduce((a,b)=>a+b,0)/qs.length : 0;

  // 2. Requested style match
  const asked = new Set(c.request.services);
  const done = new Set(s.doneServices);
  let matchHits = 0; asked.forEach(k => { if(done.has(k)) matchHits++; });
  const missing = asked.size - matchHits;
  const extras = [...done].filter(k=>!asked.has(k)).length;
  let matchQ = clamp((matchHits/asked.size)*100 - missing*10 - extras*8, 0, 100);
  // Phase 4: colour accuracy affects style match (near-miss reduces, wrong reduces more).
  if(c.request.wantColor){
    const colorSvc = ['color','balayage','highlights'].find(k => s.extras && s.extras[k] && s.extras[k].color);
    const chosen = colorSvc ? s.extras[colorSvc].color : null;
    if(chosen){
      if(chosen===c.request.wantColor){ /* perfect, no penalty */ }
      else if((COLOR_NEIGHBORS[c.request.wantColor]||[]).includes(chosen)) matchQ -= 15; // near-miss
      else matchQ -= 35;                                                                  // wrong colour
    }
    matchQ = clamp(matchQ,0,100);
  }

  // 3. Price fairness (relative to budget)
  const ratio = s.agreedPrice / c.budget;
  let priceQ = ratio <= 1 ? 100 - (1-ratio)*10 : 100 - (ratio-1)*160;
  priceQ = clamp(priceQ,0,100);

  // 4. Waiting time (target ~6s per service)
  const target = c.request.services.length * 6;
  const over = Math.max(0, s.elapsed - target);
  let waitQ = clamp(100 - over*5, 0, 100);

  // 5. Treatment order/correctness (wash should precede cut/style)
  let orderQ = 100;
  const idxWash = s.doneServices.indexOf('wash');
  if(idxWash > -1){
    s.doneServices.forEach((k,i)=>{ if(i<idxWash && SERVICES[k].act!=='wash') orderQ -= 22; });
  }
  orderQ = clamp(orderQ,0,100);

  const parts = [
    {key:'result', label:'Hair result',   val:resultQ, weight:w.result},
    {key:'match',  label:'Style match',   val:matchQ,  weight:w.match},
    {key:'price',  label:'Price fairness',val:priceQ,  weight:w.price},
    {key:'wait',   label:'Waiting time',  val:waitQ,   weight:w.wait},
    {key:'order',  label:'Order & care',  val:orderQ,  weight:w.order},
  ];
  const totalW = parts.reduce((a,p)=>a+p.weight,0);
  const overall = Math.round(clamp(parts.reduce((a,p)=>a+p.val*p.weight,0)/totalW, 0, 100));
  return {overall, parts};
}

/* ---------- H. Payment, finances & fame (Phase 2) ---------- */
// Record a transaction into the capped history and update running totals.
function addTransaction(type, label, amount){
  // type: 'payment' | 'tip' | 'expense' | 'vip'  (amount signed: + income, - expense)
  state.transactions.unshift({type, label, amount, at:Date.now(), client:state.clientsServed+1});
  if(state.transactions.length > HISTORY_CAP) state.transactions.length = HISTORY_CAP;
  if(amount >= 0) state.revenue += amount; else state.expenses += -amount;
}

// Periodic upkeep: rent + electricity + restock + Phase 7 wages. Called after a client is resolved.
function maybeUpkeep(){
  if(state.clientsServed>0 && state.clientsServed % UPKEEP_EVERY === 0){
    // Phase 7: bigger salons cost a bit more rent
    const rent = 30 + state.fameTier*10 + (state.salonLevel-1)*8;
    const power = 8 + rint(0,6);
    const restock = 10 + rint(0,10);
    const baseTotal = rent + power + restock;
    state.balance -= baseTotal;
    addTransaction('expense', `Upkeep · rent €${rent}, power €${power}, stock €${restock}`, -baseTotal);

    // Phase 7: employee wages — one line per hired employee, same tick
    let wages = 0;
    for(const emp of state.employees){
      const role = EMPLOYEE_ROLES[emp.role];
      wages += role.wage;
      state.balance -= role.wage;
      addTransaction('expense', `Wages · ${emp.name} (${role.label})`, -role.wage);
    }
    save();
    const total = baseTotal + wages;
    toast(`🧾 Upkeep paid: −€${total}${wages?` (incl. €${wages} wages)`:''}`);
    // Phase 7: graceful negative-balance warning (no game over)
    if(state.balance < 0) toast(`⚠️ Balance is negative (€${state.balance})! Consider firing staff or serving more clients.`);
    return total;
  }
  return 0;
}

// Tier change detection with one-time level-up toast.
function refreshFameTier(prevTier){
  const newTier = tierIndexForFame(state.fame);
  if(newTier !== state.fameTier){
    state.fameTier = newTier;
    if(newTier > (prevTier ?? newTier)){
      const t = FAME_TIERS[newTier];
      toast(`${t.icon} New fame tier — you're now ${t.name}!`, 'celebrate');
      confettiBurst();   // Phase 8: celebratory burst on tier-up
    }
  }
}

function applyOutcome(sat){
  const prevTier = state.fameTier;
  const clsDef = client.clsDef || CLIENT_CLASSES.normal;

  // Phase 8: active-event modifiers for this client (consumed below)
  const festivalTipMult = state.festivalClients>0 ? 1.25 : 1;   // festival = better tips
  const weatherPayMult  = state.weatherClients>0  ? 0.85 : 1;   // bad weather = smaller payout

  // tip scales with satisfaction, personality generosity, and client class
  let tip = 0;
  if(sat.overall >= 80){
    tip = Math.round(session.agreedPrice * (0.05 + (sat.overall-80)/100*0.25) * client.perso.tip * clsDef.tipMult * festivalTipMult);
  }
  const pay = Math.round(session.agreedPrice * weatherPayMult);
  state.balance += pay + tip;

  // finances / transaction log
  const payType = (client.cls==='celeb'||client.cls==='vip'||client.cls==='influencer') ? 'vip' : 'payment';
  addTransaction(payType, `${client.name}${clsDef.badge?' ('+clsDef.badge+')':''} · service`, pay);
  if(tip>0) addTransaction('tip', `${client.name} · tip 💝`, tip);
  // [EXT] special-service / VIP add-on revenue hook:
  //   addTransaction('vip', `${client.name} · special service`, amount);

  // fame swing scales with satisfaction AND tier stakes (higher tier = bigger swings)
  const scale = currentTier().fameScale;
  let fameDelta = (sat.overall - 55)/8 * scale;
  // Phase 8: influencer clients swing fame harder (both directions)
  if(clsDef.fameBoost) fameDelta *= clsDef.fameBoost;
  // Phase 7: salon level perk adds a small passive fame trickle on good visits
  const perk = salonPerk();
  if(perk.fameRate && sat.overall>=55) fameDelta += Math.max(0, perk.fameRate/2);
  // Task 4: gentle fame decay when a visit isn't a standout (only at higher tiers).
  if(sat.overall < FAME_DECAY_SAT_THRESHOLD && state.fameTier >= FAME_DECAY_MIN_TIER){
    fameDelta -= FAME_DECAY_PER_IDLE * state.fameTier;
  }
  const fameBefore = state.fame;
  // keep fame fractional internally so sub-point decay accumulates over time
  state.fame = clamp(state.fame + fameDelta, 0, 100);
  const fameDeltaShown = Math.round(state.fame - fameBefore);   // integer for the summary

  // stats
  state.clientsServed++;
  state.satSum += sat.overall;
  state.avgSat = Math.round(state.satSum/state.clientsServed);
  state.lifetimeProfit = state.revenue - state.expenses;   // Phase 8 milestone tracking

  // Phase 8: consume one client from any active weather/festival stretch
  if(state.weatherClients>0){ state.weatherClients--; if(state.weatherClients===0) toast('🌤️ The weather cleared up.'); }
  if(state.festivalClients>0){ state.festivalClients--; if(state.festivalClients===0) toast('🎉 The festival wrapped up.'); }

  // review generated from what actually happened
  const review = makeReview(client, sat);
  pushReview(review);

  refreshFameTier(prevTier);
  const upkeep = maybeUpkeep();
  // Phase 8: challenge / achievement progress from this served client
  trackChallenges({served:1, earned: pay+tip, stars: review.stars, sat: sat.overall});
  checkAchievements();
  save();
  return {tip, earned: pay + tip, fameDelta: fameDeltaShown, review, upkeep};
}

function applyLeave(){
  const prevTier = state.fameTier;
  // fame penalty scales a little with tier stakes
  const pen = 3 + Math.round(state.fameTier*0.8);
  state.fame = clamp(state.fame - pen, 0, 100);
  // a walkout still leaves a grumpy review sometimes
  if(Math.random() < 0.6){
    pushReview({name:client.name, color:client.hair.color.hex, cls:client.cls,
      stars:1, comment: pick(["Left without service — too pricey for me.","Couldn't agree on a price. Shame.","Didn't work out this time."])});
  }
  refreshFameTier(prevTier);
  save();
  return {pen};
}

/* ---------- Phase 2: Reviews ---------- */
function starsFromSat(overall){
  if(overall>=90) return 5;
  if(overall>=72) return 4;
  if(overall>=52) return 3;
  if(overall>=32) return 2;
  return 1;
}
function makeReview(c, sat){
  const stars = starsFromSat(sat.overall);
  let comment;
  if(Math.random() < 0.12){                    // occasional quirky review
    comment = pick(REVIEW_QUIRKY);
  } else if(stars >= 4){
    comment = pick(REVIEW_POSITIVE);
  } else {
    // find the weakest factor and comment on it
    const low = sat.parts.slice().sort((a,b)=>a.val-b.val)[0];
    const pool = REVIEW_BY_LOW[low.key] || REVIEW_POSITIVE;
    comment = pick(pool);
  }
  // Phase 4: treatment-improvement flavor when poor hair got nourished
  if(session && session.conditionImproved && stars>=3){
    comment += " My hair feels so much healthier now! 🌿";
  }
  // celebrity / influencer flourish (Phase 8: influencer posts to followers too)
  if(c.cls==='celeb'||c.cls==='influencer') comment += stars>=4 ? " (posted to my followers! 📸)" : " …and my followers heard about it. 😬";
  return {name:c.name, color:c.hair.color.hex, cls:c.cls, stars, comment, at:Date.now()};
}
function pushReview(r){
  r.at = r.at || Date.now();
  state.reviews.unshift(r);
  if(state.reviews.length > HISTORY_CAP) state.reviews.length = HISTORY_CAP;
  state.starSum += r.stars;
  state.reviewCount++;
}
function avgStars(){
  return state.reviewCount ? (state.starSum/state.reviewCount) : 0;
}

// Phase 4: buy color product (expense transaction).
function restockColor(n, basePrice){
  const price = repairPrice(basePrice);   // event discount applies to restocks too
  if(state.balance < price) return;
  state.balance -= price;
  state.colorStock += n;
  addTransaction('expense', `🎨 Colour product · +${n}`, -price);
  consumeDiscount();
  toast(`🎨 Restocked +${n} colour product!`);
  save();
  if($('#overlay').classList.contains('show') && $('#drawer').querySelector('.eq-list')) openEquipment();
  syncHUDBalance();
  const sv=$('#stockVal'); if(sv) sv.textContent=state.colorStock;
}

// Phase 7: salon perk discount on equipment purchases/upgrades.
// Phase 8: an active supply-discount event stacks a further reduction (display + charge).
function equipPrice(base){
  const perkD = salonPerk().equipDiscount||0;
  const evtD  = (state.discountUses>0) ? EVENT_DISCOUNT_RATE : 0;
  return Math.round(base*(1-perkD)*(1-evtD));
}
// Repair price with the same event discount applied.
function repairPrice(base){ const evtD=(state.discountUses>0)?EVENT_DISCOUNT_RATE:0; return Math.round(base*(1-evtD)); }
// Consume one event-discount use after a discounted purchase (if the event is active).
function consumeDiscount(){ if(state.discountUses>0){ state.discountUses--; if(state.discountUses===0) toast('📦 Supply discount used up.'); } }

/* ---------- Phase 7: Salon drawer ---------- */
function perkNote(perk){
  if(!perk) return 'No extra perk';
  const bits=[];
  if(perk.fameRate) bits.push(`+${perk.fameRate} passive fame`);
  if(perk.equipDiscount) bits.push(`${Math.round(perk.equipDiscount*100)}% off equipment`);
  if(perk.clientRate) bits.push(`faster clients`);
  if(perk.vipRoom) bits.push(`VIP room ✨`);
  return bits.length?bits.join(' · '):'Cosmetic upgrade';
}

  const next=nextSalon(); if(!next || state.balance<next.cost) return;

  checkAchievements();             // may unlock the Salon Level 8 milestone

let _guidePage = 0;
function openGuide(){
  _guidePage = 0;
  renderGuide();
}
function renderGuide(){
  const ov=$('#overlay'), dr=$('#drawer');
  const p = GUIDE_PAGES[_guidePage];
  const n = GUIDE_PAGES.length;
  const dots = GUIDE_PAGES.map((_,i)=>`<span class="guide-dot ${i===_guidePage?'on':''}"></span>`).join('');
  dr.classList.add('as-modal'); ov.classList.add('modal-center');
  dr.innerHTML = `
    <div class="guide-card">
      <button class="close" id="guideSkip" aria-label="Skip">✕</button>
      <div class="guide-ico">${p.ico()}</div>
      <h2 class="guide-title">${p.title}</h2>
      <p class="guide-text">${p.text}</p>
      <div class="guide-dots">${dots}</div>
      <div class="guide-nav">
        <button class="btn ghost" id="guideBack" ${_guidePage===0?'style="visibility:hidden"':''}>‹ Back</button>
        ${p.last
          ? `<button class="btn mint" id="guideDone">Got it! Let's play 💇</button>`
          : `<button class="btn" id="guideNext">Next ›</button>`}
      </div>
      ${p.last ? '' : `<button class="guide-skip-link" id="guideSkip2">Skip</button>`}
    </div>`;
  ov.classList.add('show'); ov.setAttribute('aria-hidden','false');

  const finish=()=>{ dr.classList.remove('as-modal'); ov.classList.remove('modal-center'); closeDrawer(); };
  const go=(d)=>{ _guidePage=clamp(_guidePage+d,0,n-1); renderGuide(); };
  $('#guideSkip').onclick=finish;
  if($('#guideSkip2')) $('#guideSkip2').onclick=finish;
  if($('#guideBack')) $('#guideBack').onclick=()=>go(-1);
  if($('#guideNext')) $('#guideNext').onclick=()=>go(1);
  if($('#guideDone')) $('#guideDone').onclick=finish;
  // close on backdrop tap (consistent with other drawers)
  ov.onclick=(e)=>{ if(e.target===ov) finish(); };

  // Swipe left/right on touch (and mouse drag) to change pages.
  const card=dr.querySelector('.guide-card');
  let sx=null;
  const start=(x)=>{ sx=x; };
  const end=(x)=>{ if(sx==null) return; const dx=x-sx; sx=null;
    if(Math.abs(dx)>45){ go(dx<0?1:-1); } };
  card.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});
  card.addEventListener('touchend',  e=>end((e.changedTouches[0]||{}).clientX ?? sx));
  card.addEventListener('mousedown', e=>start(e.clientX));
  card.addEventListener('mouseup',   e=>end(e.clientX));
}

function handleEquipAction(act, slot, tier){
  const def = EQUIP_CATALOG[slot];
  const e = state.equip[slot];
  if(act==='buy' || act==='upgrade'){
    const t = def.tiers[tier]; const price=equipPrice(t.price); if(state.balance < price) return;
    state.balance -= price;
    addTransaction('expense', `${def.icon} ${t.name} · ${act==='buy'?'purchase':'upgrade'}`, -price);
    e.owned=true; e.tier=tier; e.condition=100; e.broken=false;
    consumeDiscount();
    toast(`${def.icon} ${t.name} ready!`);
  } else if(act==='buynew'){
    const t = def.tiers[tier]; const price=equipPrice(t.price); if(state.balance < price) return;
    state.balance -= price;
    addTransaction('expense', `${def.icon} ${t.name} · replacement`, -price);
    e.condition=100; e.broken=false;
    consumeDiscount();
    toast(`${def.icon} New ${t.name}!`);
  } else if(act==='repair'){
    const t = def.tiers[e.tier]; const price=repairPrice(t.repair); if(state.balance < price) return;
    state.balance -= price;
    addTransaction('expense', `${def.icon} ${t.name} · repair`, -price);
    e.condition = e.broken?70:Math.min(100,e.condition+55); // repair restores to a decent level
    e.broken=false;
    consumeDiscount();
    toast(`${def.icon} Repaired! (${Math.round(e.condition)}%)`);
  }
  checkAchievements();   // Phase 8: e.g. "Own all Professional equipment"
  save();
  // refresh the equipment drawer only if it's the one currently open
  if($('#overlay').classList.contains('show') && $('#drawer').querySelector('.eq-list')) openEquipment();
  syncHUDBalance();    // update HUD balance chip if present
}
