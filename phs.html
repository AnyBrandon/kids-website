/* ============================================================
   PHASE 8: RANDOM EVENTS
   Section N. Occasional between-client events with clear toasts and
   simple, visible effects. Frequency is conservative & tunable.
   [EXT] add more event types to EVENTS[] as systems grow.
   ============================================================ */
const EVENT_CHANCE = 0.14;        // ~14% chance to roll an event between clients
const EVENT_DISCOUNT_RATE = 0.20; // 20% off restocks/repairs during a discount event
const EVENT_DISCOUNT_USES = 3;    // discount lasts this many purchases
const EVENT_WEATHER_CLIENTS = 3;  // bad weather affects this many upcoming clients
const EVENT_FESTIVAL_CLIENTS = 3; // festival affects this many upcoming clients
const EVENT_MIN_CLIENTS = 3;      // no events until the player has served a few clients

// Each event: {id, weight, run()} — run() applies the effect and toasts.
const EVENTS = [
  {id:'breakdown', weight:1.0, run(){
    // reuse Phase 3 breakage on a random owned, non-broken, used slot
    const cand = EQUIP_ORDER.filter(s=>{ const e=state.equip[s]; return e&&e.owned&&!e.broken&&EQUIP_CATALOG[s].usedNow; });
    if(!cand.length) return false;
    const slot=pick(cand); const e=state.equip[slot];
    e.broken=true; e.condition=0;
    toast(`💥 Event: your ${EQUIP_CATALOG[slot].label} suddenly broke!`, 'event');
    save();
    return true;
  }},
  {id:'shipment', weight:1.2, run(){
    state.discountUses = EVENT_DISCOUNT_USES;
    toast(`📦 Event: supply shipment! ${Math.round(EVENT_DISCOUNT_RATE*100)}% off your next ${EVENT_DISCOUNT_USES} restocks/repairs.`, 'event');
    save(); return true;
  }},
  {id:'influencer', weight:0.9, run(){
    state.pendingInfluencer = true;
    toast(`📱 Event: a local influencer booked the next slot — big payout & fame on the line!`, 'event');
    save(); return true;
  }},
  {id:'weather', weight:1.0, run(){
    state.weatherClients = EVENT_WEATHER_CLIENTS;
    toast(`🌧️ Event: bad weather — quieter salon & smaller payouts for a few clients.`, 'event');
    save(); return true;
  }},
  {id:'festival', weight:1.0, run(){
    state.festivalClients = EVENT_FESTIVAL_CLIENTS;
    toast(`🎉 Event: local hair festival — livelier salon & better tips for a few clients!`, 'event');
    save(); return true;
  }},
];
// Roll a possible event between clients (called from nextClient before spawning).
function maybeEvent(){
  if(state.clientsServed < EVENT_MIN_CLIENTS) return;
  if(state.pendingInfluencer) return;             // don't stack an influencer roll
  if(Math.random() >= EVENT_CHANCE) return;
  // weighted pick; skip events that can't apply (run returns false → try one more)
  const pool = EVENTS.filter(ev=>{
    if(ev.id==='breakdown' && !EQUIP_ORDER.some(s=>{const e=state.equip[s];return e&&e.owned&&!e.broken;})) return false;
    // Influencer only appears once the salon is Popular (fame tier 2) or higher.
    if(ev.id==='influencer' && state.fameTier < 2) return false;
    return true;
  });
  const total = pool.reduce((a,e)=>a+e.weight,0);
  let r=Math.random()*total;
  for(const ev of pool){ if((r-=ev.weight)<=0){ ev.run(); return; } }
}

/* ============================================================
   PHASE 8: CHALLENGES & ACHIEVEMENTS
   Section O. Session (short) + weekly (long) challenges that reset,
   plus permanent milestone achievements. Modest rewards.
   [EXT] add entries to CHALLENGE_DEFS / ACHIEVEMENT_DEFS to grow.
   ============================================================ */
const CHAL_CYCLE = 8;   // session challenges reset every N clients
const CHAL_WEEK  = 24;  // weekly challenges reset every N clients

// Challenge definitions. metric maps to a counter accumulated in trackChallenges().
// reward: {cash?, fame?} applied on completion.
const CHALLENGE_DEFS = {
  session: [
    {id:'s_serve5',  label:'Serve 5 clients',        metric:'served', goal:5,   reward:{cash:40}},
    {id:'s_earn200', label:'Earn €200 this session', metric:'earned', goal:200, reward:{cash:50}},
    {id:'s_stars3',  label:'Get 3 five-star reviews', metric:'fivestars', goal:3, reward:{fame:2}},
  ],
  weekly: [
    {id:'w_earn1000',label:'Earn €1,000',            metric:'earned', goal:1000, reward:{cash:200}},
    {id:'w_stars8',  label:'Get 8 five-star reviews', metric:'fivestars', goal:8, reward:{cash:150, fame:3}},
    {id:'w_serve20', label:'Serve 20 clients',        metric:'served', goal:20,  reward:{cash:120}},
  ],
};
// Permanent milestones (never reset). check(state) → bool.
const ACHIEVEMENT_DEFS = [
  {id:'a_first_client', icon:'✂️', label:'First Snip',        desc:'Serve your first client',            check:()=>state.clientsServed>=1},
  {id:'a_perfect10',    icon:'🌟', label:'Perfect Stylist',   desc:'Earn 10 five-star reviews',          check:()=>fiveStarCount()>=10},
  {id:'a_profit10k',    icon:'💰', label:'Business Owner',     desc:'€10,000 lifetime profit',            check:()=>state.lifetimeProfit>=10000},
  {id:'a_legendary',    icon:'💫', label:'Household Name',     desc:'Reach Legendary fame',               check:()=>state.fameTier>=4},
  {id:'a_maxsalon',     icon:'🏰', label:'Ploufi Grand',      desc:'Reach Salon Level 8',                check:()=>state.salonLevel>=8},
  {id:'a_allpro',       icon:'🛠️', label:'Top of the Line',    desc:'Own all Professional equipment',     check:()=>allProEquipment()},
  {id:'a_firsthire',    icon:'👥', label:'Team Player',        desc:'Hire your first employee',           check:()=>state.employees.length>=1},
  {id:'a_serve50',      icon:'💇‍♀️', label:'Regulars',          desc:'Serve 50 clients',                   check:()=>state.clientsServed>=50},
  {id:'a_richfame',     icon:'⭐', label:'Five-Star Salon',    desc:'Reach a 4.5★ average over 10 reviews', check:()=>state.reviewCount>=10 && avgStars()>=4.5},
];
function fiveStarCount(){ return state.reviews.filter(r=>r.stars===5).length; }
function allProEquipment(){ return EQUIP_ORDER.every(s=>{ const e=state.equip[s]; return e&&e.owned&&e.tier && e.tier!=='basic'; }); }

// Build a fresh challenge tracking record (progress counters per scope).
function freshCycle(scope){
  const defs = CHALLENGE_DEFS[scope];
  const prog = {}; defs.forEach(d=>prog[d.id]={done:false});
  return { served:0, earned:0, fivestars:0, prog };
}
function initChallenges(saved){
  if(saved && saved.session && saved.weekly){ state.challenges = saved; return; }
  state.challenges = { session: freshCycle('session'), weekly: freshCycle('weekly'), weekClients:0 };
}
// Accumulate metrics from a served client and check for completions.
function trackChallenges(ev){
  const ch = state.challenges; if(!ch) return;
  const add = (cyc)=>{ cyc.served += ev.served||0; cyc.earned += ev.earned||0; if(ev.stars===5) cyc.fivestars += 1; };
  add(ch.session); add(ch.weekly);
  // evaluate completions
  evalCycle('session', ch.session); evalCycle('weekly', ch.weekly);
  // advance reset cycles
  state.chalCycleClients = (state.chalCycleClients||0) + 1;
  ch.weekClients = (ch.weekClients||0) + 1;
  if(state.chalCycleClients >= CHAL_CYCLE){ state.chalCycleClients=0; ch.session=freshCycle('session'); toast('🎯 New session challenges!'); }
  if(ch.weekClients >= CHAL_WEEK){ ch.weekClients=0; ch.weekly=freshCycle('weekly'); toast('🎯 New weekly challenges!'); }
}
function metricValue(cyc, metric){ return metric==='fivestars'?cyc.fivestars : cyc[metric]||0; }
function evalCycle(scope, cyc){
  for(const d of CHALLENGE_DEFS[scope]){
    const p=cyc.prog[d.id]; if(!p || p.done) continue;
    if(metricValue(cyc, d.metric) >= d.goal){ p.done=true; grantReward(d.label, d.reward); }
  }
}
function grantReward(label, reward){
  let bits=[];
  if(reward.cash){ state.balance += reward.cash; addTransaction('payment', `🎯 Challenge reward · ${label}`, reward.cash); bits.push(`+€${reward.cash}`); }
  if(reward.fame){ state.fame = clamp(state.fame + reward.fame, 0, 100); bits.push(`+${reward.fame}★ fame`); }
  toast(`🎯 Challenge complete: ${label}! ${bits.join(', ')}`, 'reward');
  confettiBurst();
}
// Permanent achievements — check all, unlock newly-satisfied ones.
function checkAchievements(){
  for(const a of ACHIEVEMENT_DEFS){
    if(!state.achievements[a.id] && a.check()){
      state.achievements[a.id]=true;
      toast(`🏆 Achievement unlocked: ${a.label}!`, 'celebrate');
      confettiBurst();
    }
  }
}

/* ---------- Flow controller ---------- */
function nextClient(){
  maybeEvent();               // Phase 8: possible between-client event
  const c = makeClient();
  newSession(c);
  screenPricing();
}

  }catch(e){/* storage blocked — just skip the auto-show */}
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
