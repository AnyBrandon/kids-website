<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catch Me If You Can!</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #0d0d0f;
            color: white;
            overflow-x: hidden;
        }

        /* Detective Noir Effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.1);
            /* barely darkens */
            z-index: 0;
        }

        /* ===== EPIC NOIR-NEON TITLE ===== */

        h1 {
            position: relative;
            text-align: center;

            margin: 20px 0 25px 0;
            padding: 10px 0;

            font-weight: 900;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            letter-spacing: 3px;
            text-transform: uppercase;

            color: #e5e5e5;

            /* Soft outer glow */
            text-shadow:
                0 0 8px #222,
                0 0 18px rgba(255, 255, 255, 0.12);

            /* Slow breathing glow animation */
            animation: titleGlow 4.6s ease-in-out infinite;
        }

        /* Cinematic top + bottom light bars */
        h1::before,
        h1::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);

            width: 70%;
            height: 3px;

            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.4),
                    transparent);

            border-radius: 2px;
            animation: barPulse 4s infinite ease-in-out;
        }

        h1::before {
            top: -6px;
        }

        h1::after {
            bottom: -6px;
            animation-delay: 1.8s;
            /* stagger for cinematic effect */
        }

        /* ----- KEYFRAMES ----- */

        @keyframes titleGlow {
            0% {
                text-shadow:
                    0 0 5px #111,
                    0 0 10px rgba(255, 255, 255, 0.15);
            }

            50% {
                text-shadow:
                    0 0 10px #333,
                    0 0 22px rgba(255, 255, 255, 0.25);
            }

            100% {
                text-shadow:
                    0 0 5px #111,
                    0 0 10px rgba(255, 255, 255, 0.15);
            }
        }

        @keyframes barPulse {
            0% {
                opacity: 0.25;
                transform: translateX(-50%) scaleX(0.9);
            }

            50% {
                opacity: 0.55;
                transform: translateX(-50%) scaleX(1.05);
            }

            100% {
                opacity: 0.25;
                transform: translateX(-50%) scaleX(0.9);
            }
        }


        /* CHARACTER GRID */
        #board {
            width: 98%;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            grid-gap: 15px;
            padding-bottom: 30px;
        }

        /* Character Card Size (tablet-optimized) */
        .char-card {
            background: #1a1a1d;
            border: 2px solid #333;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .char-card img {
            width: 100%;
            height: auto;
            max-height: 180px;
            /* optional; adjusts image size for tablets */
            object-fit: contain;
            /* show whole image */
            border-radius: 8px;
            border: 1px solid #444;
        }


        .char-name {
            margin-top: 6px;
            font-size: 0.95em;
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }

        .modal {
            background: #161618;
            border: 2px solid #333;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal button {
            margin-top: 15px;
            padding: 12px 22px;
            background: #222;
            border: 2px solid #555;
            color: white;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }

        .modal button:hover {
            background: #333;
        }

        .rumor-title {
            color: #ff4d4d;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        /* GUESS INPUT */
        input[type="text"] {
            margin-top: 15px;
            padding: 10px;
            width: 90%;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 1em;
        }

        .start-btn-animated {
            position: relative;
            display: block;
            margin: 0 auto 25px auto;
            padding: 16px 40px;
            font-size: 1.3em;
            font-weight: 600;
            letter-spacing: 2px;
            color: #e5e5e5;
            background: #141416;
            border: 2px solid #444;
            border-radius: 12px;
            cursor: pointer;
            overflow: hidden;

            /* Basic glow */
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.05);

            /* Glow pulsing */
            animation: pulseBorder 3s infinite ease-in-out;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .start-btn-animated:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .start-btn-animated:active {
            transform: translateY(1px);
            opacity: 0.9;
        }

        /* ---------- Animated Light Sweep ---------- */

        .start-btn-animated::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(120deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.15) 50%,
                    transparent 100%);
            transform: skewX(-20deg);
            animation: sweep 2.8s infinite;
        }

        /* ---------- Grain “noir flicker” ---------- */

        .start-btn-animated::after {
            content: "";
            position: absolute;
            inset: 0;
            background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGMAAQAABQABDQottAAAAABJRU5ErkJggg==");
            opacity: 0.08;
            animation: grainMove 1.5s steps(3) infinite;
            pointer-events: none;
        }

        /* ---------- Keyframes ---------- */

        @keyframes sweep {
            0% {
                left: -120%;
            }

            40% {
                left: 140%;
            }

            100% {
                left: 140%;
            }
        }

        @keyframes grainMove {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-2px, 1px);
            }

            50% {
                transform: translate(1px, -1px);
            }

            75% {
                transform: translate(-1px, 1px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        @keyframes pulseBorder {
            0% {
                border-color: #444;
            }

            50% {
                border-color: #777;
            }

            100% {
                border-color: #444;
            }
        }

        .timer-circle {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            border-radius: 50%;
            border: 6px solid #333;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            color: #e5e5e5;

            /* spinning outer ring */
            animation: spinRing 2s linear infinite;
        }

        @keyframes spinRing {
            0% {
                box-shadow: 0 0 10px #555 inset, 0 0 8px #555;
            }

            50% {
                box-shadow: 0 0 10px #999 inset, 0 0 12px #999;
            }

            100% {
                box-shadow: 0 0 10px #555 inset, 0 0 8px #555;
            }
        }

        #timerNumber {
            position: relative;
            z-index: 2;
        }

        #finalModal .modal {
            width: 55%;
            max-width: 420px;

            background: #111;
            border: 2px solid #444;
            border-radius: 18px;
            padding: 25px 25px 30px;
            color: #eee;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);

            /* remove scrollbars completely */
            max-height: none;
            overflow: visible;
        }

        #finalModal .modal img {
            width: 100%;
            max-width: 280px;
            /* works well for tablets */
            max-height: 40vh;
            /* prevents vertical cropping */
            height: auto;
            object-fit: contain;
            /* show full image without cropping */
            display: block;
            margin: 15px auto 0;
        }

        /* ----- REVEAL BUTTON (Upgraded) ----- */

        /* ----- REVEAL BUTTON — NEON STYLE ----- */

        #revealHintBtn {
            position: relative;
            transform: scale(0.9);
            padding: 14px 30px;
            font-size: 1em;
            font-weight: 700;
            letter-spacing: 1.2px;

            background: #0c0f14;
            color: #c8faff;
            border: 2px solid #2ddfff;
            border-radius: 12px;

            cursor: pointer;
            overflow: hidden;

            /* Neon outer glow */
            box-shadow:
                0 0 8px #00eaff,
                0 0 16px #00eaff99,
                0 0 24px #00eaff55;

            /* Soft pulsing */
            animation: neonPulse 2.2s infinite ease-in-out;
            transition: transform .25s ease, box-shadow .25s ease;
        }

        #revealHintBtn:hover {
            transform: translateY(-2px);

            /* intensify glow */
            box-shadow:
                0 0 10px #00faff,
                0 0 22px #00faffcc,
                0 0 32px #00faff88,
                0 0 50px #00faff55;
        }

        #revealHintBtn:active {
            transform: translateY(1px);
            opacity: 0.9;
        }

        /* Neon sweep highlight */
        #revealHintBtn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;

            background: linear-gradient(120deg,
                    transparent 0%,
                    rgba(0, 255, 255, 0.25) 50%,
                    transparent 100%);

            transform: skewX(-20deg);
            animation: neonSweep 3s infinite ease-in-out;
        }

        /* Light static shimmer */
        #revealHintBtn::after {
            content: "";
            position: absolute;
            inset: 0;

            background: radial-gradient(circle at 20% 20%, rgba(0, 255, 255, 0.15), transparent 70%);

            opacity: 0.25;
            animation: shimmer 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* ----- KEYFRAMES ----- */

        @keyframes neonPulse {
            0% {
                box-shadow:
                    0 0 6px #00eaff,
                    0 0 14px #00eaffa5,
                    0 0 20px #00eaff55;
            }

            50% {
                box-shadow:
                    0 0 10px #00faff,
                    0 0 26px #00faffd0,
                    0 0 38px #00faff88;
            }

            100% {
                box-shadow:
                    0 0 6px #00eaff,
                    0 0 14px #00eaffa5,
                    0 0 20px #00eaff55;
            }
        }

        @keyframes neonSweep {
            0% {
                left: -120%;
            }

            40% {
                left: 140%;
            }

            100% {
                left: 140%;
            }
        }

        @keyframes shimmer {
            0% {
                opacity: 0.15;
            }

            100% {
                opacity: 0.3;
            }
        }

        #hintText {
            font-weight: bold;
        }

        /* ----- DONE BUTTON — CYBER NOIR STYLE ----- */

        #hintDoneBtn {
            position: relative;
            transform: scale(0.85);
            /* slightly smaller */
            padding: 10px 26px;
            margin-top: 15px;

            font-size: 0.9em;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: #ffe9bf;
            background: #1b150c;
            border: 2px solid #ffb848;
            border-radius: 12px;

            cursor: pointer;
            overflow: hidden;

            /* Glow */
            box-shadow:
                0 0 8px #ffb848,
                0 0 14px #ffb84880,
                0 0 22px #ffb84850;

            /* Pulse */
            animation: donePulse 2.4s infinite ease-in-out;
            transition: transform .25s ease, box-shadow .25s ease;
        }

        #hintDoneBtn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 10px #ffc764,
                0 0 20px #ffc764c0,
                0 0 30px #ffc76480,
                0 0 45px #ffc76440;
        }

        #hintDoneBtn:active {
            transform: translateY(1px);
            opacity: 0.9;
        }

        /* Sweep shine */
        #hintDoneBtn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;

            background: linear-gradient(120deg,
                    transparent 0%,
                    rgba(255, 200, 100, 0.25) 50%,
                    transparent 100%);

            transform: skewX(-20deg);
            animation: doneSweep 2.9s infinite ease-in-out;
        }

        /* Subtle amber shimmer */
        #hintDoneBtn::after {
            content: "";
            position: absolute;
            inset: 0;

            background: radial-gradient(circle at 20% 20%, rgba(255, 200, 100, 0.15), transparent 70%);
            opacity: 0.28;
            animation: doneShimmer 4.2s infinite alternate ease-in-out;

            pointer-events: none;
        }

        /* ---- KEYFRAMES ---- */

        @keyframes donePulse {
            0% {
                box-shadow:
                    0 0 6px #ffb848,
                    0 0 12px #ffb84880;
            }

            50% {
                box-shadow:
                    0 0 12px #ffd18a,
                    0 0 26px #ffd18ac0;
            }

            100% {
                box-shadow:
                    0 0 6px #ffb848,
                    0 0 12px #ffb84880;
            }
        }

        @keyframes doneSweep {
            0% {
                left: -120%;
            }

            40% {
                left: 140%;
            }

            100% {
                left: 140%;
            }
        }

        @keyframes doneShimmer {
            0% {
                opacity: 0.18;
            }

            100% {
                opacity: 0.33;
            }
        }

        /* ----- GUESS NOW BUTTON — DANGER NEON RED ----- */

        #guessNowBtn {
            position: relative;
            transform: scale(0.9);
            padding: 14px 36px;
            margin-top: 15px;

            font-size: 1em;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;

            color: #ffd3d3;
            background: #1a0d0e;
            border: 2px solid #ff3e3e;
            border-radius: 12px;

            cursor: pointer;
            overflow: hidden;

            /* Neon red glow */
            box-shadow:
                0 0 10px #ff3e3e,
                0 0 20px #ff3e3e88,
                0 0 30px #ff3e3e55;

            /* Pulsing tension effect */
            animation: guessPulse 2s infinite ease-in-out;
            transition: transform .25s ease, box-shadow .25s ease;
        }

        #guessNowBtn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 12px #ff5454,
                0 0 28px #ff5454cc,
                0 0 40px #ff545488,
                0 0 70px #ff545444;
        }

        #guessNowBtn:active {
            transform: translateY(1px);
            opacity: 0.9;
        }

        /* Red sweep highlight */
        #guessNowBtn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -130%;
            width: 90%;
            height: 100%;

            background: linear-gradient(120deg,
                    transparent 0%,
                    rgba(255, 80, 80, 0.35) 50%,
                    transparent 100%);

            transform: skewX(-20deg);
            animation: guessSweep 2.4s infinite ease-in-out;
        }

        /* Sinister red shimmer */
        #guessNowBtn::after {
            content: "";
            position: absolute;
            inset: 0;

            background: radial-gradient(circle at 20% 20%, rgba(255, 60, 60, 0.2), transparent 72%);
            opacity: 0.32;
            animation: guessShimmer 3.6s infinite alternate ease-in-out;

            pointer-events: none;
        }

        /* ----- KEYFRAMES ----- */

        @keyframes guessPulse {
            0% {
                box-shadow:
                    0 0 10px #ff3e3e,
                    0 0 20px #ff3e3e80;
            }

            50% {
                box-shadow:
                    0 0 18px #ff6060,
                    0 0 34px #ff6060c8;
            }

            100% {
                box-shadow:
                    0 0 10px #ff3e3e,
                    0 0 20px #ff3e3e80;
            }
        }

        @keyframes guessSweep {
            0% {
                left: -130%;
            }

            40% {
                left: 150%;
            }

            100% {
                left: 150%;
            }
        }

        @keyframes guessShimmer {
            0% {
                opacity: 0.18;
            }

            100% {
                opacity: 0.33;
            }
        }

        /* ===== IMAGE ZOOM MODAL ===== */

        #imageZoomModal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #imageZoomModal img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 15px;
            box-shadow: 0 0 20px #000;
            object-fit: contain;
        }

        /* close button */
        #closeZoom {
            position: absolute;
            top: 20px;
            right: 35px;
            font-size: 3rem;
            color: white;
            cursor: pointer;
            text-shadow: 0 0 10px black;
            user-select: none;
        }

        /* Make character images clearly clickable */
        .character-card img {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .character-card img:hover {
            transform: scale(1.05);
        }

        /* Rarity Glow Frames */
        .hint-common {
            box-shadow: 0 0 15px #6aff6a, 0 0 30px #4cff4c;
            border: 2px solid #6aff6a !important;
        }

        .hint-uncommon {
            box-shadow: 0 0 15px #66c2ff, 0 0 30px #3399ff;
            border: 2px solid #66c2ff !important;
        }

        .hint-rare {
            box-shadow: 0 0 18px gold, 0 0 40px gold;
            border: 2px solid gold !important;
        }

        .hint-rumor {
            box-shadow: 0 0 18px #ff3b3b, 0 0 45px #ff1a1a;
            border: 2px solid #ff3b3b !important;
        }

        .hint-empty {
            box-shadow: 0 0 15px #cfcfcf, 0 0 35px #bfbfbf;
            border: 2px solid #d6d6d6 !important;
        }

        #mutualHintModal .modal button {
            margin: 10px 8px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Catch Me If You Can!</h1>

    <div id="roundTimer" style="display:none; text-align:center; margin-bottom:20px;">
        <div class="timer-circle">
            <span id="timerNumber">30</span>
        </div>
    </div>


    <button id="startBtn" class="start-btn-animated">Start Game</button>

    <div id="board"></div>

    <!-- MODALS -->
    <div id="hintModal" class="modal-overlay">
        <div class="modal">
            <div id="hintText">Reveal a hint</div>
            <button id="revealHintBtn">Reveal Hint</button>
            <button id="guessNowBtn">Guess Now</button>
            <button id="hintDoneBtn" style="display:none;">Done</button>
        </div>
    </div>

    <div id="shareModal" class="modal-overlay">
        <div class="modal">
            <p>If you both agree, you can trade ONE spoken hint</p>
            <button onclick="closeShareModal()">Okay</button>
        </div>
    </div>

    <div id="mutualHintModal" class="modal-overlay">
        <div class="modal">
            <p>If both players agree, I can share one more hint about the character!</p>
            <button id="agreeExtraHintBtn">Agree</button>
            <button id="disagreeExtraHintBtn">Disagree</button>
        </div>
    </div>


    <div id="guessModal" class="modal-overlay">
        <div class="modal">
            <p id="guessForPlayer"></p>
            <input id="guessInput" type="text" placeholder="Enter character name..." />
            <button onclick="submitGuess()">Done</button>
        </div>
    </div>

    <div id="timerModal" class="modal-overlay">
        <div class="modal">
            <h2>Review Time</h2>
            <p>Study the board before the next hint...</p>
            <h1 id="timerCount" style="font-size:3em; margin-top:10px;">30</h1>
        </div>
    </div>


    <div id="finalModal" class="modal-overlay">
        <div class="modal">
            <h2 id="finalResult"></h2>
            <img id="finalImg" src=""
                style="width:45%; max-height:400px; object-fit:cover; border-radius:8px; margin-top:10px;" />
            <p id="finalName" style="margin-top:10px; font-size:1.3em;"></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="clickSound" src="sounds/click.wav"></audio>
    <audio id="clockSound" src="sounds/clockTimer.wav" loop></audio>
    <audio id="eventSound" src="sounds/event.wav"></audio>
    <audio id="bangSound" src="sounds/bang.mp3"></audio>


    <!-- Image Zoom Modal -->
    <div id="imageZoomModal">
        <span id="closeZoom">&times;</span>
        <img id="zoomedImage" src="">
    </div>

    <script>
        /* -------------------- GLOBAL STATE --------------------  max-height:280px;*/

        let characters = [];
        let targetIndex = null;

        let currentPlayer = 1;
        let hintsGiven = { 1: 0, 2: 0 };
        let usedHints = { 1: [], 2: [] };

        let guesses = { 1: null, 2: null };
        let isGuessingPhase = false;
        let shareModalShown = false;

        /* -------------------- INITIALIZE GAME -------------------- */

        window.onload = () => {
            fetch("catchMeHints.json")
                .then(r => r.json())
                .then(data => {
                    characters = data;
                    setupBoard();
                });

            // Do not start game yet — wait for Start button click
        };

        document.getElementById("startBtn").onclick = () => {
            document.getElementById("clickSound").play();   // 🔊 play sound

            chooseRandomCharacter();
            startNextTurn();

            document.getElementById("startBtn").style.display = "none";
        };



        function setupBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";

            shuffleArray(characters).forEach((char) => {
                const div = document.createElement("div");
                div.className = "char-card";
                div.innerHTML = `
            <img src="images/catchMe/${char.number}.png" />
            <div class="char-name">${char.name}</div>
        `;
                board.appendChild(div);
            });
        }

        function chooseRandomCharacter() {
            targetIndex = Math.floor(Math.random() * characters.length);
        }

        /* -------------------- TURN SYSTEM -------------------- */

        function startNextTurn() {
            if (hintsGiven[1] >= 4 && hintsGiven[2] >= 4) {
                showMutualHintModal();
                return;
            }

            // Only show the share modal once at the 3-3 moment
            if (hintsGiven[1] === 3 && hintsGiven[2] === 3 && !shareModalShown) {
                showShareModal();
                return;
            }

            openHintModal();
        }


        /* -------------------- MODAL CONTROLS -------------------- */

        function openHintModal() {
            const guessBtn = document.getElementById("guessNowBtn");
            const modalBox = document.querySelector("#hintModal .modal");

            // REMOVE ANY PREVIOUS GLOW
            modalBox.classList.remove("hint-common", "hint-uncommon", "hint-rare", "hint-rumor");

            document.getElementById("hintModal").style.display = "flex";
            document.getElementById("hintText").innerText = `Player ${currentPlayer}, tap to reveal your hint`;
            document.getElementById("revealHintBtn").style.display = "inline-block";

            // Show guess button only if player already has received a hint
            if (hintsGiven[currentPlayer] > 0) {
                guessBtn.style.display = "inline-block";
            } else {
                guessBtn.style.display = "none";
            }

            document.getElementById("hintDoneBtn").style.display = "none";
        }


        function showMutualHintModal() {
            document.getElementById("mutualHintModal").style.display = "flex";
        }

        // Player chooses NOT to get an extra hint
        document.getElementById("disagreeExtraHintBtn").onclick = () => {
            document.getElementById("mutualHintModal").style.display = "none";
            beginFinalGuessPhase();
        };

        // Player chooses to receive one more shared hint
        document.getElementById("agreeExtraHintBtn").onclick = () => {
            document.getElementById("mutualHintModal").style.display = "none";
            startExtraSharedHint();
        };

        function startExtraSharedHint() {
            const allHintKeys = [
                "gender",
                "eyeColor",
                "eyeColorNot",
                "clothingColors",
                "hairColor",
                "hairColorNot",
                "hasAccessories",
                "glasses",
                "hat",
                "nameLetter",
                "nameLetterNot",
                "nameLength"
            ];

            // Keys not used by either player
            const unusedKeys = allHintKeys.filter(key =>
                !usedHints[1].includes(key) &&
                !usedHints[2].includes(key)
            );

            // Safety check
            if (unusedKeys.length === 0) {
                alert("No more hints available!");
                beginFinalGuessPhase();
                return;
            }

            // Pick a new hint key
            const newKey = unusedKeys[Math.floor(Math.random() * unusedKeys.length)];

            // Add to BOTH players so it can't be re-used later
            usedHints[1].push(newKey);
            usedHints[2].push(newKey);

            // Generate the shared hint
            const char = characters[targetIndex];
            const r = Math.random();
            let hint;

            // same probability logic you already use
            if (r < 0.10) {
                hint = generateEmptyHint();
            } else if (r < 0.35) {
                hint = generateRumorHint(char, newKey);
            } else {
                hint = generateNormalHint(char, newKey);
            }

            // Show the hint modal
            displayHint(hint);

            // Force modal open
            document.getElementById("hintModal").style.display = "flex";

            // After Done → go to final phase
            document.getElementById("hintDoneBtn").onclick = () => {
                document.getElementById("hintModal").style.display = "none";
                beginFinalGuessPhase();
            };
        }



        document.getElementById("revealHintBtn").onclick = () => {
            // 🔊 Play reveal event sound
            const eventSound = document.getElementById("eventSound");
            eventSound.currentTime = 0;
            eventSound.play();

            const hint = generateHint(currentPlayer);
            displayHint(hint);
        };

        document.getElementById("hintDoneBtn").onclick = () => {
            document.getElementById("hintModal").style.display = "none";

            const p1 = hintsGiven[1];
            const p2 = hintsGiven[2];

            // If both players have now received the hint for this round → show timer
            if (p1 === p2) {
                showTimerThenNextTurn();
                return;
            }

            // Otherwise just move to the next player's hint
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            startNextTurn();
        };


        /* -------------------- HINT GENERATION -------------------- */

        const hintRarity = {
            // Common
            eyeColor: "common",
            eyeColorNot: "common",
            clothingColors: "common",
            hairColorNot: "common",

            // Uncommon
            hairColor: "uncommon",
            hasAccessories: "uncommon",
            glasses: "uncommon",
            hat: "uncommon",

            // Rare
            gender: "rare",
            nameLetter: "rare",
            nameLetterNot: "rare",
            nameLength: "rare"
        };


        function generateHint(player) {
            const char = characters[targetIndex];

            // Prevent repeats for this player
            const possibleHints = [
                "gender",
                "eyeColor",
                "eyeColorNot",
                "clothingColors",
                "hairColor",
                "hairColorNot",
                "hasAccessories",
                "glasses",
                "hat",
                "nameLetter",
                "nameLetterNot",
                "nameLength"
            ].filter(h => !usedHints[player].includes(h));

            const hintKey = possibleHints[Math.floor(Math.random() * possibleHints.length)];
            usedHints[player].push(hintKey);
            hintsGiven[player]++;

            // Decide hint type
            const r = Math.random();
            if (r < 0.10) return generateEmptyHint();
            if (r < 0.35) return generateRumorHint(char, hintKey);
            return generateNormalHint(char, hintKey);
        }

        function generateNormalHint(char, key) {
            switch (key) {
                case "gender":
                    return `The character is a ${char.gender}.`;

                case "eyeColor":
                    return `The character has ${char.eyeColor} eyes.`;

                case "eyeColorNot":
                    return `The character does NOT have ${randomFromArray(char.eyeColorNot)} eyes.`;

                case "clothingColors":
                    return `There is ${randomFromArray(char.clothingColors)} in the character's clothes.`;

                case "hairColor":
                    return `The character has ${char.hairColor} hair.`;

                case "hairColorNot":
                    return `The character does NOT have ${randomFromArray(char.hairColorNot)} hair.`;

                case "hasAccessories":
                    return char.hasAccessories === "yes" ?
                        `The character is wearing accessories.` :
                        `The character is NOT wearing accessories.`;

                case "glasses":
                    return char.glasses === "yes" ?
                        `The character is wearing glasses.` :
                        `The character is NOT wearing glasses.`;

                case "hat":
                    return char.hat === "yes" ?
                        `The character is wearing a hat.` :
                        `The character is NOT wearing a hat.`;

                case "nameLetter":
                    return generateNameLetterHint(char.name);

                case "nameLetterNot":
                    return generateNameLetterNotHint(char.name);

                case "nameLength":
                    return generateNameLengthHint(char.name);

            }
        }

        function generateRumorHint(char, key) {

            // 50/50 true or false
            const isTrue = Math.random() < 0.5;

            // For a TRUE rumor, just produce the normal hint text
            if (isTrue) {
                return { rumor: true, text: generateNormalHint(char, key) };
            }

            // FALSE rumor logic (varies by hint type)
            switch (key) {

                /* ------- EYECOLOR ------- */
                case "eyeColor": {
                    const allColors = ["black", "blue", "green", "brown"];
                    // remove the real one
                    const falseOptions = allColors.filter(c => c !== char.eyeColor);
                    const fakeColor = falseOptions[Math.floor(Math.random() * falseOptions.length)];
                    return { rumor: true, text: `Someone claims the character has ${fakeColor} eyes.` };
                }

                case "eyeColorNot": {
                    // false "not" = choose a color they DO have (incorrectly forbidden)
                    const fakeColor = char.eyeColor;
                    return { rumor: true, text: `Someone claims the character does NOT have ${fakeColor} eyes.` };
                }

                /* ------- HAIR COLOR ------- */
                case "hairColor": {
                    const allColors = ["black", "brown", "blonde"];
                    const falseOptions = allColors.filter(c => c !== char.hairColor);
                    const fakeColor = falseOptions[Math.floor(Math.random() * falseOptions.length)];
                    return { rumor: true, text: `Someone says the character has ${fakeColor} hair.` };
                }

                case "hairColorNot": {
                    const fakeColor = char.hairColor;
                    return { rumor: true, text: `They say the character does NOT have ${fakeColor} hair.` };
                }

                /* ------- CLOTHING COLORS ------- */
                case "clothingColors": {
                    const allColors = ["red", "blue", "green", "brown", "orange", "yellow", "pink", "purple", "white", "black", "beige", "grey"];

                    // pick a false color not in their clothes
                    const falseOptions = allColors.filter(c => !char.clothingColors.includes(c));
                    const fakeColor = falseOptions[Math.floor(Math.random() * falseOptions.length)];

                    return { rumor: true, text: `Rumor says the clothes contain ${fakeColor}.` };
                }

                /* ------- ACCESSORIES ------- */
                case "hasAccessories": {
                    const fake = char.hasAccessories === "yes" ? "not wearing accessories" : "wearing accessories";
                    return { rumor: true, text: `Rumor: the character is ${fake}.` };
                }

                case "glasses": {
                    const fake = char.glasses === "yes" ? "not wearing glasses" : "wearing glasses";
                    return { rumor: true, text: `Someone claims the character is ${fake}.` };
                }

                case "hat": {
                    const fake = char.hat === "yes" ? "not wearing a hat" : "wearing a hat";
                    return { rumor: true, text: `They say the character is ${fake}.` };
                }

                /* ------- GENDER ------- */
                case "gender": {
                    const fake = char.gender === "boy" ? "girl" : "boy";
                    return { rumor: true, text: `They say the character is a ${fake}.` };
                }

                /* ------- NAME LETTER ------- */
                case "nameLetter": {
                    const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");
                    const realLetters = char.name.toLowerCase().split("");

                    // false rumor = letter NOT in the name
                    const falseLetters = alphabet.filter(l => !realLetters.includes(l));
                    const fakeLetter = falseLetters[Math.floor(Math.random() * falseLetters.length)];

                    return { rumor: true, text: `Rumor says their name includes the letter "${fakeLetter}".` };
                }

                /* ------- NAME LETTER NOT ------- */
                case "nameLetterNot": {
                    // false rumor = choose a letter that IS in the name (wrong)
                    const realLetters = char.name.toLowerCase().replace(/[^a-z]/g, "").split("");
                    const fakeLetter = realLetters[Math.floor(Math.random() * realLetters.length)];

                    return { rumor: true, text: `Someone claims the character does NOT have the letter "${fakeLetter}" in their name.` };
                }

                /* ------- NAME LENGTH ------- */
                case "nameLength": {
                    const realLength = char.name.replace(/\s+/g, "").length;

                    // false lengths (from 2 to 10 but not the real one)
                    const possible = [];
                    for (let i = 2; i <= 10; i++) if (i !== realLength) possible.push(i);

                    const fakeLength = possible[Math.floor(Math.random() * possible.length)];

                    return { rumor: true, text: `Rumor says the character's name has ${fakeLength} letters.` };
                }
            }
        }


        // --- NEW HINT: a random letter that is NOT in the character's name ---
        function generateNameLetterNotHint(characterName) {

            const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");
            const lowerName = characterName.toLowerCase();

            // Collect letters not in the name
            const notInName = alphabet.filter(letter => !lowerName.includes(letter));

            // Safety check (should never happen unless name uses all 26 letters)
            if (notInName.length === 0) {
                return "The character's name contains almost every letter!";
            }

            // Pick a random letter that is NOT in the name
            const randomLetter = notInName[Math.floor(Math.random() * notInName.length)];

            return `The character does NOT have the letter "${randomLetter}" in their name.`;
        }

        // --- NEW HINT: name length ---
        function generateNameLengthHint(characterName) {
            // Remove spaces so only letters are counted
            const cleanName = characterName.replace(/\s+/g, "");
            const length = cleanName.length;

            return `The character's name has exactly ${length} letters.`;
        }



        function showTimerThenNextTurn() {
            let timeLeft = 5;
            const timerDiv = document.getElementById("roundTimer");
            const number = document.getElementById("timerNumber");
            const clockSound = document.getElementById("clockSound");

            number.innerText = timeLeft;
            timerDiv.style.display = "block";

            // 🔊 START looping sound
            clockSound.currentTime = 0;
            clockSound.play();

            let interval = setInterval(() => {
                timeLeft--;
                number.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerDiv.style.display = "none";

                    // 🔇 STOP sound
                    clockSound.pause();
                    clockSound.currentTime = 0;

                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    startNextTurn();
                }
            }, 1000);
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }


        function generateEmptyHint() {
            const emptyHints = [
                "Unable to retrieve information.",
                "No intel available this time.",
                "Your informant vanished.",
                "This clue was corrupted."
            ];
            return emptyHints[Math.floor(Math.random() * emptyHints.length)];
        }

        function randomFromArray(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function displayHint(hint) {
            const hintText = document.getElementById("hintText");
            const revealBtn = document.getElementById("revealHintBtn");
            const guessBtn = document.getElementById("guessNowBtn");
            const doneBtn = document.getElementById("hintDoneBtn");
            const modalBox = document.querySelector("#hintModal .modal");

            // Reset buttons
            revealBtn.style.display = "none";
            guessBtn.style.display = "none";
            doneBtn.style.display = "inline-block";

            // Remove old rarity classes
            modalBox.classList.remove("hint-common", "hint-uncommon", "hint-rare", "hint-rumor", "hint-empty");

            // Is it a rumor?
            if (typeof hint === "object" && hint.rumor) {
                hintText.innerHTML = `<div class="rumor-title">RUMOR</div>${hint.text}`;
                modalBox.classList.add("hint-rumor");
                return;
            }

            // --- EMPTY HINT (useless) ---
            const emptyHintsList = [
                "Unable to retrieve information.",
                "No intel available this time.",
                "Your informant vanished.",
                "This clue was corrupted."
            ];

            if (emptyHintsList.includes(hint)) {
                hintText.innerText = hint;
                modalBox.classList.add("hint-empty");
                return;
            }

            // Normal hint: determine rarity
            const lastKey = usedHints[currentPlayer][usedHints[currentPlayer].length - 1];
            const rarity = hintRarity[lastKey];

            if (rarity === "common") modalBox.classList.add("hint-common");
            else if (rarity === "uncommon") modalBox.classList.add("hint-uncommon");
            else if (rarity === "rare") modalBox.classList.add("hint-rare");

            hintText.innerText = hint;
        }


        /* -------------------- SHARE MODAL -------------------- */

        function showShareModal() {
            document.getElementById("shareModal").style.display = "flex";
        }

        function closeShareModal() {
            document.getElementById("shareModal").style.display = "none";
            shareModalShown = true;

            // After closing share modal, start the 30s review timer (so players can inspect the board)
            showTimerThenNextTurn();
        }


        /* -------------------- EARLY GUESS -------------------- */

        document.getElementById("guessNowBtn").onclick = () => {
            const bang = document.getElementById("bangSound");
            bang.currentTime = 0;
            bang.play();

            startGuessModal(currentPlayer, early = true);
        };


        let earlyGuessFlag = false;

        function startGuessModal(player, early = false) {
            earlyGuessFlag = early;
            document.getElementById("guessForPlayer").innerText =
                `Player ${player}, enter your guess:`;

            document.getElementById("guessInput").value = "";
            document.getElementById("hintModal").style.display = "none";
            document.getElementById("guessModal").style.display = "flex";
        }

        function submitGuess() {
            const val = document.getElementById("guessInput").value.trim();
            if (!val) return;

            guesses[currentPlayer] = val;
            document.getElementById("guessModal").style.display = "none";

            if (earlyGuessFlag) {
                checkEarlyWin();
                return;
            }

            // Non-early guess: switch to next or finish
            currentPlayer = currentPlayer === 1 ? 2 : 1;

            if (guesses[1] && guesses[2]) {
                revealFinal();
            } else {
                startGuessModal(currentPlayer);
            }
        }

        function checkEarlyWin() {
            const targetName = characters[targetIndex].name.toLowerCase();
            const guess = guesses[currentPlayer].toLowerCase();

            if (guess === targetName) {
                showFinalInstantWin(currentPlayer);
            } else {
                showFinalInstantWin(currentPlayer === 1 ? 2 : 1);
            }
        }

        /* -------------------- FINAL GUESS PHASE -------------------- */

        function beginFinalGuessPhase() {
            isGuessingPhase = true;
            startGuessModal(1);
        }

        function revealFinal() {
            const targetName = characters[targetIndex].name.toLowerCase();
            const p1Correct = guesses[1].toLowerCase() === targetName;
            const p2Correct = guesses[2].toLowerCase() === targetName;

            if (p1Correct && p2Correct) {
                showFinalResult("It's a tie! Both players guessed correctly.");
            } else if (p1Correct) {
                showFinalResult("Player 1 Wins!");
            } else if (p2Correct) {
                showFinalResult("Player 2 Wins!");
            } else {
                showFinalResult("Nobody got it right!");
            }
        }

        // --- NEW HINT: random letter from the character's name ---
        // --- FIXED: NEW HINT: random letter from the character's name (robust) ---
        function generateNameLetterHint(characterName) {
            // ensure we have a string
            const nameStr = (characterName || "").toString();

            // keep only letters A-Z (remove spaces, punctuation, accents if needed)
            // If you want to allow accented letters, change regex accordingly.
            const cleanName = nameStr.replace(/[^A-Za-z]/g, "");

            // Safety: if there are no letters, return a fallback hint
            if (!cleanName || cleanName.length === 0) {
                return "No reliable letter info is available for this name.";
            }

            // pick a random index & letter safely
            const randomIndex = Math.floor(Math.random() * cleanName.length);
            const randomLetter = cleanName.charAt(randomIndex).toLowerCase();

            return `The character has the letter "${randomLetter}" in their name.`;
        }



        /* -------------------- FINAL REVEAL -------------------- */

        function showFinalInstantWin(winner) {
            showFinalResult(`Player ${winner} wins by early guess!`);
        }

        function showFinalResult(text) {
            const char = characters[targetIndex];

            document.getElementById("finalResult").innerText = text;
            document.getElementById("finalImg").src = `images/catchMe/${characters[targetIndex].number}.png`;
            document.getElementById("finalName").innerText = char.name;

            document.getElementById("finalModal").style.display = "flex";
        }

        // Zoom modal elements
        const zoomModal = document.getElementById("imageZoomModal");
        const zoomImg = document.getElementById("zoomedImage");
        const closeZoom = document.getElementById("closeZoom");

        // Make character images clickable
        // WORKING CLICK-TO-ZOOM (event delegation)
        document.getElementById("board").addEventListener("click", (e) => {
            if (e.target.tagName === "IMG") {
                zoomImg.src = e.target.src;
                zoomModal.style.display = "flex";
            }
        });

        // Close zoom on X click
        closeZoom.addEventListener("click", () => {
            zoomModal.style.display = "none";
        });

        // Close zoom when clicking outside image
        zoomModal.addEventListener("click", (e) => {
            if (e.target === zoomModal) zoomModal.style.display = "none";
        });

    </script>

</body>
