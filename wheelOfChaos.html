<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Chaos</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            /* Background image with gradient overlay */
            background: linear-gradient(to bottom right, rgba(255, 154, 158, 0.1), rgba(250, 208, 196, 0.1)),
                url('images/wheelBackground.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }


        /* Ultra Cool H1 Title */
        h1 {
            font-size: 4em;
            font-family: 'Orbitron', sans-serif;
            /* futuristic/game font */
            font-weight: 900;
            background: linear-gradient(270deg, #ff416c, #ff4b2b, #ffdd57, #33ffdd, #3357ff, #8f33ff);
            background-size: 1200% 1200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientAnimation 8s ease infinite, glowPulse 2s ease-in-out infinite alternate;
            text-align: center;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff416c, 0 0 30px #ff4b2b, 0 0 40px #ffdd57, 0 0 50px #33ffdd;
            margin-top: 20px;
        }

        /* Smooth gradient movement */
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Glowing pulse effect */
        @keyframes glowPulse {
            0% {
                text-shadow: 0 0 10px #fff, 0 0 20px #ff416c, 0 0 30px #ff4b2b, 0 0 40px #ffdd57;
            }

            100% {
                text-shadow: 0 0 20px #fff, 0 0 40px #ff416c, 0 0 60px #ff4b2b, 0 0 80px #ffdd57;
            }
        }


        #setup,
        #game,
        #modalOverlay {
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
        }

        /* Cool Number of Players Label */
        #setup label {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
            margin-right: 15px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        #setup label:hover {
            color: #ffdd57;
            transform: scale(1.1);
        }

        /* Cool Start Game Button */
        #startBtn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
        }

        #startBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
        }

        #startBtn:active {
            transform: translateY(0);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }



        select,
        button {
            padding: 10px 20px;
            font-size: 1.2em;
            margin: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #wheelCanvas {
            width: 100%;
            max-width: 500px;
            height: auto;
            touch-action: manipulation;
            margin-top: 20px;
        }

        #wheelContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            /* space from top if needed */
        }

        #spinBtn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b, #ffdd57);
            font-size: 1.5em;
            /* smaller than before */
            font-weight: bold;
            color: #fff;
            padding: 15px 30px;
            /* slightly smaller */
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6), 0 6px 20px rgba(255, 221, 87, 0.6);
            transition: all 0.3s ease;
            animation: pulseSpin 1.5s infinite alternate;
            margin-top: 30px;
            /* space between wheel and button */
        }

        #spinBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.8), 0 10px 30px rgba(255, 221, 87, 0.8);
        }

        #spinBtn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.5), 0 4px 15px rgba(255, 221, 87, 0.5);
        }

        @keyframes pulseSpin {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.05);
            }
        }



        #modalOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        /* --- COOLER PLAYER CHOICE MODAL --- */
        #modal {
            background: rgba(15, 15, 20, 0.95);
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 65, 108, 0.6), inset 0 0 20px rgba(51, 87, 255, 0.3);
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(15, 15, 20, 0.95), rgba(15, 15, 20, 0.95)),
                linear-gradient(135deg, #ff416c, #ffdd57, #33ffdd, #3357ff);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            animation: floatModal 3s ease-in-out infinite alternate, fadeIn 0.4s ease;
        }

        @keyframes floatModal {
            0% {
                transform: translateY(0px);
            }

            100% {
                transform: translateY(-8px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #modal h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #33ffdd, 0 0 20px #ff416c;
            letter-spacing: 1px;
        }

        #modal button {
            background: linear-gradient(45deg, #ff416c, #ffdd57, #33ffdd);
            background-size: 200% 200%;
            color: #fff;
            border: none;
            font-weight: bold;
            font-size: 1.1em;
            padding: 12px 30px;
            border-radius: 15px;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(255, 221, 87, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-position 0.5s;
            cursor: pointer;
        }

        #modal button:hover {
            background-position: 100% 0%;
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.7), 0 0 25px rgba(51, 255, 221, 0.6);
        }


        #timer {
            font-size: 2em;
            margin-top: 10px;
            color: #e74c3c;
        }

        /* Container for player lives in top-right corner */
        #playerLives {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            /* stack vertically */
            align-items: flex-end;
            gap: 10px;
            /* space between lives */
            z-index: 50;
        }

        /* Individual player life boxes */
        /* Individual player life boxes - cooler version */
        .playerLife {
            background: linear-gradient(135deg, #1a1a1a, #333333);
            /* dark gradient background */
            color: #fff;
            /* white text for readability */
            font-weight: bold;
            font-size: 1.2em;
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(255, 65, 108, 0.5), 0 4px 20px rgba(51, 255, 221, 0.3);
            /* neon-ish glow */
            position: relative;
            overflow: hidden;
            cursor: default;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-shadow: 0 0 5px #ff416c, 0 0 10px #33ffdd;
            /* subtle glow for text */
        }

        /* Hover effect: lift and glow */
        .playerLife:hover {
            transform: translateX(5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 75, 43, 0.8), 0 8px 25px rgba(51, 255, 221, 0.6);
        }

        /* Make hearts pop a bit */
        .playerLife::after {
            content: "❤️";
            /* decorative heart */
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            font-size: 1.4em;
            text-shadow: 0 0 5px #ff0000, 0 0 10px #ff4b2b;
            pointer-events: none;
        }



        @keyframes pulseHeart {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.3);
            }
        }


        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        /* Make modal text white and readable */
        #modal p,
        #modal h3 {
            color: #fff;
            font-size: 1.2em;
            line-height: 1.5em;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* Slightly bigger and bolder for the "Did player succeed?" prompt */
        #modal h3 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px #ff416c, 0 0 20px #33ffdd;
        }

        @keyframes eliminationSlide {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.8);
            }

            20% {
                opacity: 1;
                transform: translateY(0) scale(1.05);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: translateX(-5px) rotate(-1deg);
            }

            70% {
                transform: translateX(5px) rotate(1deg);
            }

            80% {
                transform: translateX(0px) rotate(0deg);
            }

            100% {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }
        }

        @keyframes eliminationGlowPulse {

            0%,
            100% {
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0044;
            }

            50% {
                text-shadow: 0 0 25px #ff4477, 0 0 50px #ff2244;
            }
        }
    </style>

</head>

<body>

    <h1>Wheel of Chaos</h1>

    <div id="eliminationMessage" style="
        display:none;
        font-family: 'Orbitron', sans-serif;
        font-size: 2.5em;
        font-weight: 900;
        color: #ff2b2b;
        text-align: center;
        margin-top: -5px;
        letter-spacing: 2px;
        text-shadow: 
            0 0 10px #ff0000, 
            0 0 20px #ff0033, 
            0 0 40px #ff0055, 
            0 0 60px #ff3377;
        animation: none;
     ">
    </div>

    <div id="setup">
        <label for="numPlayers">Number of Players: </label>
        <select id="numPlayers">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <button id="startBtn">Start Game</button>
    </div>

    <div id="game" style="display:none;">
        <div id="wheelContainer" style="position: relative; width: 100%; max-width: 500px; margin: 0 auto;">
            <canvas id="wheelCanvas"></canvas>
            <button id="spinBtn">SPIN</button>
        </div>
        <div id="playerLives"></div>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <div id="modalOverlay">
        <div id="modal">
            <div id="modalContent"></div>
            <div id="modalButtons"></div>
        </div>
    </div>


    <audio id="spinSound" src="sounds/wheelSpin.mp3" preload="auto"></audio>
    <audio id="modalSound" src="sounds/event.wav" preload="auto"></audio>
    <audio id="successSound" src="sounds/correct.wav" preload="auto"></audio>
    <audio id="failSound" src="sounds/lifeLost.wav" preload="auto"></audio>
    <audio id="clickSound" src="sounds/click.wav" preload="auto"></audio>


    <script>
        const colors = ["#FF5733", "#33FF57", "#3357FF", "#FF33A1", "#FF8F33", "#8F33FF", "#33FFF3", "#FF3333", "#33FF8F", "#FFD433"];
        let players = [];
        let currentPlayerIndex = null;
        let wheelRotation = 0;
        let spinning = false;
        let numPlayers = 0;
        let remainingTasks = [];
        let remainingQuestions = [];

        let questionPickCount = 0;
        // random number between 30–40 for question limit
        let questionLimit = Math.floor(Math.random() * 11) + 30;

        let questionsDisabled = false;

        const wheelCanvas = document.getElementById('wheelCanvas');
        const ctx = wheelCanvas.getContext('2d');

        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];

        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        const modalButtons = document.getElementById('modalButtons');
        const playerLivesDiv = document.getElementById('playerLives');

        function resizeCanvas() {
            wheelCanvas.width = wheelCanvas.offsetWidth;
            wheelCanvas.height = wheelCanvas.offsetWidth;
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            drawWheel();
        }

        window.addEventListener('resize', resizeCanvas);

        document.getElementById('startBtn').addEventListener('click', () => {
            numPlayers = parseInt(document.getElementById('numPlayers').value);
            players = [];
            for (let i = 1; i <= numPlayers; i++) {
                players.push({ name: "Player " + i, lives: 3 });
            }
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            updateLives();
            resizeCanvas();
        });

        document.getElementById('spinBtn').addEventListener('click', () => {
            if (spinning) return;
            spinning = true;
            spinSound.currentTime = 0;  // start from beginning
            spinSound.play().catch(() => { });

            // Stop sound after 3 seconds
            setTimeout(() => {
                spinSound.pause();
            }, 2700);

            let spins = Math.random() * 360 + 720;
            let duration = 3000;
            let start = null;
            let initialRotation = wheelRotation;

            function animate(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let ease = 1 - Math.pow(1 - progress / duration, 3);
                wheelRotation = initialRotation + spins * ease;
                drawWheel();
                if (progress < duration) {
                    requestAnimationFrame(animate);
                } else {
                    wheelRotation %= 360;
                    determineWinner();
                    spinning = false;
                }
            }
            requestAnimationFrame(animate);
        });

        function drawWheel() {
            const cx = wheelCanvas.width / 2;
            const cy = wheelCanvas.height / 2;
            const radius = wheelCanvas.width / 2 - 10;
            ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

            const sliceAngle = 2 * Math.PI / players.length;

            for (let i = 0; i < players.length; i++) {
                // 3D shading for slice
                let grad = ctx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, radius);
                grad.addColorStop(0, colors[i % colors.length]);
                grad.addColorStop(1, shadeColor(colors[i % colors.length], -20));
                ctx.fillStyle = grad;

                function shadeColor(color, percent) {
                    let f = parseInt(color.slice(1), 16),
                        t = percent < 0 ? 0 : 255,
                        p = Math.abs(percent) / 100,
                        R = f >> 16,
                        G = f >> 8 & 0x00FF,
                        B = f & 0x0000FF;
                    return "#" + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 + (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
                }

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, i * sliceAngle + wheelRotation * Math.PI / 180, (i + 1) * sliceAngle + wheelRotation * Math.PI / 180);
                ctx.closePath();
                ctx.fill();

                // ----- Cool Player Labels -----
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(i * sliceAngle + sliceAngle / 2 + wheelRotation * Math.PI / 180);

                // Text settings
                ctx.font = `${radius / 10}px Orbitron, Arial`;
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";

                // Neon gradient
                let gradient = ctx.createLinearGradient(radius - 10, -20, radius - 10, 20);
                gradient.addColorStop(0, "#ff416c");
                gradient.addColorStop(0.5, "#ffdd57");
                gradient.addColorStop(1, "#33ffdd");
                ctx.fillStyle = gradient;

                // Glow and outline
                ctx.shadowColor = "#ffffff";
                ctx.shadowBlur = 10;
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000000"; // subtle outline
                ctx.strokeText(players[i].name, radius - 10, 0);
                ctx.fillText(players[i].name, radius - 10, 0);

                ctx.restore();
            }

            drawArrow();
        }


        function determineWinner() {
            const sliceAngle = 360 / players.length;
            // Calculate which slice the arrow is pointing at
            let arrowAngle = 270; // top of the wheel
            let adjustedRotation = (wheelRotation % 360 + 360) % 360; // ensure 0-360
            let angleUnderArrow = (arrowAngle - adjustedRotation + 360) % 360;
            let index = Math.floor(angleUnderArrow / sliceAngle);
            currentPlayerIndex = index;
            highlightCurrentPlayer();
            showChoiceModal(players[index]);
        }

        function highlightCurrentPlayer() {
            const lifeBoxes = document.querySelectorAll('.playerLife');

            lifeBoxes.forEach((box, i) => {
                if (i === currentPlayerIndex) {
                    // Highlight current player
                    box.style.boxShadow = '0 0 25px 5px gold, 0 0 50px 10px #FFD700';
                    box.style.transform = 'scale(1.1)';
                    box.style.transition = 'all 0.3s ease';
                } else {
                    // Reset others
                    box.style.boxShadow = '0 4px 20px rgba(255, 65, 108, 0.5), 0 4px 20px rgba(51, 255, 221, 0.3)';
                    box.style.transform = 'scale(1)';
                }
            });
        }

        function showEliminationMessage(playerName) {
            const msgDiv = document.getElementById("eliminationMessage");
            msgDiv.textContent = `${playerName} YOU ARE OOOUUUUTTTTT!`;

            msgDiv.style.display = "block";

            // Trigger animations
            msgDiv.style.animation = `
        eliminationSlide 4s ease forwards,
        eliminationGlowPulse 1s ease-in-out infinite
    `;

            // Hide after 5 seconds
            setTimeout(() => {
                msgDiv.style.display = "none";
                msgDiv.style.animation = "none"; // reset
            }, 3000);
        }



        function drawArrow() {
            const cx = wheelCanvas.width / 2;
            const cy = wheelCanvas.height / 2;
            const radius = wheelCanvas.width / 2 - 15;

            ctx.fillStyle = ctx.createLinearGradient(cx, cy - radius - 15, cx, cy - radius + 25);
            ctx.fillStyle.addColorStop(0, '#FFD700'); // bright gold
            ctx.fillStyle.addColorStop(0.5, '#FFEA70'); // shiny highlight
            ctx.fillStyle.addColorStop(1, '#FFA500'); // deeper gold

            ctx.beginPath();
            // Arrow pointing downward, just above the top of the wheel
            ctx.moveTo(cx, cy - radius - 15);     // tip of the arrow (down)
            ctx.lineTo(cx - 15, cy - radius + 25); // left corner
            ctx.lineTo(cx + 15, cy - radius); // right corner
            ctx.closePath();
            ctx.fill();
        }





        function showChoiceModal(player) {
            const modalSound = document.getElementById('modalSound');
            modalSound.currentTime = 0;
            modalSound.play().catch(() => { });

            modalContent.innerHTML = `
        <h2>🎯 ${player.name}, Choose!</h2>
    `;

            // If question limit reached, ONLY show Task button
            if (questionsDisabled) {
                modalButtons.innerHTML = `
            <button onclick="chooseOption('task')">🔥 Task</button>
        `;
            } else {
                modalButtons.innerHTML = `
            <button onclick="chooseOption('task')">🔥 Task</button>
            <button onclick="chooseOption('question')">🧠 Question</button>
        `;
            }

            modalOverlay.style.display = 'flex';
            document.getElementById('spinBtn').style.display = 'none';
        }



        async function chooseOption(option) {

            if (option === 'question') {
                questionPickCount++;
                if (questionPickCount >= questionLimit) {
                    questionsDisabled = true;
                }
            }

            let dataArray;

            if (option === 'task') {
                if (remainingTasks.length === 0) {
                    // Load and shuffle tasks for this game
                    const tasks = await fetch('wheelTasks.json').then(r => r.json());
                    remainingTasks = shuffleArray(tasks);
                }
                dataArray = remainingTasks;
            } else {
                if (remainingQuestions.length === 0) {
                    // Load and shuffle questions for this game
                    const questions = await fetch('wheelQuestions.json').then(r => r.json());
                    remainingQuestions = shuffleArray(questions);
                }
                dataArray = remainingQuestions;
            }

            // Pick the first item (already shuffled)
            const item = dataArray.shift();
            startTimer(item, option);
        }

        function shuffleArray(array) {
            // Fisher-Yates shuffle
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }


        let timerInterval;

        function startTimer(item, option) {
            let time = item.time;
            modalContent.innerHTML = `<p>${option === 'task' ? item.task : item.question}</p><div id="timer">${time}</div>`;
            modalButtons.innerHTML = `<button onclick="doneEarly()">Done</button>`;
            const timerDiv = document.getElementById('timer');

            timerInterval = setInterval(() => {
                time--;
                timerDiv.textContent = time;
                if (time <= 0) {
                    clearInterval(timerInterval);
                    showResultModal();
                }
            }, 1000);
        }

        function doneEarly() {
            // 🎵 Play click sound
            const clickSound = document.getElementById('clickSound');
            clickSound.currentTime = 0;
            clickSound.play().catch(() => { });

            clearInterval(timerInterval);
            showResultModal();
        }


        function showResultModal() {
            modalContent.innerHTML = `<h3>Did ${players[currentPlayerIndex].name} succeed?</h3>`;
            modalButtons.innerHTML = `
    <button onclick="result(true)">Success</button>
    <button onclick="result(false)">Fail</button>
  `;
        }

        function result(success) {
            if (success) {
                const successSound = document.getElementById('successSound');
                successSound.currentTime = 0;
                successSound.play().catch(() => { });
            } else {
                const currentPlayer = players[currentPlayerIndex];
                currentPlayer.lives--;

                if (currentPlayer.lives <= 0) {
                    const gameOverSound = new Audio('sounds/gameOver.wav');
                    gameOverSound.play().catch(() => { });

                    // Show elimination message for 3 seconds
                    showEliminationMessage(currentPlayer.name);

                    // Remove player from array
                    players.splice(currentPlayerIndex, 1);
                }
                else {
                    // Player still alive, play normal lifeLost sound
                    const failSound = document.getElementById('failSound');
                    failSound.currentTime = 0;
                    failSound.play().catch(() => { });
                }
            }

            modalOverlay.style.display = 'none';
            document.getElementById('spinBtn').style.display = 'block'; // show spin button again

            updateLives();

            if (players.length === 1) {
                showWinnerModal(players[0].name);
                return; // stop further execution
            }

        }

        function showWinnerModal(playerName) {
            modalContent.innerHTML = `
        <h2>🏆 ${playerName} wins!</h2>`;
            modalButtons.innerHTML = "";
            modalOverlay.style.display = 'flex';
        }



        function updateLives() {
            playerLivesDiv.innerHTML = '';
            players.forEach(p => {
                let hearts = '❤️'.repeat(p.lives); // repeat heart for current lives
                playerLivesDiv.innerHTML += `<div class="playerLife">${p.name}: ${hearts}</div>`;
            });
        }


        // -------------------- Confetti --------------------
        function startConfetti() {
            confettiParticles = [];
            for (let i = 0; i < 150; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * 150 + 50,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 10,
                    tiltAngleIncrement: Math.random() * 0.07 + 0.05,
                    tiltAngle: 0
                });
            }
            requestAnimationFrame(drawConfetti);
            setTimeout(() => { confettiParticles = []; }, 3000);
        }

        function drawConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            for (let i = 0; i < confettiParticles.length; i++) {
                let p = confettiParticles[i];
                confettiCtx.beginPath();
                confettiCtx.lineWidth = p.r;
                confettiCtx.strokeStyle = p.color;
                confettiCtx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                confettiCtx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                confettiCtx.stroke();
                p.tiltAngle += p.tiltAngleIncrement;
                p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                p.x += Math.sin(p.d);
            }
            if (confettiParticles.length > 0) {
                requestAnimationFrame(drawConfetti);
            }
        }
    </script>
</body>
