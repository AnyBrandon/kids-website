<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GYM PLAYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0c;
    --surface: #111116;
    --surface2: #18181f;
    --surface3: #1f1f28;
    --accent: #e8ff47;
    --accent2: #ff4f6e;
    --accent-dim: rgba(232,255,71,0.12);
    --accent-glow: rgba(232,255,71,0.25);
    --text: #f0f0f0;
    --text-muted: #6a6a7a;
    --text-dim: #3a3a4a;
    --border: rgba(255,255,255,0.06);
    --radius: 16px;
    --radius-sm: 10px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100svh;
    padding: 0;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    width: 100%;
    max-width: 480px;
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }

  .header-logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .header-logo span {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 13px;
    display: block;
    letter-spacing: 0.12em;
    line-height: 1;
    margin-top: 1px;
  }

  .song-count-badge {
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  /* PLAYER SECTION */
  .player-section {
    width: 100%;
    max-width: 480px;
    padding: 20px 20px 0;
  }

  /* ALBUM ART / NOW PLAYING CARD */
  .now-playing-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .now-playing-card::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(232,255,71,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .now-playing-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .now-playing-label::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: blink 1.4s ease-in-out infinite;
  }

  .now-playing-label.paused::before {
    animation: none;
    background: var(--text-dim);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .visualizer {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 44px;
    margin-bottom: 18px;
  }

  .bar {
    flex: 1;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    opacity: 0.7;
    transform-origin: bottom;
    transition: height 0.1s ease;
  }

  .bar.paused {
    animation: none !important;
    height: 4px !important;
    opacity: 0.25;
  }

  .bar:nth-child(1)  { animation: eq 0.9s  0.0s  ease-in-out infinite alternate; }
  .bar:nth-child(2)  { animation: eq 0.7s  0.1s  ease-in-out infinite alternate; }
  .bar:nth-child(3)  { animation: eq 1.1s  0.05s ease-in-out infinite alternate; }
  .bar:nth-child(4)  { animation: eq 0.8s  0.2s  ease-in-out infinite alternate; }
  .bar:nth-child(5)  { animation: eq 1.0s  0.15s ease-in-out infinite alternate; }
  .bar:nth-child(6)  { animation: eq 0.6s  0.3s  ease-in-out infinite alternate; }
  .bar:nth-child(7)  { animation: eq 0.95s 0.08s ease-in-out infinite alternate; }
  .bar:nth-child(8)  { animation: eq 1.2s  0.25s ease-in-out infinite alternate; }
  .bar:nth-child(9)  { animation: eq 0.75s 0.12s ease-in-out infinite alternate; }
  .bar:nth-child(10) { animation: eq 1.05s 0.18s ease-in-out infinite alternate; }
  .bar:nth-child(11) { animation: eq 0.85s 0.35s ease-in-out infinite alternate; }
  .bar:nth-child(12) { animation: eq 0.65s 0.04s ease-in-out infinite alternate; }
  .bar:nth-child(13) { animation: eq 1.15s 0.22s ease-in-out infinite alternate; }
  .bar:nth-child(14) { animation: eq 0.92s 0.16s ease-in-out infinite alternate; }
  .bar:nth-child(15) { animation: eq 0.78s 0.28s ease-in-out infinite alternate; }
  .bar:nth-child(16) { animation: eq 1.0s  0.10s ease-in-out infinite alternate; }
  .bar:nth-child(17) { animation: eq 0.88s 0.32s ease-in-out infinite alternate; }
  .bar:nth-child(18) { animation: eq 0.72s 0.06s ease-in-out infinite alternate; }
  .bar:nth-child(19) { animation: eq 1.08s 0.20s ease-in-out infinite alternate; }
  .bar:nth-child(20) { animation: eq 0.82s 0.14s ease-in-out infinite alternate; }

  @keyframes eq {
    from { height: 4px; opacity: 0.4; }
    to   { height: 38px; opacity: 0.9; }
  }

  .track-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.01em;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-number {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 18px;
  }

  /* PROGRESS BAR */
  .progress-area {
    margin-bottom: 18px;
  }

  .progress-track {
    width: 100%;
    height: 4px;
    background: var(--surface3);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    width: 0%;
    transition: width 0.2s linear;
    pointer-events: none;
  }

  .progress-thumb-hit {
    position: absolute;
    top: -10px;
    left: 0;
    right: 0;
    bottom: -10px;
    cursor: pointer;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  /* CONTROLS */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 8px;
    transition: color 0.15s, background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .ctrl-btn:active { transform: scale(0.88); }

  .ctrl-btn:hover { color: var(--text); background: var(--surface2); }

  .ctrl-btn.active {
    color: var(--accent);
  }

  .ctrl-btn svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  .play-btn {
    width: 64px;
    height: 64px;
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0a0a0c;
    transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 0 0 0 var(--accent-glow);
    flex-shrink: 0;
  }

  .play-btn:active { transform: scale(0.92); }

  .play-btn.playing {
    box-shadow: 0 0 0 8px var(--accent-dim);
  }

  .play-btn svg {
    width: 28px;
    height: 28px;
    fill: currentColor;
  }

  /* VOLUME */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .volume-icon {
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .volume-icon svg { width: 18px; height: 18px; fill: currentColor; }

  .volume-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 999px;
    background: var(--surface3);
    outline: none;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: var(--text);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .volume-slider::-webkit-slider-thumb:active {
    transform: scale(1.2);
    background: var(--accent);
  }

  .volume-slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    background: var(--text);
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }

  /* SEARCH */
  .search-row {
    width: 100%;
    max-width: 480px;
    padding: 12px 20px 0;
  }

  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
  }
  .search-icon svg { width: 16px; height: 16px; fill: currentColor; }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px 11px 40px;
    font-size: 14px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }

  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: rgba(232,255,71,0.3); }

  /* PLAYLIST */
  .playlist-section {
    width: 100%;
    max-width: 480px;
    padding: 12px 20px 100px;
    flex: 1;
  }

  .playlist-header {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .playlist {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .track-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.12s;
    border: 1px solid transparent;
    position: relative;
  }

  .track-item:active { background: var(--surface3); }
  .track-item:hover { background: var(--surface2); }

  .track-item.active {
    background: var(--surface2);
    border-color: rgba(232,255,71,0.15);
  }

  .track-idx {
    font-size: 12px;
    color: var(--text-dim);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .track-item.active .track-idx {
    display: none;
  }

  .mini-bars {
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
    width: 20px;
    flex-shrink: 0;
  }

  .mini-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    transform-origin: bottom;
  }

  .mini-bar:nth-child(1) { animation: eq 0.9s 0.0s ease-in-out infinite alternate; }
  .mini-bar:nth-child(2) { animation: eq 0.7s 0.2s ease-in-out infinite alternate; }
  .mini-bar:nth-child(3) { animation: eq 1.1s 0.1s ease-in-out infinite alternate; }

  .track-item.active .mini-bars { display: flex; }

  .track-item.active.paused .mini-bars { display: flex; }
  .track-item.active.paused .mini-bar { animation: none !important; height: 4px !important; }

  .track-info { flex: 1; min-width: 0; }

  .track-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .track-item.active .track-name { color: var(--accent); }

  .track-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .track-dur {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .track-item.active .track-dur { color: var(--accent); opacity: 0.7; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  .empty-state svg { width: 40px; height: 40px; fill: var(--text-dim); margin-bottom: 12px; }
  .empty-state h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
  .empty-state p { font-size: 13px; line-height: 1.5; }

  .empty-state code {
    display: inline-block;
    margin-top: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--accent);
    font-family: monospace;
    letter-spacing: 0.02em;
  }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 24px 20px;
    color: var(--text-muted);
    font-size: 14px;
    display: none;
  }

  /* LOADING */
  .loading-state {
    text-align: center;
    padding: 32px 20px;
    color: var(--text-muted);
    font-size: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--surface3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* TRACK SECTION SEPARATOR */
  .section-sep {
    height: 1px;
    background: var(--border);
    margin: 8px 0;
  }

  /* ADD FILES HINT */
  .add-files-hint {
    background: var(--surface);
    border: 1px dashed rgba(232,255,71,0.2);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 12px;
  }

  .add-files-hint:hover { border-color: rgba(232,255,71,0.4); background: var(--surface2); }
  .add-files-hint:active { background: var(--surface3); }

  .add-files-hint svg { width: 20px; height: 20px; fill: var(--accent); opacity: 0.7; flex-shrink: 0; }

  .add-files-hint-text { flex: 1; }
  .add-files-hint-text strong { font-size: 13px; font-weight: 600; color: var(--text); display: block; }
  .add-files-hint-text span { font-size: 12px; color: var(--text-muted); }

  #file-input { display: none; }
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    GYM
    <span>PLAYER</span>
  </div>
  <div class="song-count-badge" id="song-count">0 tracks</div>
</header>

<div class="player-section">
  <div class="now-playing-card">
    <div class="now-playing-label paused" id="np-label">NOW PLAYING</div>

    <div class="visualizer" id="visualizer">
      <div class="bar paused"></div><div class="bar paused"></div><div class="bar paused"></div>
      <div class="bar paused"></div><div class="bar paused"></div><div class="bar paused"></div>
      <div class="bar paused"></div><div class="bar paused"></div><div class="bar paused"></div>
      <div class="bar paused"></div><div class="bar paused"></div><div class="bar paused"></div>
      <div class="bar paused"></div><div class="bar paused"></div><div class="bar paused"></div>
      <div class="bar paused"></div><div class="bar paused"></div><div class="bar paused"></div>
      <div class="bar paused"></div><div class="bar paused"></div>
    </div>

    <div class="track-title" id="np-title">No track selected</div>
    <div class="track-number" id="np-sub">Select a track below</div>

    <div class="progress-area">
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-thumb-hit" id="progress-hit"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-shuffle" title="Shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M18 4l3 3-3 3M14 7h7M18 20l3-3-3-3M14 17h7M3 7h5a4 4 0 014 4v.5M3 17h5a4 4 0 01-4-4v-.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-prev" title="Previous" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button class="play-btn" id="btn-play" aria-label="Play/Pause">
        <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-next" title="Next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-repeat" title="Repeat" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <div class="volume-icon">
        <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>
      <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
    </div>
  </div>
</div>

<div class="search-row">
  <div class="search-input-wrap">
    <div class="search-icon">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </div>
    <input class="search-input" type="search" id="search-input" placeholder="Search tracks…">
  </div>
</div>

<div class="playlist-section">
  <label class="add-files-hint" for="file-input">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
    <div class="add-files-hint-text">
      <strong>Add MP3 files</strong>
      <span>Tap to browse or load from gymSongs folder</span>
    </div>
  </label>
  <input type="file" id="file-input" accept=".mp3,audio/mpeg,audio/*" multiple>

  <div class="playlist-header" id="playlist-label">TRACKS</div>

  <div class="playlist" id="playlist">
    <div class="empty-state" id="empty-state">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm12-2a3 3 0 11-6 0 3 3 0 016 0z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      <h3>No tracks loaded</h3>
      <p>Add your MP3 files above<br>or place them in your<br><code>gymSongs/</code> folder</p>
    </div>
  </div>
  <div class="no-results" id="no-results">No tracks match your search.</div>
</div>

<div class="toast" id="toast"></div>

<audio id="audio-el"></audio>

<script>
const audio = document.getElementById('audio-el');
const btnPlay = document.getElementById('btn-play');
const playIcon = document.getElementById('play-icon');
const pauseIcon = document.getElementById('pause-icon');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnShuffle = document.getElementById('btn-shuffle');
const btnRepeat = document.getElementById('btn-repeat');
const progressFill = document.getElementById('progress-fill');
const progressHit = document.getElementById('progress-hit');
const progressTrack = document.getElementById('progress-track');
const timeCur = document.getElementById('time-cur');
const timeTotal = document.getElementById('time-total');
const volumeSlider = document.getElementById('volume-slider');
const npTitle = document.getElementById('np-title');
const npSub = document.getElementById('np-sub');
const npLabel = document.getElementById('np-label');
const playlist = document.getElementById('playlist');
const emptyState = document.getElementById('empty-state');
const noResults = document.getElementById('no-results');
const searchInput = document.getElementById('search-input');
const songCount = document.getElementById('song-count');
const playlistLabel = document.getElementById('playlist-label');
const fileInput = document.getElementById('file-input');
const visualizerBars = document.querySelectorAll('.visualizer .bar');
const toastEl = document.getElementById('toast');

let tracks = [];
let currentIndex = -1;
let isShuffle = false;
let isRepeat = false;
let isPlaying = false;
let shuffleOrder = [];
let searchQuery = '';
let toastTimer = null;
let durations = {};

function formatTime(s) {
  if (!isFinite(s) || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function showToast(msg) {
  if (toastTimer) clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function updateSongCount() {
  const n = tracks.length;
  songCount.textContent = n === 1 ? '1 track' : `${n} tracks`;
}

function buildShuffleOrder() {
  shuffleOrder = [...Array(tracks.length).keys()];
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
}

function getDisplayName(filename) {
  return filename;
}

function renderPlaylist() {
  const q = searchQuery.toLowerCase();
  const items = [];
  playlist.querySelectorAll('.track-item').forEach(el => el.remove());
  noResults.style.display = 'none';

  if (tracks.length === 0) {
    emptyState.style.display = 'block';
    updateSongCount();
    return;
  }
  emptyState.style.display = 'none';

  let visible = 0;
  tracks.forEach((t, i) => {
    const name = getDisplayName(t.name);
    if (q && !name.toLowerCase().includes(q)) return;
    visible++;

    const item = document.createElement('div');
    item.className = 'track-item' + (i === currentIndex ? ' active' : '') + (!isPlaying && i === currentIndex ? ' paused' : '');
    item.dataset.index = i;

    const dur = durations[i] ? formatTime(durations[i]) : '—';

    item.innerHTML = `
      <span class="track-idx">${i + 1}</span>
      <div class="mini-bars">
        <div class="mini-bar" style="height:6px"></div>
        <div class="mini-bar" style="height:10px"></div>
        <div class="mini-bar" style="height:4px"></div>
      </div>
      <div class="track-info">
        <div class="track-name">${escHtml(name)}</div>
      </div>
      <span class="track-dur">${dur}</span>
    `;

    item.addEventListener('click', () => loadAndPlay(i));
    playlist.appendChild(item);
    items.push(item);
  });

  if (visible === 0 && q) {
    noResults.style.display = 'block';
  }

  updateSongCount();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setPlayingState(playing) {
  isPlaying = playing;
  playIcon.style.display = playing ? 'none' : 'block';
  pauseIcon.style.display = playing ? 'block' : 'none';
  btnPlay.classList.toggle('playing', playing);
  npLabel.classList.toggle('paused', !playing);
  visualizerBars.forEach(b => b.classList.toggle('paused', !playing));

  const activeItem = playlist.querySelector('.track-item.active');
  if (activeItem) {
    activeItem.classList.toggle('paused', !playing);
  }
}

function loadAndPlay(index) {
  if (tracks.length === 0) return;
  index = ((index % tracks.length) + tracks.length) % tracks.length;
  currentIndex = index;

  const t = tracks[index];
  const url = t.url || URL.createObjectURL(t.file);
  if (!t.url && t.file) t.url = url;

  audio.src = url;
  audio.load();
  audio.volume = volumeSlider.value / 100;

  const name = getDisplayName(t.name);
  npTitle.textContent = name;
  npSub.textContent = `Track ${index + 1} of ${tracks.length}`;

  audio.play().then(() => {
    setPlayingState(true);
  }).catch(e => {
    console.warn('Playback error:', e);
    setPlayingState(false);
  });

  progressFill.style.width = '0%';
  timeCur.textContent = '0:00';

  renderPlaylist();
  scrollToActive();

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: name, album: 'GYM PLAYER' });
    navigator.mediaSession.playbackState = 'playing';
  }
  audio.addEventListener('loadedmetadata', function onMeta() {
    if ('mediaSession' in navigator && isFinite(audio.duration)) {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: 1,
        position: 0
      });
    }
    audio.removeEventListener('loadedmetadata', onMeta);
  });
}

function scrollToActive() {
  const el = playlist.querySelector('.track-item.active');
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function nextTrack() {
  if (tracks.length === 0) return;
  if (isShuffle) {
    const pos = shuffleOrder.indexOf(currentIndex);
    const nextPos = (pos + 1) % shuffleOrder.length;
    loadAndPlay(shuffleOrder[nextPos]);
  } else {
    loadAndPlay(currentIndex + 1);
  }
}

function prevTrack() {
  if (tracks.length === 0) return;
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  if (isShuffle) {
    const pos = shuffleOrder.indexOf(currentIndex);
    const prevPos = (pos - 1 + shuffleOrder.length) % shuffleOrder.length;
    loadAndPlay(shuffleOrder[prevPos]);
  } else {
    loadAndPlay(currentIndex - 1);
  }
}

btnPlay.addEventListener('click', () => {
  if (tracks.length === 0) { showToast('Add tracks first'); return; }
  if (currentIndex === -1) { loadAndPlay(0); return; }
  if (isPlaying) {
    audio.pause();
  } else {
    audio.play().then(() => setPlayingState(true));
  }
});

btnPrev.addEventListener('click', prevTrack);
btnNext.addEventListener('click', nextTrack);

btnShuffle.addEventListener('click', () => {
  isShuffle = !isShuffle;
  btnShuffle.classList.toggle('active', isShuffle);
  if (isShuffle) {
    isRepeat = false;
    btnRepeat.classList.remove('active');
    buildShuffleOrder();
  }
  showToast(isShuffle ? 'Shuffle on' : 'Shuffle off');
});

btnRepeat.addEventListener('click', () => {
  isRepeat = !isRepeat;
  btnRepeat.classList.toggle('active', isRepeat);
  if (isRepeat) {
    isShuffle = false;
    btnShuffle.classList.remove('active');
  }
  showToast(isRepeat ? 'Repeat on' : 'Repeat off');
});

audio.addEventListener('pause', () => setPlayingState(false));
audio.addEventListener('play', () => setPlayingState(true));

audio.addEventListener('timeupdate', () => {
  if (!isFinite(audio.duration)) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeCur.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = formatTime(audio.duration);
  if (currentIndex >= 0) {
    durations[currentIndex] = audio.duration;
    const item = playlist.querySelector(`.track-item[data-index="${currentIndex}"] .track-dur`);
    if (item) item.textContent = formatTime(audio.duration);
  }
});

function handleTrackEnd() {
  if (isRepeat) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  } else if (tracks.length > 1) {
    nextTrack();
  } else {
    setPlayingState(false);
    progressFill.style.width = '0%';
    timeCur.textContent = '0:00';
  }
}

// Primary: ended event (works when screen is on)
audio.addEventListener('ended', handleTrackEnd);

// Fallback watchdog: polls every second — works on locked screens
// where 'ended' may not fire reliably
let watchdogHandled = false;
setInterval(() => {
  if (!isPlaying) return;
  if (!isFinite(audio.duration) || audio.duration === 0) return;
  if (audio.ended || (!audio.paused && audio.currentTime >= audio.duration - 0.3)) {
    if (!watchdogHandled) {
      watchdogHandled = true;
      handleTrackEnd();
    }
  } else {
    watchdogHandled = false;
  }

  // Keep media session position in sync (helps lock screen controls)
  if ('mediaSession' in navigator && isFinite(audio.duration) && isPlaying) {
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate,
        position: Math.min(audio.currentTime, audio.duration)
      });
    } catch(e) {}
  }
}, 1000);

function seekFromEvent(e) {
  const rect = progressTrack.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  if (isFinite(audio.duration)) {
    audio.currentTime = ratio * audio.duration;
  }
}

progressHit.addEventListener('click', seekFromEvent);
progressHit.addEventListener('touchstart', e => { e.preventDefault(); seekFromEvent(e); }, { passive: false });

let seeking = false;
progressHit.addEventListener('mousedown', () => { seeking = true; });
document.addEventListener('mousemove', e => { if (seeking) seekFromEvent(e); });
document.addEventListener('mouseup', () => { seeking = false; });

volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value / 100; });

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  renderPlaylist();
});

function addFiles(fileList) {
  let added = 0;
  Array.from(fileList).forEach(f => {
    if (!f.name.match(/\.(mp3|m4a|ogg|wav|flac|aac)$/i)) return;
    if (tracks.some(t => t.name === f.name && t.size === f.size)) return;
    tracks.push({ name: f.name, file: f, url: null, size: f.size });
    added++;
  });
  if (added > 0) {
    buildShuffleOrder();
    renderPlaylist();
    preloadDurations();
    showToast(`Added ${added} track${added > 1 ? 's' : ''}`);
  } else {
    showToast('No new tracks found');
  }
}

fileInput.addEventListener('change', e => {
  addFiles(e.target.files);
  fileInput.value = '';
});

const body = document.body;
body.addEventListener('dragover', e => { e.preventDefault(); });
body.addEventListener('drop', e => {
  e.preventDefault();
  addFiles(e.dataTransfer.files);
});

function preloadDurations() {
  tracks.forEach((t, i) => {
    if (durations[i]) return;
    const tmp = new Audio();
    tmp.preload = 'metadata';
    const url = t.url || URL.createObjectURL(t.file);
    if (!t.url) t.url = url;
    tmp.src = url;
    tmp.addEventListener('loadedmetadata', () => {
      durations[i] = tmp.duration;
      const item = playlist.querySelector(`.track-item[data-index="${i}"] .track-dur`);
      if (item) item.textContent = formatTime(tmp.duration);
    });
  });
}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
  navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
  navigator.mediaSession.setActionHandler('previoustrack', () => { prevTrack(); });
  navigator.mediaSession.setActionHandler('nexttrack', () => { nextTrack(); });
  navigator.mediaSession.setActionHandler('seekto', details => {
    if (details.seekTime !== undefined && isFinite(audio.duration)) {
      audio.currentTime = details.seekTime;
    }
  });
}

const GYM_SONGS = [
  { file: 'BUILT_FOR_THIS.mp3',   title: 'Beast Leash King'      },
  { file: 'City in Flames.mp3',   title: 'City in Flames'        },
  { file: 'GOD_MODE.mp3',         title: 'GOD MODE'              },
  { file: 'NO_LIMIT.mp3',         title: 'No Limit Mode'         },
  { file: 'NO_PERMISSION.mp3',    title: 'NO PERMISSION START'   },
  { file: 'OVERLOAD.mp3',         title: 'DELETE OVERLOAD'       },
  { file: 'TOXIC_PRESSURE.mp3',   title: 'Pressure Weight'       },
];

GYM_SONGS.forEach(s => {
  tracks.push({ name: s.title, file: null, url: 'gymSongs/' + s.file, size: 0 });
});

buildShuffleOrder();
renderPlaylist();
</script>
</body>
</html>
